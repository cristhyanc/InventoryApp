name: InventoryApp self-hosted Docker validation

# Pilot only: dispatch from main, check out reviewed main code, no PR heads, no AI credentials.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventoryapp-self-hosted-docker-validation
  cancel-in-progress: false

jobs:
  validate:
    name: Validate trusted main inside local development image
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, inventory-agent]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false

      # The service account UID/GID is not fixed across installations. Run the
      # container as the runner user so the mounted checkout remains writable,
      # even with all Linux capabilities dropped. Do not mount the Docker socket.
      - name: Validate backend and frontend in Docker
        run: |
          set -euo pipefail
          docker image inspect inventoryapp-dev:local >/dev/null
          echo "Runner user: $(id -u):$(id -g)"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace" \
            --workdir /workspace \
            --env HOME=/tmp \
            --env TZ=UTC \
            --env DOTNET_CLI_TELEMETRY_OPTOUT=1 \
            inventoryapp-dev:local \
            bash -c '
              set -euo pipefail
              dotnet --version
              node --version
              npm --version
              git --version
              git ls-files -- backend/InventoryApi >/dev/null
              bash scripts/validate.sh
            '
