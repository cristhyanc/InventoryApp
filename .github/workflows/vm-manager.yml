name: Build and test API

# Runs on every push to develop and main. It builds and tests the API and deploys nothing:
# production changes only through the manually started Deploy Production workflow
# (deploy-production.yml, issue #343).
on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

env:
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 10.0.x
  TEST_PROJECT: ./backend/InventoryApi.Tests/InventoryApi.Tests.csproj

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}

      - name: Restore
        run: dotnet restore "$TEST_PROJECT"

      - name: Build
        run: dotnet build "$TEST_PROJECT" --configuration "$CONFIGURATION" --no-restore

      - name: Test
        run: dotnet test "$TEST_PROJECT" --configuration "$CONFIGURATION" --no-build
