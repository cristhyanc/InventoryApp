name: Build and deploy .NET Core application to Web App vm-manager with API Management Service VmInventoryApi-InventoryApi
on:
  push:
    branches:
    - main
permissions:
  id-token: write
  contents: read
env:
  AZURE_WEBAPP_NAME: vm-manager
  AZURE_WEBAPP_PACKAGE_PATH: ./publish
  AZURE_APIM_RESOURCE_PATH: /
  AZURE_APIM_RESOURCEGROUP: vm-manager
  AZURE_APIM_SERVICENAME: VmInventoryApi
  AZURE_APIM_API_ID: InventoryApi
  AZURE_APIM_APPSERVICEURL: https://vm-manager-axhadxh5hjehayh0.australiaeast-01.azurewebsites.net
  SWASHBUCLE_ASPNET_CORE_CLI_PACKAGE_VERSION: 8.1.1
  SWASHBUCKLE_DOTNET_CORE_VERSION: 8.x
  API_IMPORT_VERSION: v1
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 10.0.x
  API_PROJECT: ./backend/InventoryApi/InventoryApi.csproj
  TEST_PROJECT: ./backend/InventoryApi.Tests/InventoryApi.Tests.csproj
  API_PROJECT_DIRECTORY: ./backend/InventoryApi
  API_IMPORT_DLL: ./backend/InventoryApi/bin/Release/net10.0/InventoryApi.dll
jobs:
  build:
    environment: VmInventoryApi_Env
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
    - name: Setup SwashBuckle .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.SWASHBUCKLE_DOTNET_CORE_VERSION }}
    - name: Restore
      run: dotnet restore "${{ env.TEST_PROJECT }}"
    - name: Build
      run: dotnet build "${{ env.TEST_PROJECT }}" --configuration ${{ env.CONFIGURATION }} --no-restore
    - name: Test
      run: dotnet test "${{ env.TEST_PROJECT }}" --configuration ${{ env.CONFIGURATION }} --no-build
    - name: Publish
      run: dotnet publish "${{ env.API_PROJECT }}" --configuration ${{ env.CONFIGURATION }} --no-build --output "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"
    - name: Install Swashbuckle CLI .NET Global Tool
      run: dotnet tool install --global Swashbuckle.AspNetCore.Cli --version ${{ env.SWASHBUCLE_ASPNET_CORE_CLI_PACKAGE_VERSION }}
      working-directory: ${{ env.API_PROJECT_DIRECTORY }}
    - name: Publish Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: webapp
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
  deploy:
    environment: VmInventoryApi_Env
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: webapp
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ vars.VmInventoryApi_CLIENT_ID_4D7F }}
        tenant-id: ${{ vars.VmInventoryApi_TENANT_ID_4D7F }}
        subscription-id: ${{ vars.VmInventoryApi_SUBSCRIPTION_ID_4D7F }}
    - name: Deploy to Azure WebApp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
    - name: Import API into Azure API Management
      run: az apim api import --path "${{ env.AZURE_APIM_RESOURCE_PATH }}" --resource-group "${{ env.AZURE_APIM_RESOURCEGROUP }}" --service-name "${{ env.AZURE_APIM_SERVICENAME }}" --api-id "${{ env.AZURE_APIM_API_ID }}" --service-url "${{ env.AZURE_APIM_APPSERVICEURL }}" --specification-format OpenApi --subscription-required false
    - name: logout
      run: >
        az logout
