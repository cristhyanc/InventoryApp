name: Build and test API

# Runs on every push to develop and main. It builds and tests the API and deploys nothing:
# production changes only through the manually started Deploy Production workflow
# (deploy-production.yml, issue #343).
on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

env:
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 10.0.x
  # The solution holds both backend test projects (Inventory.UnitTests and Inventory.IntegrationTests,
  # issue #311), so restoring, building and testing it runs every backend test.
  BACKEND_SOLUTION: ./backend/InventoryApi/InventoryApi.slnx

jobs:
  build:
    runs-on: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL == 'true' && fromJSON('["self-hosted","linux","x64","inventory-agent"]') || 'ubuntu-latest' }}

    steps:
      - name: Report and validate runner mode
        env:
          RUNNER_MODE: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL }}
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          case "$RUNNER_MODE" in
            true) selected=self-hosted ;;
            ''|false) selected=github-hosted ;;
            *) echo "::error::The repository variable INVENTORY_AGENT_SELF_HOSTED_ALL must be exactly true, false or unset. See docs/automation.md § Runner placement."; exit 1 ;;
          esac
          echo "Runner mode: INVENTORY_AGENT_SELF_HOSTED_ALL=${RUNNER_MODE:-<unset>} selects $selected runners."
          echo "This job runs on $RUNNER_NAME ($RUNNER_KIND)."
          if [ "$RUNNER_KIND" != "$selected" ]; then
            echo "::error::This job runs on a $RUNNER_KIND runner, but INVENTORY_AGENT_SELF_HOSTED_ALL now selects $selected runners; the variable changed after the job was queued. Re-run the job. See docs/automation.md § Runner placement."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The self-hosted runner keeps its workspace between jobs, so no token is left in .git/config.
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}

      - name: Restore
        run: dotnet restore "$BACKEND_SOLUTION"

      - name: Build
        run: dotnet build "$BACKEND_SOLUTION" --configuration "$CONFIGURATION" --no-restore

      - name: Test
        run: dotnet test "$BACKEND_SOLUTION" --configuration "$CONFIGURATION" --no-build --no-restore --collect:"XPlat Code Coverage"
