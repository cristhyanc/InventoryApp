name: Agent repair

# Human-invoked repair attempt (Claude Code) on a pull request that carries `agent-review`.
#
# Authority and lifecycle: AGENTS.md ("Automated task contract") and docs/automation.md ("Failure and retry policy").
# - Runs only when the repository owner comments `@claude repair ...` on an open, non-draft
#   pull request that targets `develop`, carries `agent-review`, and whose head branch is in this repository.
#   (Restricted to the owner for now; widening it to other collaborators is a deliberate later change.)
# - Updates only that pull request's head branch. Never merges, deploys, or pushes anywhere else.
# - Repair counting is human-controlled: the human who comments decides whether an attempt is still
#   permitted (at most two per pull request). This workflow does not count attempts or start on its own.
# - When a repair pushes a commit, a separate least-privilege job verifies the new head and dispatches
#   trusted validation from `main` for that exact SHA. Successful validation dispatches a fresh review
#   only while the human-applied `agent-review` label remains present.

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: agent-repair-pr-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  repair:
    name: Repair pull request on explicit request
    if: |
      github.event.issue.pull_request != null &&
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'agent-review') &&
      startsWith(github.event.comment.body, '@claude repair') &&
      github.event.comment.user.login == github.repository_owner &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      checks: read
      statuses: read
    outputs:
      dispatch_validation: ${{ steps.outcome.outputs.dispatch_validation }}
      pr_number: ${{ steps.outcome.outputs.pr_number }}
      head_sha: ${{ steps.outcome.outputs.head_sha }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.issue.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Resolve and verify pull request head
        id: pr
        run: |
          set -euo pipefail
          pr_json="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json headRefName,headRefOid,baseRefName,isDraft,headRepository,headRepositoryOwner)"
          head_ref="$(jq -r '.headRefName' <<<"$pr_json")"
          start_sha="$(jq -r '.headRefOid // empty' <<<"$pr_json")"
          base_ref="$(jq -r '.baseRefName' <<<"$pr_json")"
          is_draft="$(jq -r '.isDraft' <<<"$pr_json")"
          head_repo="$(jq -r '"\(.headRepositoryOwner.login)/\(.headRepository.name)"' <<<"$pr_json")"

          fail() { echo "::error::$1"; exit 1; }
          [ "$base_ref" = "develop" ] || fail "Repair is only permitted for pull requests targeting develop (base is '$base_ref')."
          [ "$is_draft" = "false" ] || fail "Repair is not permitted on a draft pull request."
          [ "$head_repo" = "$GITHUB_REPOSITORY" ] || fail "Repair is only permitted for branches in this repository (head is '$head_repo')."
          case "$head_ref" in develop|main) fail "Refusing to operate on protected branch '$head_ref'.";; esac
          [[ "$head_ref" =~ ^[A-Za-z0-9._/-]+$ ]] || fail "Unexpected characters in head branch name."
          [[ "$start_sha" =~ ^[0-9a-f]{40}$ ]] || fail "Could not determine the pull request head SHA before the repair."

          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "start_sha=$start_sha" >> "$GITHUB_OUTPUT"

      - name: Check out pull request head branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/inventory-app/package-lock.json

      - name: Run Claude Code repair agent
        id: claude
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          base_branch: develop
          additional_permissions: |
            actions: read
          prompt: |
            You are the InventoryApp implementation agent performing ONE human-authorised repair attempt in GitHub Actions.

            REPOSITORY: ${{ github.repository }}
            PULL REQUEST: #${{ github.event.issue.number }}
            HEAD BRANCH (checked out; the only branch you may change): ${{ steps.pr.outputs.head_ref }}
            BASE BRANCH: develop
            REQUESTED BY: ${{ github.event.comment.user.login }}
            REQUEST COMMENT:
            ${{ github.event.comment.body }}

            Follow CLAUDE.md, AGENTS.md and docs/automation.md exactly. Repair attempts are limited to two per pull request and are counted by humans; this run is one attempt. Do not start another one, and do not attempt anything the request or the review findings do not require.

            Procedure:
            1. Read the pull request with its reviews and comments (`gh pr view ${{ github.event.issue.number }} --comments`), its diff (`gh pr diff ${{ github.event.issue.number }}`), the CI state (`gh pr checks ${{ github.event.issue.number }}`, `gh run view`, and the github_ci tools for failing job logs), and the linked issue (`gh issue view <n>`) so the repair stays inside the issue's acceptance criteria and exclusions.
            2. Identify the concrete CI or review failures the request refers to. If a repair would require weakening, skipping, or deleting a test, changing an established rule in AGENTS.md or docs/architecture.md, or working outside the issue's scope, stop: post one comment with `gh pr comment` explaining exactly which human decision is needed, change nothing, and finish.
            3. Make the smallest coherent fix on the checked-out head branch. Add or adjust tests as AGENTS.md requires.
            3a. Keep documentation accurate: when the repair changes behaviour, contracts, architecture, configuration, automation, deployment, operations or user workflows, or when the review findings identify missing, inaccurate or incomplete documentation, update the affected documentation on the head branch in the same repair, consistent with the issue's Documentation impact decision. You cannot and must not edit the pull request description. If the pull request's "## Documentation impact" declaration (its `Decision:` or `Evidence:` line) is no longer accurate after your repair, state in your closing comment exactly what must be corrected, quoting the exact replacement text, so the human can edit the description; validation reruns when the description is edited.
            4. Run the complete repository validation with exactly `bash scripts/validate.sh`. Record the real result.
            5. Review the diff for secrets, local databases, generated output, accidental migrations, and unrelated edits.
            6. Commit with a focused message and push with exactly `git push origin ${{ steps.pr.outputs.head_ref }}`. Never force-push, rebase, or rewrite history.
            7. Post one comment with `gh pr comment` describing what was changed and why, which findings it addresses, the exact validation command and its actual result, and anything you could not resolve. Do not change labels, do not edit the PR description, do not merge.

            Hard limits: do not merge, approve, deploy, run migrations against any environment, modify labels, change workflows, secrets or repository settings, touch anything outside the acceptance criteria, or claim a command passed unless it ran and succeeded in this session.
          claude_args: |
            --model opus
            --effort high
            --max-turns 200
            --allowedTools "Edit,MultiEdit,Write,mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log"
            "Bash(gh pr view *),Bash(gh pr diff *),Bash(gh pr checks *),Bash(gh pr comment *),Bash(gh issue view *),Bash(gh run view *),Bash(gh run list *)"
            "Bash(git status *),Bash(git diff *),Bash(git log *),Bash(git show *),Bash(git branch --show-current),Bash(git rev-parse *)"
            "Bash(git rm -- backend/*),Bash(git rm -- frontend/*),Bash(git rm -- docs/*),Bash(git rm -- scripts/*)"
            "Bash(git add *),Bash(git commit *),Bash(git push origin ${{ steps.pr.outputs.head_ref }} *)"
            "Bash(bash scripts/validate.sh),Bash(dotnet *),Bash(npm --prefix frontend/inventory-app *)"
            --disallowedTools "WebFetch,WebSearch"
            "Bash(git push * --force *),Bash(git push * -f *),Bash(git push * --force-with-lease *),Bash(git push --force *),Bash(git push -f *)"
            "Bash(git reset --hard *),Bash(git rebase *),Bash(git checkout *),Bash(git switch *),Bash(git merge *)"
            "Bash(gh pr merge *),Bash(gh pr review *),Bash(gh pr edit *),Bash(gh pr create *),Bash(gh issue edit *),Bash(gh issue comment *),Bash(gh api *),Bash(gh workflow *),Bash(gh run rerun *),Bash(gh run cancel *),Bash(gh release *),Bash(gh secret *),Bash(gh variable *),Bash(gh label *)"

      - name: Record outcome on the pull request
        id: outcome
        if: always()
        env:
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          START_SHA: ${{ steps.pr.outputs.start_sha }}
        run: |
          set -euo pipefail
          {
            echo "dispatch_validation=false"
            echo "pr_number=$PR_NUMBER"
            echo "head_sha="
          } >> "$GITHUB_OUTPUT"

          # Determine the PR head after the run. A failure here must not fail the step:
          # the comment then reports that the head could not be verified.
          end_sha=""
          if end_json="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid 2>/dev/null)"; then
            end_sha="$(jq -r '.headRefOid // empty' <<<"$end_json" 2>/dev/null || true)"
          fi
          [[ "$end_sha" =~ ^[0-9a-f]{40}$ ]] || end_sha=""

          case "$CLAUDE_OUTCOME" in
            cancelled) status_line="This repair run was cancelled (superseded by a newer repair request on this pull request)." ;;
            success)   status_line="The repair agent step finished successfully." ;;
            *)         status_line="The repair agent step did not finish successfully (outcome: ${CLAUDE_OUTCOME:-unknown})." ;;
          esac

          if [ -n "$START_SHA" ] && [ -n "$end_sha" ] && [ "$START_SHA" != "$end_sha" ]; then
            {
              echo "dispatch_validation=true"
              echo "head_sha=$end_sha"
            } >> "$GITHUB_OUTPUT"

            body="$(cat <<EOF
          Repair run on branch $HEAD_REF finished. $status_line

          The pull request head changed from $START_SHA to $end_sha. A separate follow-up job will dispatch trusted validation for the new exact SHA. If validation passes and the human-applied \`agent-review\` label is still present, a fresh independent review will be dispatched automatically. Human approval and merge remain required.

          Repair attempts are limited to two per pull request and are counted by you; after the second failed attempt, label the issue agent-blocked and take over.

          Agent step outcome: ${CLAUDE_OUTCOME:-unknown}
          Run: $RUN_URL
          EOF
          )"
          elif [ -n "$START_SHA" ] && [ -n "$end_sha" ]; then
            body="$(cat <<EOF
          Repair run on branch $HEAD_REF finished. $status_line

          No new commit was pushed by this repair run: the pull request head is still $end_sha. No exact-SHA validation or review was dispatched. Read the agent's comment above (if any) and the run log before deciding whether another repair attempt is warranted.

          Repair attempts are limited to two per pull request and are counted by you; after the second failed attempt, label the issue agent-blocked and take over.

          Agent step outcome: ${CLAUDE_OUTCOME:-unknown}
          Run: $RUN_URL
          EOF
          )"
          else
            body="$(cat <<EOF
          Repair run on branch ${HEAD_REF:-unknown} finished. $status_line

          This workflow could not verify whether the pull request head changed during the run (head SHA before: ${START_SHA:-unavailable}; after: ${end_sha:-unavailable}). It is not claiming that a push occurred and did not dispatch validation or review. Inspect the pull request's commits, checks, and run log.

          Repair attempts are limited to two per pull request and are counted by you; after the second failed attempt, label the issue agent-blocked and take over.

          Agent step outcome: ${CLAUDE_OUTCOME:-unknown}
          Run: $RUN_URL
          EOF
          )"
          fi

          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"

  dispatch-validation:
    name: Dispatch exact-SHA validation
    needs: repair
    if: always() && needs.repair.outputs.dispatch_validation == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read

    steps:
      - name: Verify repaired head and dispatch trusted validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.repair.outputs.pr_number }}
          HEAD_SHA: ${{ needs.repair.outputs.head_sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          pr_json="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json state,isDraft,baseRefName,headRefName,headRefOid,headRepository,headRepositoryOwner,labels)"
          state="$(jq -r '.state' <<<"$pr_json")"
          is_draft="$(jq -r '.isDraft' <<<"$pr_json")"
          base_ref="$(jq -r '.baseRefName' <<<"$pr_json")"
          head_ref="$(jq -r '.headRefName' <<<"$pr_json")"
          current_sha="$(jq -r '.headRefOid // empty' <<<"$pr_json")"
          head_repo="$(jq -r '"\(.headRepositoryOwner.login)/\(.headRepository.name)"' <<<"$pr_json")"
          author="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq '.user.login // empty')"

          [ "$state" = "OPEN" ] || fail "Pull request #$PR_NUMBER is not open."
          [ "$is_draft" = "false" ] || fail "Pull request #$PR_NUMBER is a draft."
          [ "$base_ref" = "develop" ] || fail "Automated validation is limited to pull requests targeting develop."
          [ "$head_repo" = "$GITHUB_REPOSITORY" ] || fail "Automated validation is limited to same-repository branches."
          [[ "$head_ref" == agent/issue-* ]] || fail "Automated validation requires an agent/issue-* head branch."
          [ "$author" = "github-actions[bot]" ] || fail "Automated validation requires github-actions[bot] as the pull request author."
          [ "$current_sha" = "$HEAD_SHA" ] || fail "Refusing stale validation dispatch: pull request head is $current_sha, expected $HEAD_SHA."
          jq -e 'any(.labels[]?; .name == "agent-review")' <<<"$pr_json" >/dev/null \
            || fail "The agent-review label is required before repair follow-up validation."

          changed_files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')"
          if grep -Eq '^\.github/workflows/' <<<"$changed_files"; then
            fail "Pull requests that change .github/workflows/** require manual validation and review."
          fi

          gh workflow run validate.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f pr_number="$PR_NUMBER" \
            -f head_sha="$HEAD_SHA" \
            -f dispatch_review=true
