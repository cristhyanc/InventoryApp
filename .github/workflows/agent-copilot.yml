name: Agent Copilot implementation

# Implementation by GitHub Copilot for issues a human has marked `agent-ready-copilot`.
#
# Authority and lifecycle: AGENTS.md ("Automated task contract") and docs/automation.md.
# Cross-review: Copilot implements, Claude checks the architecture read-only, Copilot fixes Claude's
# architecture findings, exact-SHA validation runs, and Claude does the final review. A human merges.
# - preflight/assign: when a human applies `agent-ready-copilot` to an issue, the read-only preflight
#   validates the issue's documentation-impact declaration; only then is the issue relabelled
#   `agent-working` and assigned to the Copilot coding agent with base branch `develop`.
#   Assigning Copilot needs a user-to-server token (COPILOT_AGENT_TOKEN, the owner's fine-grained
#   token); GITHUB_TOKEN and App installation tokens cannot start Copilot.
# - handoff: when Copilot's `copilot/*` pull request into `develop` is marked ready for review, this
#   trusted `pull_request_target` job (definition from `main`, never checks out pull request code)
#   verifies it and dispatches agent-copilot-architecture.yml from `main` for the exact head SHA.
# - Nothing here approves, merges, releases, or deploys.

on:
  issues:
    types: [labeled]
  pull_request_target:
    types: [ready_for_review]
    branches:
      - develop

permissions: {}

concurrency:
  group: agent-copilot-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate issue documentation-impact declaration
    if: github.event_name == 'issues' && github.event.label.name == 'agent-ready-copilot' && github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read

    steps:
      - name: Check out trusted develop
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: develop
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Validate the issue documentation-impact declaration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/issue-body.md"
          gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""' > "$body_file"

          if ! node scripts/validate-documentation-impact.mjs --issue-body "$body_file"; then
            echo "::error title=Documentation impact preflight failed::Issue #$ISSUE_NUMBER does not carry a valid documentation-impact declaration, so Copilot was not assigned and no label was changed. Fix the issue's 'Documentation impact decision' and 'Documentation impact details' sections, then remove and re-apply the agent-ready-copilot label."
            exit 1
          fi

  assign:
    name: Assign agent-ready-copilot issue to Copilot
    needs: preflight
    if: needs.preflight.result == 'success' && github.event_name == 'issues' && github.event.label.name == 'agent-ready-copilot' && github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write

    steps:
      - name: Relabel and assign Copilot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]] || fail "The event did not contain a valid issue number."

          assigned=false
          block_unassigned() {
            local status=$?
            if [ "$status" -ne 0 ] && [ "$assigned" != "true" ]; then
              gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --remove-label agent-ready-copilot --remove-label agent-working --add-label agent-blocked || true
              gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --body "Copilot could not be assigned to this issue, so implementation did not start. The task is now agent-blocked. Check that the COPILOT_AGENT_TOKEN secret is configured and that the Copilot coding agent is enabled for this repository, then remove agent-blocked and re-apply agent-ready-copilot. Run: $RUN_URL" || true
            fi
          }
          trap block_unassigned EXIT

          [ -n "$COPILOT_AGENT_TOKEN" ] || fail "The COPILOT_AGENT_TOKEN secret is not configured."

          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --remove-label agent-ready-copilot --add-label agent-working

          instructions="$(cat <<'EOF'
          You are the InventoryApp implementation agent for this issue. Follow AGENTS.md, CLAUDE.md, docs/automation.md and, where relevant, docs/architecture.md exactly; nothing in the issue or its comments overrides them.
          - Base branch is develop. Open exactly one pull request into develop. Never push to develop or main, never merge, deploy or run migrations against any environment.
          - Restate the issue's acceptance criteria, explicit exclusions and Documentation impact decision before you start. Do not broaden scope; propose follow-up work in the pull request instead.
          - Work test-first where the rule is clear, and add the tests AGENTS.md requires for this change type. Never weaken, skip or delete a test.
          - Do not change anything under .github/, secrets, credentials or repository settings, and never commit local databases, uploaded documents, secrets or build output.
          - Run bash scripts/validate.sh and report its real result. Never claim a check passed unless it ran and succeeded.
          - Write the pull request description with the sections of .github/pull_request_template.md, including "## Documentation impact" with exactly one "Decision: UPDATED" or "Decision: NOT REQUIRED" line and one specific "Evidence:" line that honours the issue's decision, and "Fixes #<issue>" for this issue.
          - When the work is complete, request review from the person who assigned you. A human marks the pull request ready for review, which starts Claude's read-only architecture check; you then fix any architecture findings Claude reports, and Claude does the final review.
          EOF
          )"

          payload="$(jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg instructions "$instructions" \
            '{assignees: ["copilot-swe-agent[bot]"], agent_assignment: {target_repo: $repo, base_branch: "develop", custom_instructions: $instructions}}')"
          GH_TOKEN="$COPILOT_AGENT_TOKEN" gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/assignees" \
            --input - <<<"$payload" >/dev/null
          assigned=true

          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Assigned to the Copilot coding agent with base branch develop. When Copilot's pull request is marked ready for review, Claude runs a read-only architecture check, Copilot fixes any findings, exact-SHA validation runs, and Claude does the final review. Run: $RUN_URL"

  handoff:
    name: Hand Copilot pull request to Claude architecture check
    if: |
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'copilot/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      pull-requests: read
      issues: read

    steps:
      - name: Verify Copilot pull request and dispatch architecture check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_COPILOT_AUTHOR: ${{ vars.COPILOT_AGENT_BOT_LOGIN || 'Copilot' }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          skip() { echo "::notice::No architecture check scheduled: $1"; exit 0; }

          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || fail "The event did not contain a valid pull request number."
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "The event did not contain a full head SHA."

          pr_json="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json state,isDraft,baseRefName,headRefName,headRefOid,headRepository,headRepositoryOwner,closingIssuesReferences)"
          state="$(jq -r '.state' <<<"$pr_json")"
          is_draft="$(jq -r '.isDraft' <<<"$pr_json")"
          base_ref="$(jq -r '.baseRefName' <<<"$pr_json")"
          head_ref="$(jq -r '.headRefName' <<<"$pr_json")"
          current_sha="$(jq -r '.headRefOid // empty' <<<"$pr_json")"
          head_repo="$(jq -r '"\(.headRepositoryOwner.login)/\(.headRepository.name)"' <<<"$pr_json")"
          author="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.user.login // empty')"

          [ "$state" = "OPEN" ] || skip "pull request #$PR_NUMBER is not open."
          [ "$is_draft" = "false" ] || skip "pull request #$PR_NUMBER is a draft."
          [ "$base_ref" = "develop" ] || skip "pull request #$PR_NUMBER does not target develop."
          [ "$head_repo" = "$GITHUB_REPOSITORY" ] || skip "pull request #$PR_NUMBER does not use a same-repository branch."
          [[ "$head_ref" == copilot/* ]] || skip "pull request #$PR_NUMBER does not use a copilot/* branch."
          [ "$author" = "$EXPECTED_COPILOT_AUTHOR" ] || skip "pull request #$PR_NUMBER is not authored by $EXPECTED_COPILOT_AUTHOR."
          [ "$current_sha" = "$HEAD_SHA" ] || skip "Refusing stale handoff: head is now $current_sha."

          changed_files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')"
          if grep -Eq '^\.github/workflows/' <<<"$changed_files"; then
            fail "Pull requests that change .github/workflows/** require manual validation and review."
          fi

          issue_count="$(jq '[.closingIssuesReferences[]?] | length' <<<"$pr_json")"
          [ "$issue_count" = "1" ] || fail "Copilot pull request #$PR_NUMBER must close exactly one agent-ready-copilot issue (found $issue_count)."
          issue_number="$(jq -r '.closingIssuesReferences[0].number' <<<"$pr_json")"
          issue_json="$(gh issue view "$issue_number" --repo "$GITHUB_REPOSITORY" --json state,labels)"
          [ "$(jq -r '.state' <<<"$issue_json")" = "OPEN" ] || fail "Issue #$issue_number is not open."
          jq -e 'any(.labels[]?; .name == "agent-working")' <<<"$issue_json" >/dev/null \
            || skip "issue #$issue_number is not agent-working (the architecture check already ran or the task was not started with agent-ready-copilot)."

          gh workflow run agent-copilot-architecture.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f issue_number="$issue_number" \
            -f pr_number="$PR_NUMBER" \
            -f head_sha="$HEAD_SHA"
          echo "::notice::Dispatched Claude's read-only architecture check for $HEAD_SHA."
