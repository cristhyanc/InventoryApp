name: Agent review request

# Manual re-review: when a human applies `agent-review` to an eligible agent pull request whose exact
# head already passed validation, dispatch agent-review.yml from `main` for that head.
#
# Authority and lifecycle: docs/automation.md ("Updated-head scheduling", "Review agent").
# - agent-review.yml has no pull_request trigger: a pull_request run would use the pull request's
#   merge commit as github.sha, so the review workflow could come from the pull request. Every review is therefore a workflow_dispatch with --ref main, from
#   validate.yml after successful exact-SHA validation or from this dispatcher.
# - Trusted source: `pull_request_target` always runs this definition from the default branch, and
#   this workflow never checks out or executes pull request code. Its only write permission is
#   `actions: write`, used solely to dispatch agent-review.yml.
# - Labels applied by automation with GITHUB_TOKEN start no workflow, so only a human's label event
#   reaches this dispatcher.
# - It does not approve, merge, label, push, review, or deploy.

on:
  pull_request_target:
    types: [labeled]
    branches:
      - develop

permissions: {}

concurrency:
  group: agent-review-request-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  isolation-gate:
    name: Refuse review dispatch until runner isolation is verified
    # The dispatch-review job holds a GITHUB_TOKEN with actions: write, so it is skipped
    # in self-hosted mode until a human confirms those runners are reset or ephemeral per job (issue #645
    # review). This job makes that refusal a visible failure on the same event.
    if: |
      vars.INVENTORY_AGENT_SELF_HOSTED_ALL == 'true' && vars.INVENTORY_RUNNER_ISOLATION_VERIFIED != 'true' &&
      github.event.label.name == 'agent-review' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'agent/issue-')
    runs-on: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL == 'true' && fromJSON('["self-hosted","linux","x64","inventory-agent"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Report and validate runner mode
        env:
          RUNNER_MODE: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL }}
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          case "$RUNNER_MODE" in
            true) selected=self-hosted ;;
            ''|false) selected=github-hosted ;;
            *) echo "::error::The repository variable INVENTORY_AGENT_SELF_HOSTED_ALL must be exactly true, false or unset. See docs/automation.md § Runner placement."; exit 1 ;;
          esac
          echo "Runner mode: INVENTORY_AGENT_SELF_HOSTED_ALL=${RUNNER_MODE:-<unset>} selects $selected runners."
          echo "This job runs on $RUNNER_NAME ($RUNNER_KIND)."
          if [ "$RUNNER_KIND" != "$selected" ]; then
            echo "::error::This job runs on a $RUNNER_KIND runner, but INVENTORY_AGENT_SELF_HOSTED_ALL now selects $selected runners; the variable changed after the job was queued. Re-run the job. See docs/automation.md § Runner placement."
            exit 1
          fi

      - name: Require verified runner isolation for credentialed jobs
        run: |
          echo "::error::Review dispatch is disabled in self-hosted mode (INVENTORY_AGENT_SELF_HOSTED_ALL is true) until a human sets the repository variable INVENTORY_RUNNER_ISOLATION_VERIFIED to true after provisioning reset or ephemeral self-hosted runners. See docs/automation.md § Runner placement."
          exit 1

  dispatch-review:
    name: Dispatch a fresh review of the validated head
    if: |
      (vars.INVENTORY_AGENT_SELF_HOSTED_ALL != 'true' || vars.INVENTORY_RUNNER_ISOLATION_VERIFIED == 'true') &&
      github.event.label.name == 'agent-review' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'agent/issue-')
    runs-on: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL == 'true' && fromJSON('["self-hosted","linux","x64","inventory-agent"]') || 'ubuntu-latest' }}
    permissions:
      actions: write
      pull-requests: read
      statuses: read
      # Reads the trusted pull request guard from this workflow's own commit.
      contents: read

    steps:
      - name: Report and validate runner mode
        env:
          RUNNER_MODE: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL }}
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          case "$RUNNER_MODE" in
            true) selected=self-hosted ;;
            ''|false) selected=github-hosted ;;
            *) echo "::error::The repository variable INVENTORY_AGENT_SELF_HOSTED_ALL must be exactly true, false or unset. See docs/automation.md § Runner placement."; exit 1 ;;
          esac
          echo "Runner mode: INVENTORY_AGENT_SELF_HOSTED_ALL=${RUNNER_MODE:-<unset>} selects $selected runners."
          echo "This job runs on $RUNNER_NAME ($RUNNER_KIND)."
          if [ "$RUNNER_KIND" != "$selected" ]; then
            echo "::error::This job runs on a $RUNNER_KIND runner, but INVENTORY_AGENT_SELF_HOSTED_ALL now selects $selected runners; the variable changed after the job was queued. Re-run the job. See docs/automation.md § Runner placement."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Reverify current head and dispatch review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_AGENT_AUTHOR: ${{ vars.AGENT_AUTOMATION_APP_BOT_LOGIN }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || fail "The event did not contain a valid pull request number."
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "The event did not contain a full head SHA."

          # Eligibility (open, non-draft, develop, same repository, Claude agent branch, App author, exact head,
          # no workflow files) comes from the one trusted guard in this workflow's own commit.
          guard="$RUNNER_TEMP/agent-pr-guard.mjs"
          gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/scripts/agent-pr-guard.mjs?ref=$GITHUB_WORKFLOW_SHA" > "$guard"
          pr_guard="$(node "$guard" check "$PR_NUMBER" "$HEAD_SHA" 2>"$RUNNER_TEMP/agent-pr-guard.txt")" \
            || fail "Review request refused: $(tail -n 1 "$RUNNER_TEMP/agent-pr-guard.txt")"
          jq -e 'any(.labels[]; . == "agent-review")' <<<"$pr_guard" >/dev/null \
            || fail "The agent-review label was removed before the review could be requested."

          validation_state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/status" \
            --jq '[.statuses[] | select(.context == "agent-validation")][0].state // ""')"
          [ "$validation_state" = "success" ] \
            || fail "A manual agent-review request requires a successful latest agent-validation status on the exact head SHA."

          gh workflow run agent-review.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f pr_number="$PR_NUMBER" \
            -f head_sha="$HEAD_SHA"
          echo "::notice::Dispatched a fresh review of $HEAD_SHA from main."
