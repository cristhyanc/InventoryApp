name: Agent review

# Independent review agent (Claude Code) for pull requests that carry `agent-review`.
#
# Authority and lifecycle: AGENTS.md ("Automated task contract") and docs/automation.md ("Review agent").
# - A human applies `agent-review` to request the initial review. Later repair pushes may dispatch a
#   fresh review automatically, but only after exact-SHA validation succeeds and the label is still present.
# - Dispatched runs execute this trusted workflow from `main`, then verify the open, non-draft, same-repository
#   agent PR, its current head SHA, its successful `agent-validation` status, and the workflow-file exclusion.
# - Every run is a fresh review of the pull request's current head SHA in a new job with its own context.
# - The review may comment but cannot modify code, labels, branches, settings, merge, or deploy.

on:
  pull_request:
    types: [labeled, synchronize, ready_for_review]
    branches:
      - develop
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string
      head_sha:
        description: Exact validated pull request head SHA to review
        required: true
        type: string

permissions: {}

concurrency:
  group: agent-review-pr-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  context:
    name: Resolve review context
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.base.ref == 'develop' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'agent-review') &&
        (github.event.action != 'labeled' || github.event.label.name == 'agent-review')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      pr_number: ${{ steps.context.outputs.pr_number }}
      head_sha: ${{ steps.context.outputs.head_sha }}
      base_ref: ${{ steps.context.outputs.base_ref }}

    steps:
      - name: Resolve and verify pull request
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            pr_number="$INPUT_PR_NUMBER"
            head_sha="$INPUT_HEAD_SHA"

            [[ "$pr_number" =~ ^[1-9][0-9]*$ ]] || fail "A valid pull request number is required."
            [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || fail "A full 40-character lowercase head SHA is required."

            pr_json="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" \
              --json state,isDraft,baseRefName,headRefName,headRefOid,headRepository,headRepositoryOwner,labels)"
            state="$(jq -r '.state' <<<"$pr_json")"
            is_draft="$(jq -r '.isDraft' <<<"$pr_json")"
            base_ref="$(jq -r '.baseRefName' <<<"$pr_json")"
            head_ref="$(jq -r '.headRefName' <<<"$pr_json")"
            current_sha="$(jq -r '.headRefOid // empty' <<<"$pr_json")"
            head_repo="$(jq -r '"\(.headRepositoryOwner.login)/\(.headRepository.name)"' <<<"$pr_json")"
            author="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" \
              --jq '.user.login // empty')"

            [ "$state" = "OPEN" ] || fail "Pull request #$pr_number is not open."
            [ "$is_draft" = "false" ] || fail "Pull request #$pr_number is a draft."
            [ "$base_ref" = "develop" ] || fail "Automated review is limited to pull requests targeting develop."
            [ "$head_repo" = "$GITHUB_REPOSITORY" ] || fail "Automated review is limited to same-repository branches."
            [[ "$head_ref" == agent/issue-* ]] || fail "Automated review requires an agent/issue-* head branch."
            [ "$author" = "github-actions[bot]" ] || fail "Automated review requires github-actions[bot] as the pull request author."
            [ "$current_sha" = "$head_sha" ] || fail "Refusing stale review: pull request head is $current_sha, requested SHA is $head_sha."
            jq -e 'any(.labels[]?; .name == "agent-review")' <<<"$pr_json" >/dev/null \
              || fail "The agent-review label is required before review."

            changed_files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$pr_number/files?per_page=100" --jq '.[].filename')"
            if grep -Eq '^\.github/workflows/' <<<"$changed_files"; then
              fail "Pull requests that change .github/workflows/** require manual validation and review."
            fi

            validation_state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$head_sha/status" \
              --jq '[.statuses[] | select(.context == "agent-validation")][0].state // ""')"
            [ "$validation_state" = "success" ] \
              || fail "The exact head SHA does not have a successful latest agent-validation status."
          else
            pr_number="$EVENT_PR_NUMBER"
            head_sha="$EVENT_HEAD_SHA"
            base_ref="$EVENT_BASE_REF"

            [[ "$pr_number" =~ ^[1-9][0-9]*$ ]] || fail "The pull_request event did not contain a valid pull request number."
            [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || fail "The pull_request event did not contain a full head SHA."
            [ "$base_ref" = "develop" ] || fail "Review is limited to pull requests targeting develop."
          fi

          {
            echo "pr_number=$pr_number"
            echo "head_sha=$head_sha"
            echo "base_ref=$base_ref"
          } >> "$GITHUB_OUTPUT"

  review:
    name: Independent review of current head
    needs: context
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: read
      actions: read
      checks: read
      statuses: read

    steps:
      - name: Check out pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.context.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run Claude Code review agent
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-actions[bot]"
          additional_permissions: |
            actions: read
          prompt: |
            You are the InventoryApp independent review agent running in GitHub Actions. You are a separate invocation from the implementation agent: do not rely on anything it may have claimed; verify it.

            REPOSITORY: ${{ github.repository }}
            PULL REQUEST: #${{ needs.context.outputs.pr_number }}
            HEAD SHA UNDER REVIEW: ${{ needs.context.outputs.head_sha }} (checked out in the working tree)
            BASE BRANCH: ${{ needs.context.outputs.base_ref }}

            Produce a fresh, complete review of exactly this head SHA. Ignore earlier review rounds except to check whether previously raised problems are resolved.

            Read, in this order, before judging anything:
            1. CLAUDE.md, AGENTS.md and docs/automation.md (the binding engineering, safety and authority rules); docs/architecture.md where the change touches structure, EF Core, reporting, Nayax, or the Angular layout.
            2. The pull request (`gh pr view ${{ needs.context.outputs.pr_number }} --comments`) and its full diff (`gh pr diff ${{ needs.context.outputs.pr_number }}` or `git diff origin/${{ needs.context.outputs.base_ref }}...HEAD`).
            3. The linked issue named in the PR body (`gh issue view <n> --comments`): its acceptance criteria and explicit exclusions define what the PR was allowed to do.
            4. The validation evidence: the "Validation commands and actual results" section of the PR body and the actual CI state (`gh pr checks ${{ needs.context.outputs.pr_number }}`, and the github_ci tools or `gh run view` for logs). A claim without matching evidence is not proven. A successful `agent-validation` commit status linked to a dispatched validation run is valid exact-SHA evidence; an approval-required duplicate `pull_request` run for the same bot update is not a failure when that exact-SHA status succeeded.

            Evaluate and report on each of:
            - Requirements: every acceptance criterion met; nothing outside the criteria or inside the exclusions was changed; no scope creep, no unrelated cleanup.
            - Correctness and safety against AGENTS.md invariants (financial, inventory/costing, reconciliation, GST, commissions, migrations, Nayax, files/security, frontend rules). Cite the invariant you are applying.
            - Architecture against docs/architecture.md and the AGENTS.md architecture rules.
            - Tests: the tests AGENTS.md requires for this change type exist, are meaningful, and no failing test was weakened, skipped, or deleted.
            - Validation evidence: the PR states real commands and results consistent with CI. Flag any unsupported "passed" claim.
            - Secrets, local databases, generated output, accidental migrations, unrelated files, and public API contract changes.
            - Risk classification per docs/automation.md; for high-risk areas confirm the PR cites the invariants it touches.

            Deliver the result on the pull request:
            - Inline comments (mcp__github_inline_comment__create_inline_comment) for specific lines that need a change, each stating the problem, why it matters, and the rule or criterion it violates.
            - Exactly one summary review, always submitted with `gh pr review ${{ needs.context.outputs.pr_number }} --comment --body "..."`. Never use --approve or --request-changes: this pull request is authored by github-actions[bot] and GitHub rejects approve/request-changes reviews from the same account; the verdict line below carries the outcome instead. Do not post any other top-level comment.
            - The review body must have this structure, in this order:
              1. `Head SHA reviewed: <sha>`
              2. Exactly one verdict line, verbatim, on its own line: `VERDICT: CHANGES REQUESTED` when anything blocks the change, otherwise `VERDICT: READY FOR HUMAN REVIEW`.
              3. `Blockers:` followed by a numbered list of every blocking finding (file, line where applicable, what is wrong, which rule or acceptance criterion it violates). Write `Blockers: none` when there are none.
              4. The acceptance criteria checklist with met / not met per item.
              5. Non-blocking suggestions.
              6. The validation evidence you confirmed (checks, runs, commands and their real results).
              7. The sentence: "This is an advisory review. Human approval and branch protection remain the merge gate."

            Hard limits: never approve, request changes, merge, edit files, commit, push, change labels, edit the PR or issue, trigger workflows, or run write operations of any kind. If a tool call is denied, do not look for another route; report what you could not verify instead.
          claude_args: |
            --model sonnet
            --effort high
            --max-turns 80
            --allowedTools "mcp__github_inline_comment__create_inline_comment,mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log"
            "Bash(gh pr view *),Bash(gh pr diff *),Bash(gh pr checks *),Bash(gh issue view *),Bash(gh run view *),Bash(gh run list *)"
            "Bash(gh pr review * --comment *)"
            "Bash(git status *),Bash(git diff *),Bash(git log *),Bash(git show *),Bash(git rev-parse *),Bash(git branch *)"
            --disallowedTools "Edit,MultiEdit,Write,NotebookEdit,WebFetch,WebSearch"
            "Bash(gh pr review * --approve *),Bash(gh pr review * --request-changes *),Bash(gh pr review --approve *),Bash(gh pr review --request-changes *),Bash(gh pr comment *),Bash(gh pr merge *),Bash(gh pr edit *),Bash(gh pr close *),Bash(gh pr reopen *),Bash(gh pr ready *),Bash(gh issue edit *),Bash(gh issue comment *),Bash(gh api *),Bash(gh workflow *),Bash(gh run rerun *),Bash(gh run cancel *),Bash(gh label *)"
            "Bash(git push *),Bash(git commit *),Bash(git add *),Bash(git checkout *),Bash(git switch *),Bash(git reset *),Bash(git rebase *),Bash(git merge *),Bash(git stash *),Bash(git restore *),Bash(git clean *)"
