name: Agent review

# Final review of agent pull requests that carry `agent-review`.
#
# Authority and lifecycle: AGENTS.md ("Automated task contract") and docs/automation.md ("Review agent").
# - Both verified provider modes (cross-claude, the default, and full-claude) are reviewed in the
#   `review` job by a separate, fresh read-only Claude invocation, and the prompt and published review
#   state that it is a same-provider review, not an independent one (docs/automation.md "Provider
#   roles and readiness labels"). Claude is the only implementer, so `copilot/*` branches are refused.
#   The deterministic publish job turns the structured review into a comment-only review and the
#   `agent-review-verdict` status.
# - agent-architecture.yml applies `agent-review` after the read-only
#   architecture check; exact-SHA validation then dispatches the initial review automatically. A human
#   may remove/re-apply the label to request another review of an already validated head; the label
#   event starts agent-review-request.yml, which dispatches this workflow from main. Repair
#   pushes and other new commits are reviewed only through the post-validation dispatch
#   (agent-head-update.yml schedules exact-SHA validation for a new head).
# - Dispatched runs execute this trusted workflow from `main`, then verify the open, non-draft, same-repository
#   agent PR, its current head SHA, its successful `agent-validation` status, and the workflow-file exclusion.
# - Every run is a fresh review of the pull request's current head SHA in a new job with its own context.
# - The review jobs are read-only: the reviewer returns its verdict as structured output and publishes
#   nothing. The review job binds that result to this repository, pull request, head SHA, route and run
#   and uploads it as a short-lived artifact (scripts/agent-review-transport.mjs), never as a job
#   output, which GitHub withholds when it contains a masked value. A separate deterministic publish
#   job verifies that artifact, re-verifies the pull request immediately before publishing, binds the
#   review to the exact reviewed SHA, publishes nothing for a stale or ineligible result, and records
#   one outcome (scripts/agent-outcomes.mjs) as the per-SHA `agent-review-verdict` commit status. No job can modify code, labels, branches,
#   settings, merge, or deploy.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string
      head_sha:
        description: Exact validated pull request head SHA to review
        required: true
        type: string

permissions: {}

concurrency:
  group: agent-review-pr-${{ inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  context:
    name: Resolve review context
    runs-on: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL == 'true' && fromJSON('["self-hosted","linux","x64","inventory-agent"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
      statuses: read
      issues: read
    outputs:
      pr_number: ${{ steps.context.outputs.pr_number }}
      head_sha: ${{ steps.context.outputs.head_sha }}
      base_ref: ${{ steps.context.outputs.base_ref }}
      implementer: ${{ steps.context.outputs.implementer }}
      agent_mode: ${{ steps.context.outputs.agent_mode }}
      reviewer: ${{ steps.context.outputs.reviewer }}
      review_relation: ${{ steps.context.outputs.review_relation }}

    steps:
      - name: Report and validate runner mode
        env:
          RUNNER_MODE: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL }}
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          case "$RUNNER_MODE" in
            true) selected=self-hosted ;;
            ''|false) selected=github-hosted ;;
            *) echo "::error::The repository variable INVENTORY_AGENT_SELF_HOSTED_ALL must be exactly true, false or unset. See docs/automation.md § Runner placement."; exit 1 ;;
          esac
          echo "Runner mode: INVENTORY_AGENT_SELF_HOSTED_ALL=${RUNNER_MODE:-<unset>} selects $selected runners."
          echo "This job runs on $RUNNER_NAME ($RUNNER_KIND)."
          if [ "$RUNNER_KIND" != "$selected" ]; then
            echo "::error::This job runs on a $RUNNER_KIND runner, but INVENTORY_AGENT_SELF_HOSTED_ALL now selects $selected runners; the variable changed after the job was queued. Re-run the job. See docs/automation.md § Runner placement."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Resolve and verify pull request
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_AGENT_AUTHOR: ${{ vars.AGENT_AUTOMATION_APP_BOT_LOGIN }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          # Only trusted dispatches start a review: the post-validation dispatcher in validate.yml and
          # the manual re-review dispatcher agent-review-request.yml, both with --ref main. This
          # workflow therefore always comes from main.
          [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || fail "Reviews run only from a trusted workflow_dispatch."
          [ "$GITHUB_REF" = "refs/heads/main" ] || fail "Reviews run only from main, not $GITHUB_REF."
          pr_number="$INPUT_PR_NUMBER"
          head_sha="$INPUT_HEAD_SHA"

          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]] || fail "A valid pull request number is required."
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || fail "A full 40-character lowercase head SHA is required."

          # Eligibility (open, non-draft, develop, same repository, Claude agent branch, App author, exact head,
          # no workflow files) comes from the one trusted guard in this workflow's own commit.
          guard="$RUNNER_TEMP/agent-pr-guard.mjs"
          gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/scripts/agent-pr-guard.mjs?ref=$GITHUB_WORKFLOW_SHA" > "$guard"
          pr_guard="$(node "$guard" check "$pr_number" "$head_sha" 2>"$RUNNER_TEMP/agent-pr-guard.txt")" \
            || fail "Review refused: $(tail -n 1 "$RUNNER_TEMP/agent-pr-guard.txt")"
          implementer="$(jq -r '.implementer' <<<"$pr_guard")"
          base_ref="$(jq -r '.base_ref' <<<"$pr_guard")"
          # Provider mode (#339): verify the route claimed in the issue's label history against this pull request, using the
          # resolver from this workflow's own commit. A conflicting, malformed or disabled mode fails closed.
          gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/scripts/agent-mode.mjs?ref=$GITHUB_WORKFLOW_SHA" > "$RUNNER_TEMP/agent-mode.mjs"
          agent_mode="$(node "$RUNNER_TEMP/agent-mode.mjs" verify-pr "$pr_number" "$implementer")" || fail "the provider mode of pull request #$pr_number could not be verified."
          # The verified route picks the reviewer. Nothing falls back to the other provider.
          case "$agent_mode:$implementer" in
            cross-claude:claude)
              reviewer=claude
              review_relation="This pull request was implemented by another Claude invocation. This is a same-provider review, not an independent one: you are a fresh invocation with no implementation conversation state; verify every claim." ;;
            full-claude:claude)
              reviewer=claude
              review_relation="This pull request was implemented by another Claude invocation under the full-claude single-provider fallback route. This is a same-provider review, not an independent one: you are a fresh invocation with no implementation conversation state, so do not rely on anything the implementation claimed; verify it." ;;
            *) fail "Provider mode '$agent_mode' does not match implementer $implementer." ;;
          esac
          jq -e 'any(.labels[]; . == "agent-review")' <<<"$pr_guard" >/dev/null \
            || fail "The agent-review label is required before review."

          validation_state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$head_sha/status" \
            --jq '[.statuses[] | select(.context == "agent-validation")][0].state // ""')"
          [ "$validation_state" = "success" ] \
            || fail "The exact head SHA does not have a successful latest agent-validation status."

          echo "::notice::Pull request #$pr_number was implemented by $implementer in provider mode $agent_mode; $reviewer reviews it."
          {
            echo "pr_number=$pr_number"
            echo "head_sha=$head_sha"
            echo "base_ref=$base_ref"
            echo "implementer=$implementer"
            echo "agent_mode=$agent_mode"
            echo "reviewer=$reviewer"
            echo "review_relation=$review_relation"
          } >> "$GITHUB_OUTPUT"

      - name: Require verified runner isolation for credentialed jobs
        # Issue #645 review: jobs that receive a long-lived secret, an App key or Azure OIDC are skipped
        # in self-hosted mode until a human confirms those runners are reset or ephemeral per job. This step makes
        # that refusal a visible failure instead of a silent skip.
        env:
          RUNNER_MODE: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL }}
          RUNNER_ISOLATION_VERIFIED: ${{ vars.INVENTORY_RUNNER_ISOLATION_VERIFIED }}
        run: |
          if [ "$RUNNER_MODE" = "true" ] && [ "$RUNNER_ISOLATION_VERIFIED" != "true" ]; then
            echo "::error::Credentialed jobs are disabled in self-hosted mode (INVENTORY_AGENT_SELF_HOSTED_ALL is true) until a human sets the repository variable INVENTORY_RUNNER_ISOLATION_VERIFIED to true after provisioning reset or ephemeral self-hosted runners. See docs/automation.md § Runner placement."
            exit 1
          fi

  review:
    name: Claude review of current head
    needs: context
    # Claude reviews only as a separate same-provider invocation, on the full-claude fallback.
    if: needs.context.outputs.reviewer == 'claude' && (vars.INVENTORY_AGENT_SELF_HOSTED_ALL != 'true' || vars.INVENTORY_RUNNER_ISOLATION_VERIFIED == 'true')
    runs-on: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL == 'true' && fromJSON('["self-hosted","linux","x64","inventory-agent"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    # Read-only: this job runs Claude and holds no pull-request, issue, status or workflow write
    # permission, so the model cannot publish, label, dispatch or push even if it tried. Its only
    # result is the schema-validated review, packaged as this run's review artifact for the publish job.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      checks: read
      statuses: read
    # Only the artifact id and the envelope digest leave this job as outputs. The review itself
    # travels as a run-bound artifact, because GitHub withholds a job output that contains any masked
    # value ("Skip output ... since it may contain secret"), which once silently lost a finished review.
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.package.outputs.digest }}

    steps:
      - name: Report and validate runner mode
        env:
          RUNNER_MODE: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL }}
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          case "$RUNNER_MODE" in
            true) selected=self-hosted ;;
            ''|false) selected=github-hosted ;;
            *) echo "::error::The repository variable INVENTORY_AGENT_SELF_HOSTED_ALL must be exactly true, false or unset. See docs/automation.md § Runner placement."; exit 1 ;;
          esac
          echo "Runner mode: INVENTORY_AGENT_SELF_HOSTED_ALL=${RUNNER_MODE:-<unset>} selects $selected runners."
          echo "This job runs on $RUNNER_NAME ($RUNNER_KIND)."
          if [ "$RUNNER_KIND" != "$selected" ]; then
            echo "::error::This job runs on a $RUNNER_KIND runner, but INVENTORY_AGENT_SELF_HOSTED_ALL now selects $selected runners; the variable changed after the job was queued. Re-run the job. See docs/automation.md § Runner placement."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Check out pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.context.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run Claude Code review agent
        id: review_agent
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-actions[bot]"
          additional_permissions: |
            actions: read
          prompt: |
            You are the InventoryApp review agent running in GitHub Actions. ${{ needs.context.outputs.review_relation }} A separate read-only architecture check ran before validation, and its findings, if any, were posted on the pull request for the implementer to fix. Independently verify the architecture again on this exact SHA and confirm that every earlier architecture finding is resolved or was declined with a sound reason. Treat a violation of docs/architecture.md or the AGENTS.md architecture rules (controller and use-case boundaries, domain versus adapters, dependency direction, duplicated logic, testability), or an unresolved earlier finding, as a blocker, not a suggestion.

            REPOSITORY: ${{ github.repository }}
            PULL REQUEST: #${{ needs.context.outputs.pr_number }}
            HEAD SHA UNDER REVIEW: ${{ needs.context.outputs.head_sha }} (checked out in the working tree)
            BASE BRANCH: ${{ needs.context.outputs.base_ref }}

            Produce a fresh, complete review of exactly this head SHA. Ignore earlier review rounds except to check whether previously raised problems are resolved.

            Read, in this order, before judging anything:
            1. CLAUDE.md, AGENTS.md and docs/automation.md (the binding engineering, safety and authority rules); docs/architecture.md where the change touches structure, EF Core, reporting, Nayax, or the Angular layout.
            2. The pull request (`gh pr view ${{ needs.context.outputs.pr_number }} --comments`) and its full diff (`gh pr diff ${{ needs.context.outputs.pr_number }}` or `git diff origin/${{ needs.context.outputs.base_ref }}...HEAD`).
            3. The linked issue named in the PR body (`gh issue view <n> --comments`): its acceptance criteria and explicit exclusions define what the PR was allowed to do.
            4. The validation evidence: the "Validation commands and actual results" section of the PR body and the actual CI state (`gh pr checks ${{ needs.context.outputs.pr_number }}`, and the github_ci tools or `gh run view` for logs). A claim without matching evidence is not proven. A successful `agent-validation` commit status linked to a dispatched validation run is the authoritative exact-SHA evidence for the review. Normal `merge-validation` runs are independent branch-protection evidence and never substitute for `agent-validation`.
            5. The documentation-impact declarations. Compare three things: the issue's Documentation impact decision and details, the pull request's "## Documentation impact" declaration (Decision and Evidence), and the actual diff. CI only proves that a declaration exists; you decide whether it is truthful.

            Evaluate and report on each of:
            - Requirements: every acceptance criterion met; nothing outside the criteria or inside the exclusions was changed; no scope creep, no unrelated cleanup.
            - Correctness and safety against AGENTS.md invariants (financial, inventory/costing, reconciliation, GST, commissions, migrations, Nayax, files/security, frontend rules). Cite the invariant you are applying.
            - Architecture against docs/architecture.md and the AGENTS.md architecture rules.
            - Tests: the tests AGENTS.md requires for this change type exist, are meaningful, and no failing test was weakened, skipped, or deleted. Check the PR's test-first evidence (test name, intended initial failure and final pass), or its specific reason for not using test-first. A final diff alone cannot prove the sequence; do not claim independent proof of a red phase from it. Treat missing behavioral coverage or an unsupported high-risk isolation claim as a blocker, not a missing commit sequence by itself.
            - Validation evidence: the PR states real commands and results consistent with CI. Flag any unsupported "passed" claim.
            - Secrets, local databases, generated output, accidental migrations, unrelated files, and public API contract changes.
            - Risk classification per docs/automation.md; for high-risk areas confirm the PR cites the invariants it touches.
            - Documentation impact: the diff must match the declarations. With `Decision: UPDATED`, every documentation file named in the Evidence must actually change in the diff and describe the merged behaviour accurately, and every documentation change in the diff must be listed. With `Decision: NOT REQUIRED`, verify from the diff, not from filenames alone, that no documented behaviour, contract, architecture, configuration, automation, deployment, operation or user workflow changed; if the issue said "Documentation changes required", or the diff makes any documentation inaccurate, that decision is wrong. Missing, inaccurate or incomplete required documentation is a blocker. So is a declaration that contradicts the diff or an issue decision that the PR silently ignored.

            Blocking rules (these decide the verdict; you may not relax them):
            - Assess every acceptance criterion of the linked issue individually as `met`, `not met`, or `not verified`, each with concrete evidence (file and line, test name, CI run, or command output). A criterion you could not verify is `not verified`, never `met`.
            - `VERDICT: READY FOR HUMAN REVIEW` is allowed only when every acceptance criterion is `met` and there are no blockers. Any `not met` or `not verified` criterion, and any violated financial, inventory/costing, tenant or security invariant, is a blocker and the verdict is `VERDICT: CHANGES REQUESTED`.
            - A known unmet criterion or violated invariant is never waived because the pre-existing or legacy behaviour is worse, because the failure seems unlikely or narrow, because the tests pass, or because the Sonar quality gate or any other check is green. Do not downgrade it to a non-blocking suggestion.
            - When a high-risk requirement is materially ambiguous, do not invent a policy to resolve it. Record a blocker that starts with "Human decision required:" and states exactly which decision is needed.
            - For any stale-state, concurrency or "must not act on outdated data" guarantee, inspect the authoritative read, the expected-state comparison, and the mutation as one operation. A transaction around only the write, or a check performed on a separate earlier read, is not evidence of atomicity. Require a regression test in which the state changes between the initial read and the mutation; without it the criterion is `not verified`.

            Deliver the result only as the structured output defined by the JSON schema; do not publish anything yourself. You have no permission to post reviews or comments, and a separate trusted job publishes your result only if the pull request head is still exactly the SHA above and it is still eligible. Fill the fields as follows:
            - `reviewed_head_sha`: exactly the HEAD SHA UNDER REVIEW above.
            - `verdict`: `CHANGES REQUESTED` or `READY FOR HUMAN REVIEW`, following the blocking rules.
            - `blockers`: every blocking finding (file, line where applicable, what is wrong, which rule or acceptance criterion it violates); an empty list only when there are none.
            - `criteria`: one entry per acceptance criterion with `status` `met`, `not met` or `not verified` and its evidence.
            - `suggestions`: non-blocking suggestions only.
            - `validation_evidence`: the checks, runs, commands and real results you confirmed.
            - `inline_comments`: specific lines in the diff that need a change (`path`, `line` in the new file version, `body` stating the problem, why it matters, and the rule or criterion it violates).
            Do not write a `VERDICT:` line inside any field; the publisher writes the head SHA, the single verdict line and the advisory sentence itself.

            Nayax contract verification (AGENTS.md § Nayax contract verification): if this work touches code that calls the Nayax API or models a Nayax request or response, look up the relevant endpoint contract with the read-only Nayax documentation tools (search_nayax_developer_portal and query_docs_filesystem_nayax_developer_portal on the nayax MCP server) before defining, changing or accepting field names, types, nullability, identifiers, timestamps or endpoint semantics. Never invent a Nayax property that the documentation can confirm or refute. If the tools are unavailable or the contract cannot be found, state explicitly that authoritative Nayax verification could not be completed and treat the affected contract as unverified rather than guessing. Work that does not touch Nayax needs no lookup.

            Hard limits: never approve, request changes, comment, merge, edit files, commit, push, change labels, edit the PR or issue, trigger workflows, or run write operations of any kind. If a tool call is denied, do not look for another route; report what you could not verify instead.
          claude_args: |
            --mcp-config '{"mcpServers":{"nayax":{"type":"http","url":"https://devzone.nayax.com/mcp"}}}'
            --model sonnet
            --effort high
            --max-turns 80
            --json-schema '{"type":"object","additionalProperties":false,"required":["reviewed_head_sha","verdict","blockers","criteria","suggestions","validation_evidence","inline_comments"],"properties":{"reviewed_head_sha":{"type":"string","pattern":"^[0-9a-f]{40}$"},"verdict":{"type":"string","enum":["CHANGES REQUESTED","READY FOR HUMAN REVIEW"]},"blockers":{"type":"array","items":{"type":"string","minLength":1}},"criteria":{"type":"array","minItems":1,"items":{"type":"object","additionalProperties":false,"required":["criterion","status","evidence"],"properties":{"criterion":{"type":"string","minLength":1},"status":{"type":"string","enum":["met","not met","not verified"]},"evidence":{"type":"string","minLength":1}}}},"suggestions":{"type":"array","items":{"type":"string"}},"validation_evidence":{"type":"string","minLength":1},"inline_comments":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["path","line","body"],"properties":{"path":{"type":"string","minLength":1},"line":{"type":"integer","minimum":1},"body":{"type":"string","minLength":1}}}}}}'
            --allowedTools "mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log"
            "Bash(gh pr view *),Bash(gh pr diff *),Bash(gh pr checks *),Bash(gh issue view *),Bash(gh run view *),Bash(gh run list *)"
            "Bash(git status *),Bash(git diff *),Bash(git log *),Bash(git show *),Bash(git rev-parse *),Bash(git branch *)"
            "mcp__nayax__search_nayax_developer_portal,mcp__nayax__query_docs_filesystem_nayax_developer_portal"
            --disallowedTools "Edit,MultiEdit,Write,NotebookEdit,WebFetch,WebSearch"
            "mcp__nayax__submit_feedback"
            "mcp__github_inline_comment__create_inline_comment"
            "Bash(gh pr review *),Bash(gh pr comment *),Bash(gh pr merge *),Bash(gh pr edit *),Bash(gh pr close *),Bash(gh pr reopen *),Bash(gh pr ready *),Bash(gh issue edit *),Bash(gh issue comment *),Bash(gh api *),Bash(gh workflow *),Bash(gh run rerun *),Bash(gh run cancel *),Bash(gh label *)"
            "Bash(git push *),Bash(git commit *),Bash(git add *),Bash(git checkout *),Bash(git switch *),Bash(git reset *),Bash(git rebase *),Bash(git merge *),Bash(git stash *),Bash(git restore *),Bash(git clean *)"

      - name: Package review result
        id: package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_OUTPUT: ${{ steps.review_agent.outputs.structured_output }}
          # The credentials this job holds, removed from the review by exact value before anything is
          # stored. They are only compared against, never printed.
          REVIEW_REDACT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_REDACT_PROVIDER_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PR_NUMBER: ${{ needs.context.outputs.pr_number }}
          HEAD_SHA: ${{ needs.context.outputs.head_sha }}
          AGENT_MODE: ${{ needs.context.outputs.agent_mode }}
          IMPLEMENTER: ${{ needs.context.outputs.implementer }}
          REVIEWER: ${{ needs.context.outputs.reviewer }}
        run: |
          set -euo pipefail
          # The transport script comes from the trusted workflow commit, never from the checked-out pull
          # request head. It validates the contract, redacts secret-like values and binds the result to
          # this repository, pull request, head SHA, route and run before anything is stored.
          transport="$RUNNER_TEMP/agent-review-transport.mjs"
          gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/scripts/agent-review-transport.mjs?ref=$GITHUB_WORKFLOW_SHA" > "$transport"
          printf '%s' "$REVIEW_OUTPUT" > "$RUNNER_TEMP/review-raw.json"
          result_dir="$RUNNER_TEMP/agent-review-result"
          mkdir -p "$result_dir"
          summary="$(node "$transport" package "$RUNNER_TEMP/review-raw.json" "$result_dir/review-envelope.json")"
          rm -f "$RUNNER_TEMP/review-raw.json"
          echo "Packaged review result: $summary"
          echo "name=$(jq -r '.name' <<<"$summary")" >> "$GITHUB_OUTPUT"
          echo "digest=$(jq -r '.digest' <<<"$summary")" >> "$GITHUB_OUTPUT"

      - name: Upload review result
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ runner.temp }}/agent-review-result/review-envelope.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish:
    name: Guarded review publication
    # Runs even when the review job failed or was cancelled (for example superseded by a newer review
    # of the same pull request), so every reviewed SHA ends with an explicit agent-review-verdict
    # outcome. No checkout and no Anthropic credential: it reads the review only from this run's own
    # review artifact (actions: read), verified by scripts/agent-review-transport.mjs fetched from
    # the trusted workflow commit, and the live pull request state through the API.
    if: always() && needs.context.result == 'success' && (vars.INVENTORY_AGENT_SELF_HOSTED_ALL != 'true' || vars.INVENTORY_RUNNER_ISOLATION_VERIFIED == 'true')
    needs:
      - context
      - review
    runs-on: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL == 'true' && fromJSON('["self-hosted","linux","x64","inventory-agent"]') || 'ubuntu-latest' }}
    permissions:
      pull-requests: write
      statuses: write
      contents: read
      issues: read
      actions: read

    steps:
      - name: Report and validate runner mode
        env:
          RUNNER_MODE: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL }}
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          case "$RUNNER_MODE" in
            true) selected=self-hosted ;;
            ''|false) selected=github-hosted ;;
            *) echo "::error::The repository variable INVENTORY_AGENT_SELF_HOSTED_ALL must be exactly true, false or unset. See docs/automation.md § Runner placement."; exit 1 ;;
          esac
          echo "Runner mode: INVENTORY_AGENT_SELF_HOSTED_ALL=${RUNNER_MODE:-<unset>} selects $selected runners."
          echo "This job runs on $RUNNER_NAME ($RUNNER_KIND)."
          if [ "$RUNNER_KIND" != "$selected" ]; then
            echo "::error::This job runs on a $RUNNER_KIND runner, but INVENTORY_AGENT_SELF_HOSTED_ALL now selects $selected runners; the variable changed after the job was queued. Re-run the job. See docs/automation.md § Runner placement."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Guard and publish review
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_AGENT_AUTHOR: ${{ vars.AGENT_AUTOMATION_APP_BOT_LOGIN }}
          PR_NUMBER: ${{ needs.context.outputs.pr_number }}
          HEAD_SHA: ${{ needs.context.outputs.head_sha }}
          IMPLEMENTER: ${{ needs.context.outputs.implementer }}
          AGENT_MODE: ${{ needs.context.outputs.agent_mode }}
          REVIEWER: ${{ needs.context.outputs.reviewer }}
          # The review comes only from the job of the reviewer the verified route selected.
          REVIEW_RESULT: ${{ needs.review.result }}
          REVIEW_ARTIFACT_ID: ${{ needs.review.outputs.artifact_id }}
          REVIEW_ARTIFACT_DIGEST: ${{ needs.review.outputs.artifact_digest }}
          VERDICT_CONTEXT: agent-review-verdict
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"

          set_verdict_status() {
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
              -f state="$1" \
              -f context="$VERDICT_CONTEXT" \
              -f description="$2" \
              -f target_url="$RUN_URL" >/dev/null
          }
          # Every result is one of the fixed outcomes in scripts/agent-outcomes.mjs, so the status alone
          # says what happened: a code finding, a provider failure, a delivery failure, a newer commit, or
          # a pull request that no longer qualifies. Each is also written to the run summary.
          record_outcome() {
            local state prefix
            case "$1" in
              ready) state=success; prefix="Ready for human review" ;;
              changes-requested) state=failure; prefix="Changes requested" ;;
              superseded) state=error; prefix="Superseded" ;;
              provider-failed) state=error; prefix="AI provider failed" ;;
              publication-failed) state=error; prefix="Publication failed" ;;
              not-eligible) state=error; prefix="Not eligible" ;;
              *) echo "::error::Unknown review outcome '$1'."; exit 1 ;;
            esac
            local description="$prefix: $2"
            set_verdict_status "$state" "${description:0:140}"
            printf '### %s: %s\n\n%s\n' "$VERDICT_CONTEXT" "$prefix" "$2" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          }
          # A result that is not published is never a review. It is recorded as an error status on the
          # reviewed SHA only, so it can never read as a ready result for this or any other head. The
          # reviewer finishing without a deliverable result is an infrastructure failure, never a finding.
          not_published() {
            echo "::warning::Review not published ($1): $2"
            record_outcome "$1" "$2"
            exit 0
          }

          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid pull request number."; exit 1; }
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid reviewed head SHA."; exit 1; }

          # The trusted route table decides who reviewed and whether the review was independent.
          case "$AGENT_MODE:$IMPLEMENTER:$REVIEWER" in
            cross-claude:claude:claude) reviewer="Claude (separate read-only invocation)"; review_type="Same-provider review: not independent" ;;
            full-claude:claude:claude) reviewer="Claude (separate read-only invocation)"; review_type="Same-provider review (full-claude fallback): not independent" ;;
            *) not_published not-eligible "unknown review route '$AGENT_MODE' (implementer '$IMPLEMENTER', reviewer '$REVIEWER')." ;;
          esac
          # A cancelled review job was almost always stopped by a newer review run of this pull request
          # (the concurrency group cancels the older one); any other ending is the provider's failure.
          case "$REVIEW_RESULT" in
            success) ;;
            cancelled) not_published superseded "the review job ended with 'cancelled': a newer review run of this pull request, or a person, stopped it." ;;
            *) not_published provider-failed "the $REVIEWER review job ended with '$REVIEW_RESULT', so it produced no review." ;;
          esac

          # 1. Receive the review from this run's own artifact, never from a job output, and re-verify
          #    its identity, digest, binding, contract and redaction with the trusted transport script.
          transport="$RUNNER_TEMP/agent-review-transport.mjs"
          gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/scripts/agent-review-transport.mjs?ref=$GITHUB_WORKFLOW_SHA" > "$transport" \
            || not_published publication-failed "the trusted transport script could not be read."
          if ! transport_summary="$(node "$transport" fetch "$work/review.json" 2>"$work/transport-error.txt")"; then
            transport_error="$(tail -n 1 "$work/transport-error.txt")"
            # A delivered review that breaks the contract or names another SHA is the provider's failure;
            # anything else (missing, tampered, expired, unreadable) is a delivery failure.
            case "${transport_error%%:*}" in
              contract|wrong-sha) not_published provider-failed "the review output was rejected: $transport_error" ;;
              *) not_published publication-failed "the review result could not be delivered: $transport_error" ;;
            esac
          fi
          redactions="$(jq -r '.redactions // 0' <<<"$transport_summary")"
          [[ "$redactions" =~ ^[0-9]+$ ]] || not_published publication-failed "the transport summary is invalid."

          # 2. The review must be well formed, bound to the reviewed SHA, and internally consistent
          #    with the blocking rules before anything else is considered.
          jq -e 'type == "object"' "$work/review.json" >/dev/null 2>&1 || not_published provider-failed "the review output was rejected: the review produced no valid structured output."
          reviewed_sha="$(jq -r '.reviewed_head_sha // ""' "$work/review.json")"
          [ "$reviewed_sha" = "$HEAD_SHA" ] || not_published provider-failed "the review output was rejected: the review output names SHA '$reviewed_sha', not the reviewed SHA $HEAD_SHA."
          verdict="$(jq -r '.verdict // ""' "$work/review.json")"
          case "$verdict" in
            "READY FOR HUMAN REVIEW")
              jq -e '(.blockers | length) == 0 and (.criteria | length) > 0 and all(.criteria[]; .status == "met")' "$work/review.json" >/dev/null \
                || not_published provider-failed "the review output was rejected: a ready verdict requires no blockers and every acceptance criterion met."
              ;;
            "CHANGES REQUESTED")
              jq -e '(.blockers | length) > 0' "$work/review.json" >/dev/null \
                || not_published provider-failed "the review output was rejected: a changes-requested verdict must list at least one blocker."
              ;;
            *) not_published provider-failed "the review output was rejected: unknown verdict '$verdict'." ;;
          esac

          # 3. Re-check eligibility and the current head immediately before publishing, with the trusted
          #    guard from this workflow's own commit. An ineligible or moved pull request is not published;
          #    any failure to read the live state, or of the guard itself, stops the step before a
          #    review is posted: fail closed.
          guard="$RUNNER_TEMP/agent-pr-guard.mjs"
          gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/scripts/agent-pr-guard.mjs?ref=$GITHUB_WORKFLOW_SHA" > "$guard"
          if ! pr_guard="$(node "$guard" check "$PR_NUMBER" "$HEAD_SHA" 2>"$RUNNER_TEMP/agent-pr-guard.txt")"; then
            refusal="$(tail -n 1 "$RUNNER_TEMP/agent-pr-guard.txt")"
            case "${refusal%%:*}" in
              stale) not_published superseded "$refusal" ;;
              closed|draft|base|fork|branch|config|author|workflow-files) not_published not-eligible "$refusal" ;;
              *) echo "::error::Review not published: the pull request could not be re-verified: $refusal"; exit 1 ;;
            esac
          fi
          validation_state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/status" \
            --jq '[.statuses[] | select(.context == "agent-validation")][0].state // ""')"
          # The implementer and route must still be the ones the review ran under.
          live_implementer="$(jq -r '.implementer' <<<"$pr_guard")"
          [ "$live_implementer" = "$IMPLEMENTER" ] || not_published not-eligible "pull request #$PR_NUMBER is now implemented by $live_implementer, not $IMPLEMENTER."
          # The provider mode must still be the one the review ran under; a relabel never reuses an old verdict.
          gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/scripts/agent-mode.mjs?ref=$GITHUB_WORKFLOW_SHA" > "$RUNNER_TEMP/agent-mode.mjs" \
            || not_published publication-failed "the provider-mode resolver could not be read."
          live_mode="$(node "$RUNNER_TEMP/agent-mode.mjs" verify-pr "$PR_NUMBER" "$live_implementer")" \
            || not_published not-eligible "the provider mode of pull request #$PR_NUMBER could not be verified."
          [ "$live_mode" = "$AGENT_MODE" ] || not_published not-eligible "pull request #$PR_NUMBER is now in provider mode $live_mode, not $AGENT_MODE."
          jq -e 'any(.labels[]; . == "agent-review")' <<<"$pr_guard" >/dev/null \
            || not_published not-eligible "the agent-review label was removed."
          [ "$validation_state" = "success" ] || not_published not-eligible "the reviewed SHA no longer has a successful latest agent-validation status."

          # 4. Render the review deterministically. The publisher, not the model, writes the reviewed
          #    SHA, the single verdict line and the advisory sentence.
          jq -r --arg sha "$HEAD_SHA" --arg run "$RUN_URL" --arg reviewer "$reviewer" --arg review_type "$review_type" --argjson redactions "$redactions" '
            def numbered(xs): [xs | to_entries[] | "\(.key + 1). \(.value)"] | join("\n");
            "Reviewer: \($reviewer)\nReview type: \($review_type)\nHead SHA reviewed: \($sha)\n\nVERDICT: \(.verdict)\n\n"
            + (if (.blockers | length) == 0 then "Blockers: none" else "Blockers:\n" + numbered(.blockers) end)
            + "\n\nAcceptance criteria:\n" + ([.criteria[] | "- [\(.status)] \(.criterion): \(.evidence)"] | join("\n"))
            + "\n\nNon-blocking suggestions:\n" + (if (.suggestions | length) == 0 then "none" else ([.suggestions[] | "- \(.)"] | join("\n")) end)
            + "\n\nValidation evidence confirmed:\n" + .validation_evidence
            + (if $redactions > 0 then "\n\n\($redactions) secret-like value(s) were redacted from this review before it was stored or published." else "" end)
            + "\n\nThis verdict applies only to \($sha); any later commit needs its own validation and review. Published by the guarded publication job of \($run)."
            + "\n\nThis is an advisory review. Human approval and branch protection remain the merge gate."
          ' "$work/review.json" > "$work/body.md"
          verdict_lines="$(grep -c '^VERDICT:' "$work/body.md" || true)"
          [ "$verdict_lines" = "1" ] || not_published provider-failed "the review output was rejected: the rendered review must contain exactly one verdict line, found $verdict_lines."

          jq -n --arg sha "$HEAD_SHA" --rawfile body "$work/body.md" --slurpfile review "$work/review.json" '
            { commit_id: $sha, event: "COMMENT", body: $body,
              comments: [$review[0].inline_comments[] | { path, line, side: "RIGHT", body }] }
          ' > "$work/payload.json"

          # 5. Publish one comment-only review bound to the exact reviewed commit. If GitHub rejects an
          #    inline position, publish once more with the inline comments folded into the body.
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" --input "$work/payload.json" >/dev/null; then
            echo "::warning::Inline comments were rejected; publishing them in the review body instead."
            jq '.body += "\n\nInline comments (could not be anchored):\n" + ([.comments[] | "- \(.path):\(.line): \(.body)"] | join("\n")) | .comments = []' \
              "$work/payload.json" > "$work/payload-fallback.json"
            gh api --method POST "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" --input "$work/payload-fallback.json" >/dev/null
          fi
          # From here on the review is public; a later failure must not be reported as "nothing published".
          echo "review_posted=true" >> "$GITHUB_OUTPUT"

          if [ "$verdict" = "READY FOR HUMAN REVIEW" ]; then
            record_outcome ready "advisory, for this SHA only; a person approves and merges."
          else
            record_outcome changes-requested "see the review on this SHA; a person may request a repair."
          fi

      - name: Record fail-closed outcome
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ needs.context.outputs.head_sha }}
          REVIEW_POSTED: ${{ steps.publish.outputs.review_posted }}
          VERDICT_CONTEXT: agent-review-verdict
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$REVIEW_POSTED" = "true" ]; then
            description="Publication failed: the review was posted, but its verdict status could not be recorded; see the review"
          else
            description="Publication failed: the publisher stopped before posting; nothing was published"
          fi
          printf '### %s: Publication failed\n\n%s\n' "$VERDICT_CONTEXT" "$description" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=error \
            -f context="$VERDICT_CONTEXT" \
            -f description="$description" \
            -f target_url="$RUN_URL" >/dev/null || echo "::warning::Could not record the fail-closed status."
