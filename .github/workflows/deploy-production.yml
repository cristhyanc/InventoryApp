name: Deploy Production

# The normal production release (issues #343 and #491). It takes no inputs; a human starts it from
# main with GitHub's Run workflow button, and it deploys exactly the main commit the run was
# dispatched from (github.sha, fixed when the run starts, so later pushes to main cannot change it).
# The migration baseline is read from the release records; when none exists the run stops and says to
# bootstrap one with Deploy Production (advanced recovery). The release itself is
# deploy-production-release.yml, shared with the recovery entry point.
on:
  workflow_dispatch:

permissions: {}

# Shared with the other production entry point: one production deployment at a time across both,
# and never cancel one that is already running.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  gate:
    name: Check the run can deploy
    runs-on: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL == 'true' && fromJSON('["self-hosted","linux","x64","inventory-agent"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Report and validate runner mode
        env:
          RUNNER_MODE: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL }}
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          case "$RUNNER_MODE" in
            true) selected=self-hosted ;;
            ''|false) selected=github-hosted ;;
            *) echo "::error::The repository variable INVENTORY_AGENT_SELF_HOSTED_ALL must be exactly true, false or unset. See docs/automation.md § Runner placement."; exit 1 ;;
          esac
          echo "Runner mode: INVENTORY_AGENT_SELF_HOSTED_ALL=${RUNNER_MODE:-<unset>} selects $selected runners."
          echo "This job runs on $RUNNER_NAME ($RUNNER_KIND)."
          if [ "$RUNNER_KIND" != "$selected" ]; then
            echo "::error::This job runs on a $RUNNER_KIND runner, but INVENTORY_AGENT_SELF_HOSTED_ALL now selects $selected runners; the variable changed after the job was queued. Re-run the job. See docs/automation.md § Runner placement."
            exit 1
          fi

      - name: Refuse runs not started from main
        if: github.ref != 'refs/heads/main'
        env:
          RUN_REF: ${{ github.ref }}
        run: |
          echo "::error::Deploy Production must be started from main; this run was started from $RUN_REF."
          exit 1

      - name: Require verified runner isolation for credentialed jobs
        # Issue #645 review: the release job receives Azure OIDC and the Static Web Apps token, so it
        # is skipped in self-hosted mode until a human confirms those runners are reset or ephemeral
        # per job. This step makes that refusal a visible failure instead of a silent skip.
        env:
          RUNNER_MODE: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL }}
          RUNNER_ISOLATION_VERIFIED: ${{ vars.INVENTORY_RUNNER_ISOLATION_VERIFIED }}
        run: |
          if [ "$RUNNER_MODE" = "true" ] && [ "$RUNNER_ISOLATION_VERIFIED" != "true" ]; then
            echo "::error::Credentialed jobs are disabled in self-hosted mode (INVENTORY_AGENT_SELF_HOSTED_ALL is true) until a human sets the repository variable INVENTORY_RUNNER_ISOLATION_VERIFIED to true after provisioning reset or ephemeral self-hosted runners. See docs/automation.md § Runner placement."
            exit 1
          fi

  release:
    name: Release
    needs: gate
    if: (vars.INVENTORY_AGENT_SELF_HOSTED_ALL != 'true' || vars.INVENTORY_RUNNER_ISOLATION_VERIFIED == 'true')
    # The union of what the release's jobs need; each of its jobs narrows this to its own permissions.
    permissions:
      contents: read
      deployments: write
      id-token: write
    uses: ./.github/workflows/deploy-production-release.yml
    with:
      entry_point: normal
    secrets: inherit
