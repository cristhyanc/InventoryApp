name: Agent implementation

# Implementation agent (Claude Code) for issues a human has marked `agent-ready`.
#
# Authority and lifecycle: AGENTS.md ("Automated task contract") and docs/automation.md.
# - Starts only when a human applies the `agent-ready` label to an issue.
# - Works from the latest `develop`, on a feature branch named `agent/issue-<n>-*`.
# - Runs the complete repository validation and opens a pull request targeting `develop`.
# - Never merges, deploys, or pushes to `develop`/`main`. Branch protection must also enforce this.
# - Agent branch/PR mutations use a short-lived, repository-scoped GitHub App token; deterministic workflow bookkeeping and dispatch use GITHUB_TOKEN. The Anthropic credential is CLAUDE_CODE_OAUTH_TOKEN.
#
# Before implementation starts, a separate read-only preflight job checks out trusted `develop` and
# validates the issue's documentation-impact declaration (scripts/validate-documentation-impact.mjs).
# When that check fails, the implementation job is skipped entirely: Claude does not run, no branch
# is created, and no label changes. The check is deliberately not a step of the implementation job,
# whose always-running outcome step would otherwise relabel the issue after a preflight failure.
#
# Claude prepares a local commit and PR metadata; a deterministic step mints a fresh repository-scoped
# GitHub App token to push the branch and open the pull request. A separate least-privilege job verifies the
# resulting PR, applies the `agent-review` label to it as a deterministic step (Claude itself is
# never granted `gh pr edit`/`gh label`), and dispatches trusted validation from `main` for its
# exact head SHA with dispatch_review=true, so the initial independent review starts automatically
# once validation succeeds. Nothing here approves, merges, releases, or deploys; merge stays
# human-controlled regardless of how the review is requested.

on:
  issues:
    types: [labeled]

permissions: {}

concurrency:
  group: agent-implement-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate issue documentation-impact declaration
    if: github.event.label.name == 'agent-ready' && github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read

    steps:
      - name: Check out trusted develop
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: develop
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Validate the issue documentation-impact declaration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/issue-body.md"
          gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""' > "$body_file"

          if ! node scripts/validate-documentation-impact.mjs --issue-body "$body_file"; then
            echo "::error title=Documentation impact preflight failed::Issue #$ISSUE_NUMBER does not carry a valid documentation-impact declaration, so implementation did not start: Claude was not run, no branch was created and no label was changed. Edit the issue so it has exactly one 'Documentation impact decision' section containing exactly 'Documentation changes required' or 'No documentation changes required', and exactly one 'Documentation impact details' section that lists the affected documentation files/sections or explains specifically why documentation is unaffected (bare 'None', 'N/A' or 'Not applicable' is rejected). Then remove and re-apply the agent-ready label."
            exit 1
          fi

  implement:
    name: Implement agent-ready issue
    needs: preflight
    if: needs.preflight.result == 'success' && github.event.label.name == 'agent-ready' && github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      dispatch_validation: ${{ steps.outcome.outputs.dispatch_validation }}
      pr_number: ${{ steps.outcome.outputs.pr_number }}
      head_sha: ${{ steps.outcome.outputs.head_sha }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Check out develop
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Capture trusted base and resume checkpoint
        id: starting_point
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD)"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "resumed=false" >> "$GITHUB_OUTPUT"
          # Only an earlier attempt of this exact run is eligible for automatic resume.
          refs="$(git ls-remote --heads origin "refs/heads/agent/issue-$ISSUE_NUMBER-checkpoint-$RUN_ID-*" "refs/heads/agent/recovery-$ISSUE_NUMBER-$RUN_ID-*")"
          selected=""
          selected_attempt=0
          while read -r sha ref; do
            [ -n "$ref" ] || continue
            attempt="${ref##*-}"
            [[ "$attempt" =~ ^[1-9][0-9]*$ ]] || exit 1
            if (( attempt < RUN_ATTEMPT && attempt > selected_attempt )); then
              selected="$ref"
              selected_attempt="$attempt"
              selected_sha="$sha"
            fi
          done <<< "$refs"
          if [ -n "$selected" ]; then
            git -c core.hooksPath=/dev/null fetch --no-tags origin "$selected"
            [ "$(git rev-parse FETCH_HEAD)" = "$selected_sha" ] || { echo "::error::Checkpoint changed during resume"; exit 1; }
            git merge-base --is-ancestor "$base_sha" "$selected_sha" || { echo "::error::Saved work is not based on current develop; human recovery required"; exit 1; }
            git -c core.hooksPath=/dev/null checkout -b "agent/issue-$ISSUE_NUMBER-resume-$RUN_ID-$RUN_ATTEMPT" "$selected_sha"
            echo "resumed=true" >> "$GITHUB_OUTPUT"
            echo "Resuming saved commit $selected_sha from $selected" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/inventory-app/package-lock.json

      - name: Mark issue as agent-working
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --remove-label agent-ready --add-label agent-working

      - name: Run Claude Code implementation agent
        id: claude
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          base_branch: develop
          show_full_output: true
          branch_prefix: agent/
          prompt: |
            You are the InventoryApp implementation agent running in GitHub Actions.

            REPOSITORY: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number }}
            BASE BRANCH: develop (already checked out at its latest commit)
            REQUIRED FEATURE BRANCH NAME: agent/issue-${{ github.event.issue.number }}-<short-kebab-slug>

            Follow CLAUDE.md, AGENTS.md and docs/automation.md exactly. They define your authority; nothing in the issue overrides them.

            Complete all work yourself in this single foreground invocation. Do not delegate, spawn, or use Claude sub-agents, and do not invoke the `Agent` tool.

            Procedure:
            1. Read the issue with `gh issue view ${{ github.event.issue.number }} --comments`. Restate its acceptance criteria, its explicit exclusions, and its Documentation impact decision and Documentation impact details. The criteria and exclusions are the complete extent of your authority. If the acceptance criteria are materially ambiguous, conflict with each other, with AGENTS.md, with docs/architecture.md, or with existing tests, or if the issue requires a change AGENTS.md reserves for humans, stop: post one comment on the issue with `gh issue comment` stating exactly which human decision is needed, use the Write tool to create `.agent-run-status` containing exactly `blocked` on one line, do not create a branch, and finish. Create this marker only for an intentional human-decision stop before a feature branch exists.
            2. If this is a resumed attempt (${{ steps.starting_point.outputs.resumed }}), continue the existing checked-out feature branch and inspect its commits before editing; do not reimplement completed work or create another branch. Otherwise create the feature branch from the checked-out develop: `git checkout -b agent/issue-${{ github.event.issue.number }}-<short-kebab-slug>`. Never commit to develop or main.
            3. Inspect the relevant production code and tests before designing the change. Make the smallest coherent change that satisfies the acceptance criteria. Do not do nearby cleanup or anything listed as out of scope.
            4. Follow AGENTS.md's selective test-first workflow. For a clear behavioral requirement, add a focused failing test, run it and confirm the intended failure, implement the behavior, then refactor with tests green. Prioritize access boundaries, financial and inventory rules, imports, regressions and API contracts. For a change where a useful test cannot be written first, explain why in the PR and verify the result. Add meaningful edge cases; avoid tests that restate implementation details.
            4a. Follow the issue's Documentation impact decision exactly. If it is "Documentation changes required", update every documentation file and section listed in the Documentation impact details on your feature branch, in this same change, so the documentation is accurate for the merged result. If it is "No documentation changes required" but your change nevertheless makes documentation (AGENTS.md, docs/, README.md, templates) inaccurate, update that documentation too and state the discrepancy with the issue explicitly in the pull request body and in your issue comment. Never leave documentation that the change contradicts.
            5. Run the complete repository validation once in the foreground with exactly `bash scripts/validate.sh`, wait for it to terminate, inspect its exit code and retain its actual output for the pull request. Never use `&`, `nohup`, `run_in_background`, redirected background execution, concurrent validation processes, or any mechanism that returns before validation completes. If validation fails because of your change, fix the change and rerun it synchronously. Never weaken, skip, or delete a failing test to get a green result. If it fails for an environmental reason, record the exact failing command and output. A started or still-running command is not validation evidence.
            6. Review your diff for secrets, local databases, generated output, accidental migrations, and unrelated edits. Do not create tracked diagnostic/scratch files. If a temporary file was accidentally staged under `backend/`, `frontend/`, `docs/`, or `scripts/`, unstage it with the permitted scoped `git restore --staged -- <project-path>` command before completion. When deleting obsolete tracked project files, use the permitted `git rm -- <project-path>` form without extra flags.
            7. Commit the completed implementation locally with focused, descriptive messages. Do not push any branch and do not create or edit a pull request; the workflow performs those remote mutations after your invocation with a separate short-lived GitHub App token that is never exposed to you.
            8. Prepare the pull request metadata as two untracked scratch files in the repository root: `.agent-pr-title` containing exactly the PR title, and `.agent-pr-body.md` containing the complete body. The body must follow .github/pull_request_template.md, include `Closes #${{ github.event.issue.number }}`, address each acceptance criterion, describe scope and exclusions, paste the actual validation commands and their real result, list tests added or changed and the observed initial failing test (or explain why test-first was unsuitable), fill the impact table, and state known limitations and suggested follow-up work. Fill the "## Documentation impact" section accurately with exactly one `Decision:` line and one `Evidence:` line: `Decision: UPDATED` when this pull request changes documentation, with Evidence listing each documentation file and what changed in it; `Decision: NOT REQUIRED` only when no documentation changed, with Evidence explaining for this specific change why behaviour, contracts, architecture, configuration, automation, deployment, operations and user workflows are unaffected. "None", "N/A", "Not applicable", generic sentences and the template placeholders are rejected by CI. Run `node scripts/validate-documentation-impact.mjs --pr-body .agent-pr-body.md` and fix it until it passes. Never add or commit either scratch file.
            9. Before finishing, verify that validation has terminated successfully, the current branch matches `agent/issue-${{ github.event.issue.number }}-*`, the index and tracked working tree are clean, `git rev-parse HEAD` is your completed local commit, and both scratch files exist and are untracked. Do not push, create a PR, apply labels, request reviewers, merge, or describe partial work as complete.

            Completion is valid only when all of these postconditions are true:
            - `bash scripts/validate.sh` terminated in this session and its exit code and result are known;
            - the working tree and index contain no tracked changes;
            - the current branch matches `agent/issue-${{ github.event.issue.number }}-*`;
            - the completed implementation is committed locally;
            - `.agent-pr-title` and `.agent-pr-body.md` exist and are untracked; and
            - `node scripts/validate-documentation-impact.mjs --pr-body .agent-pr-body.md` passed.

            Hard limits: do not merge, approve, deploy, run migrations against any environment, modify labels, change workflows, secrets or repository settings, touch anything outside the acceptance criteria, or claim a command passed unless it ran and succeeded in this session.
          claude_args: |
            --max-turns 250
            --allowedTools "Read,Glob,Grep,Edit,MultiEdit,Write"
            "Bash(gh issue view *),Bash(gh issue comment *),Bash(gh pr view *),Bash(gh pr list *)"
            "Bash(git status *),Bash(git diff *),Bash(git log *),Bash(git show *),Bash(git branch --show-current),Bash(git rev-parse *)"
            "Bash(git checkout -b agent/issue-${{ github.event.issue.number }}-*),Bash(git switch -c agent/issue-${{ github.event.issue.number }}-*)"
            "Bash(git rm -- backend/*),Bash(git rm -- frontend/*),Bash(git rm -- docs/*),Bash(git rm -- scripts/*)"
            "Bash(git restore --staged -- backend/*),Bash(git restore --staged -- frontend/*),Bash(git restore --staged -- docs/*),Bash(git restore --staged -- scripts/*)"
            "Bash(git add *),Bash(git commit *)"
            "Bash(bash scripts/validate.sh),Bash(dotnet *),Bash(npm --prefix frontend/inventory-app *),Bash(node scripts/validate-documentation-impact.mjs --pr-body *)"
            --disallowedTools "Agent,WebFetch,WebSearch"
            "Bash(git push *),Bash(git push * --force *),Bash(git push * -f *),Bash(git push * --force-with-lease *),Bash(git push --force *),Bash(git push -f *)"
            "Bash(git reset --hard *),Bash(git rebase *),Bash(git checkout develop *),Bash(git checkout main *),Bash(git switch develop *),Bash(git switch main *)"
            "Bash(gh pr create *),Bash(gh pr merge *),Bash(gh pr review *),Bash(gh pr edit *),Bash(gh issue edit *),Bash(gh api *),Bash(gh workflow *),Bash(gh run *),Bash(gh release *),Bash(gh secret *),Bash(gh variable *)"
      # Storage only: independent of clean-tree, validation claims and PR metadata.
      - name: Inspect persistence candidate
        id: persistence_candidate
        if: always() && steps.starting_point.outcome == 'success' && steps.claude.outcome != 'skipped'
        env:
          BASE_SHA: ${{ steps.starting_point.outputs.base_sha }}
        run: |
          set -euo pipefail
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$(git rev-parse HEAD)" != "$BASE_SHA" ]; then
            echo "has_commit=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub App token for persistence
        id: persistence_app_token
        if: always() && steps.persistence_candidate.outputs.has_commit == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AGENT_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Diagnose persistence GitHub App token
        if: always() && steps.persistence_app_token.outcome == 'success' && steps.persistence_candidate.outputs.has_commit == 'true'
        env:
          GH_TOKEN: ${{ steps.persistence_app_token.outputs.token }}
          EXPECTED_HEAD: ${{ steps.persistence_candidate.outputs.head_sha }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -u
          echo "Testing the exact short-lived GitHub App installation token before persistence."

          installation_json=""
          installation_error_file="$(mktemp)"
          if installation_json="$(gh api installation/repositories 2>"$installation_error_file")"; then
            repo_json="$(jq -c --arg repo "$GITHUB_REPOSITORY" '.repositories[] | select(.full_name == $repo)' <<<"$installation_json" | head -n1)"
            if [ -n "$repo_json" ]; then
              repo_push="$(jq -r '.permissions.push // false' <<<"$repo_json")"
              repo_pull="$(jq -r '.permissions.pull // false' <<<"$repo_json")"
              repo_admin="$(jq -r '.permissions.admin // false' <<<"$repo_json")"
              echo "Installation token repository access includes $GITHUB_REPOSITORY: YES"
              echo "Effective repository permissions for installation token: push=$repo_push pull=$repo_pull admin=$repo_admin"
              if [ "$repo_push" != "true" ]; then
                echo "::error::Installation token can access the repository but GitHub reports permissions.push=$repo_push."
              fi
            else
              repo_count="$(jq -r '.total_count // (.repositories | length)' <<<"$installation_json")"
              echo "::error::Installation token is valid but $GITHUB_REPOSITORY is not in its accessible repository set (count=$repo_count)."
            fi
          else
            echo "::error::The token could not call GET /installation/repositories, so its installation scope could not be verified."
            sed 's/^/installation endpoint: /' "$installation_error_file"
          fi
          rm -f "$installation_error_file"

          if [ "$CLAUDE_OUTCOME" = "success" ]; then
            probe_branch="agent/issue-$ISSUE_NUMBER-checkpoint-$RUN_ID-$RUN_ATTEMPT"
          else
            probe_branch="agent/recovery-$ISSUE_NUMBER-$RUN_ID-$RUN_ATTEMPT"
          fi

          publish_remote="https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN:-}" | base64 -w0)"
          echo "::add-mask::$auth"

          echo "Testing Git write authorization with a non-mutating push --dry-run to $probe_branch."
          if probe_output="$(git -c credential.helper= -c http.extraheader="AUTHORIZATION: basic $auth" \
            push --dry-run "$publish_remote" "$EXPECTED_HEAD:refs/heads/$probe_branch" 2>&1)"; then
            echo "Git dry-run push authorization: OK"
          else
            echo "Git dry-run push authorization: DENIED"
            printf '%s\n' "$probe_output"
            echo "::error::The GitHub App installation token cannot push the agent persistence branch. Check the installation's effective Contents permission or repository-level authorization for the app actor."
          fi

      - name: Persist committed implementation
        id: persist_implementation
        if: always() && steps.persistence_candidate.outcome == 'success' && (steps.persistence_app_token.outcome == 'success' || steps.persistence_candidate.outputs.has_commit != 'true')
        env:
          BASE_SHA: ${{ steps.starting_point.outputs.base_sha }}
          EXPECTED_HEAD: ${{ steps.persistence_candidate.outputs.head_sha }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ steps.persistence_app_token.outputs.token }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ && "$RUN_ID" =~ ^[1-9][0-9]*$ && "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || fail "Invalid persistence identity"
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]] || fail "Invalid expected SHA"
          [ "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" ] || fail "Unexpected HEAD before persistence"
          git cat-file -e "$BASE_SHA^{commit}" || fail "Missing trusted base"
          [ "$EXPECTED_HEAD" != "$BASE_SHA" ] || exit 0
          branch="$(git branch --show-current)"
          [[ "$branch" == agent/issue-"$ISSUE_NUMBER"-* ]] || fail "Unexpected implementation branch"
          git merge-base --is-ancestor "$BASE_SHA" "$EXPECTED_HEAD" || fail "Implementation is not ahead of trusted base"
          # Check every commit, including reverted files and merge parents, not only net diff.
          changed="$(git -c core.quotepath=false log --format= --name-only --diff-merges=separate "$BASE_SHA..$EXPECTED_HEAD")"
          [ -n "$changed" ] || fail "No meaningful committed file changes"
          while read -r commit; do
            protected_bytes="$(git diff-tree --root -r -m --no-commit-id --name-only -z "$commit" -- .github '.agent-*' inventory.db | wc -c)"
            [ "$protected_bytes" -eq 0 ] || fail "Protected control-plane or scratch files in implementation history; human recovery required"
          done < <(git rev-list "$BASE_SHA..$EXPECTED_HEAD")
          if [ "$CLAUDE_OUTCOME" = "success" ]; then
            saved_branch="agent/issue-$ISSUE_NUMBER-checkpoint-$RUN_ID-$RUN_ATTEMPT"
          else
            saved_branch="agent/recovery-$ISSUE_NUMBER-$RUN_ID-$RUN_ATTEMPT"
          fi
          # No stored credential or token-bearing remote/config is handed to a later agent.
          publish_remote="${PUBLISH_REMOTE:-https://github.com/${GITHUB_REPOSITORY}.git}"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN:-}" | base64 -w0)"
          echo "::add-mask::$auth"
          push_with_app_retry() {
            local remote="$1"
            local refspec="$2"
            local delays=(0 2 5 10)
            local attempt=0
            local delay
            local output
            local status

            for delay in "${delays[@]}"; do
              attempt=$((attempt + 1))
              if [ "$delay" -gt 0 ]; then
                echo "::warning::Retrying GitHub App Git push after ${delay}s (attempt ${attempt}/${#delays[@]})."
                sleep "$delay"
              fi

              set +e
              output="$(git -c credential.helper= -c core.hooksPath=/dev/null -c http.extraheader="AUTHORIZATION: basic $auth" push "$remote" "$refspec" 2>&1)"
              status=$?
              set -e
              printf '%s\n' "$output"

              if [ "$status" -eq 0 ]; then
                return 0
              fi

              if ! grep -Eqi '403|Permission to .* denied' <<<"$output"; then
                return "$status"
              fi

              if [ "$attempt" -ge "${#delays[@]}" ]; then
                return "$status"
              fi
            done
          }

          remote_head="$(git -c credential.helper= -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote "$publish_remote" "refs/heads/$saved_branch")"
          if [ -n "$remote_head" ]; then
            [ "${remote_head%%          remote_head="$(git -c credential.helper= -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote "$publish_remote" "refs/heads/$saved_branch")"
          [ "${remote_head%%$'\t'*}" = "$EXPECTED_HEAD" ] || fail "Remote persistence verification failed"
          echo "saved_branch=$saved_branch" >> "$GITHUB_OUTPUT"
          echo "saved_sha=$EXPECTED_HEAD" >> "$GITHUB_OUTPUT"
          echo "Work preserved at $saved_branch ($EXPECTED_HEAD). Storage only; validation, architecture and human approval remain required." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify implementation result
        id: implementation_result
        if: success() && steps.claude.outcome == 'success'
        run: |
          set -euo pipefail
          {
            echo "ready=false"
            echo "blocked=false"
            echo "branch="
            echo "head_sha="
          } >> "$GITHUB_OUTPUT"

          branch="$(git branch --show-current)"
          if [ "$branch" = "develop" ] &&
             [ -f .agent-run-status ] &&
             [ -z "$(git ls-files -- .agent-run-status)" ] &&
             [ "$(cat .agent-run-status)" = "blocked" ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "Implementation agent intentionally stopped for a human decision."
            exit 0
          fi

          [[ "$branch" == agent/issue-"$ISSUE_NUMBER"-* ]] || { echo "::error::Unexpected feature branch: $branch"; exit 1; }
          git diff --quiet || { echo "::error::Tracked working-tree changes remain after implementation"; exit 1; }
          git diff --cached --quiet || { echo "::error::Staged changes remain after implementation"; exit 1; }
          [ -f .agent-pr-title ] || { echo "::error::Missing .agent-pr-title"; exit 1; }
          [ -f .agent-pr-body.md ] || { echo "::error::Missing .agent-pr-body.md"; exit 1; }
          [ -z "$(git ls-files -- .agent-pr-title .agent-pr-body.md)" ] || { echo "::error::PR metadata scratch files must remain untracked"; exit 1; }

          title="$(cat .agent-pr-title)"
          [ -n "$title" ] || { echo "::error::PR title is empty"; exit 1; }
          [[ "$title" != *$'\n'* ]] || { echo "::error::PR title must be a single line"; exit 1; }
          [ "${#title}" -le 256 ] || { echo "::error::PR title is too long"; exit 1; }
          node scripts/validate-documentation-impact.mjs --pr-body .agent-pr-body.md

          head_sha="$(git rev-parse HEAD)"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Could not resolve implementation HEAD"; exit 1; }

          {
            echo "ready=true"
            echo "branch=$branch"
            echo "head_sha=$head_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token for implementation publish
        id: implementation_app_token
        if: steps.implementation_result.outputs.ready == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AGENT_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Diagnose GitHub App publish permissions
        if: steps.implementation_result.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.implementation_app_token.outputs.token }}
        run: |
          set -euo pipefail
          permissions="$(gh api "repos/$GITHUB_REPOSITORY" --include 2>&1 >/dev/null \
            | tr -d '\r' \
            | grep -i '^x-accepted-github-permissions:' \
            | sed 's/^[^:]*:[[:space:]]*//' || true)"
          if [ -n "$permissions" ]; then
            echo "GitHub App token accepted repository permissions: $permissions"
          else
            echo "::warning::GitHub did not return an X-Accepted-GitHub-Permissions header for the repository metadata request."
          fi

          can_write="$(gh api "repos/$GITHUB_REPOSITORY/installation" --silent >/dev/null 2>&1 && echo yes || echo no)"
          echo "GitHub App installation endpoint accessible: $can_write"
          echo "Publish requires effective contents=write; pull_requests=write; workflows=write."

      - name: Push implementation and create pull request
        id: publish_implementation
        if: steps.implementation_result.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.implementation_app_token.outputs.token }}
          BRANCH: ${{ steps.implementation_result.outputs.branch }}
          HEAD_SHA: ${{ steps.implementation_result.outputs.head_sha }}
          EXPECTED_AGENT_AUTHOR: ${{ vars.AGENT_AUTOMATION_APP_BOT_LOGIN }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          [ "$HEAD_SHA" = "${{ steps.persist_implementation.outputs.saved_sha }}" ] || fail "Implementation was not durably persisted."
          [ -n "$EXPECTED_AGENT_AUTHOR" ] || fail "AGENT_AUTOMATION_APP_BOT_LOGIN is not configured."
          [ "$(git branch --show-current)" = "$BRANCH" ] || fail "Local branch changed before publish."
          [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ] || fail "Local HEAD changed before publish."

          publish_remote="https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN:-}" | base64 -w0)"
          echo "::add-mask::$auth"
          push_with_app_retry() {
            local remote="$1"
            local refspec="$2"
            local delays=(0 2 5 10)
            local attempt=0
            local delay
            local output
            local status

            for delay in "${delays[@]}"; do
              attempt=$((attempt + 1))
              if [ "$delay" -gt 0 ]; then
                echo "::warning::Retrying GitHub App Git push after ${delay}s (attempt ${attempt}/${#delays[@]})."
                sleep "$delay"
              fi

              set +e
              output="$(git -c credential.helper= -c core.hooksPath=/dev/null -c http.extraheader="AUTHORIZATION: basic $auth" push "$remote" "$refspec" 2>&1)"
              status=$?
              set -e
              printf '%s\n' "$output"

              if [ "$status" -eq 0 ]; then
                return 0
              fi

              if ! grep -Eqi '403|Permission to .* denied' <<<"$output"; then
                return "$status"
              fi

              if [ "$attempt" -ge "${#delays[@]}" ]; then
                return "$status"
              fi
            done
          }

          push_with_app_retry "$publish_remote" "HEAD:refs/heads/$BRANCH"

          title="$(cat .agent-pr-title)"
          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base develop --head "$BRANCH" --title "$title" --body-file .agent-pr-body.md)"
          pr_number="$(gh pr view "$pr_url" --repo "$GITHUB_REPOSITORY" --json number --jq '.number')"
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]] || fail "Could not determine created pull request number."

          pr_meta="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg author "$EXPECTED_AGENT_AUTHOR" --arg branch "$BRANCH" --arg sha "$HEAD_SHA"             '.state == "open" and .draft == false and .base.ref == "develop" and .head.repo.full_name == $repo and .head.ref == $branch and .head.sha == $sha and .user.login == $author'             <<<"$pr_meta" >/dev/null || fail "Created pull request failed the agent PR identity/head checks."

          {
            echo "pr_number=$pr_number"
            echo "pr_url=$pr_url"
            echo "branch=$BRANCH"
            echo "head_sha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Comment with opened pull request
        if: steps.publish_implementation.outcome == 'success'
        env:
          PR_URL: ${{ steps.publish_implementation.outputs.pr_url }}
          HEAD_SHA: ${{ steps.publish_implementation.outputs.head_sha }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"             --body "Implementation was validated and published as $PR_URL at head $HEAD_SHA. The independent architecture pass runs next. Run: $RUN_URL"

      - name: Verify the architecture pass target
        id: architecture_target
        if: steps.publish_implementation.outcome == 'success'
        env:
          EXPECTED_AGENT_AUTHOR: ${{ vars.AGENT_AUTOMATION_APP_BOT_LOGIN }}
        run: |
          set -euo pipefail
          branch="${{ steps.publish_implementation.outputs.branch }}"
          expected_pr="${{ steps.publish_implementation.outputs.pr_number }}"
          expected_sha="${{ steps.publish_implementation.outputs.head_sha }}"

          [ "$(git branch --show-current)" = "$branch" ] || { echo "::error::Unexpected local branch before architecture pass"; exit 1; }
          pr_json="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base develop --head "$branch"             --json number,headRefOid --jq 'if length == 1 then .[0] else {} end')"
          pr_number="$(jq -r '.number // empty' <<<"$pr_json")"
          head_sha="$(jq -r '.headRefOid // empty' <<<"$pr_json")"
          [ "$pr_number" = "$expected_pr" ] || { echo "::error::No unique expected open PR for $branch"; exit 1; }
          [ "$head_sha" = "$expected_sha" ] || { echo "::error::Published PR head changed before architecture pass"; exit 1; }
          [ -n "$EXPECTED_AGENT_AUTHOR" ] || { echo "::error::AGENT_AUTOMATION_APP_BOT_LOGIN is not configured"; exit 1; }

          pr_meta="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg author "$EXPECTED_AGENT_AUTHOR"             '.state == "open" and .draft == false and .base.ref == "develop" and .head.repo.full_name == $repo and .user.login == $author'             <<<"$pr_meta" >/dev/null || { echo "::error::PR is not a same-repository agent PR authored by $EXPECTED_AGENT_AUTHOR"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$head_sha" ] || { echo "::error::Local HEAD does not match the open PR"; exit 1; }

          {
            echo "pr_number=$pr_number"
            echo "branch=$branch"
            echo "head_sha=$head_sha"
            echo "pr_ready=true"
          } >> "$GITHUB_OUTPUT"

      # A fresh Claude invocation reviews the coder's PR and may make narrowly scoped,
      # behavior-preserving structural fixes on the same feature branch before validation.
      - name: Run Claude Code architecture agent
        id: architect
        if: steps.architecture_target.outputs.pr_ready == 'true'
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          base_branch: develop
          show_full_output: true
          branch_prefix: agent/
          prompt: |
            You are a new, separate InventoryApp architecture agent invocation. The coder has opened pull request #${{ steps.architecture_target.outputs.pr_number }}. Work only on its existing agent/issue-${{ github.event.issue.number }}-* feature branch; do not create another branch or pull request.

            Follow CLAUDE.md, AGENTS.md, docs/architecture.md and docs/automation.md. Complete all work yourself in this single foreground invocation. Do not delegate, spawn, or use Claude sub-agents, and do not invoke the `Agent` tool. Read the issue's acceptance criteria and exclusions, the open PR and its full diff, and the existing tests before proposing edits. Verify the current branch is the PR's head branch and that its base is develop. If there is no single matching open PR, stop without editing.

            Review only touched code and its directly affected boundaries: controllers versus use cases, domain rules versus adapters, dependency direction, framework or persistence leakage, duplicated calculations, information hiding, and testability. Make a small structural correction only when the current implementation violates an established rule or obscures the approved behavior. Preserve all observable behavior, API contracts, data semantics, and acceptance criteria. Do not perform broad Clean Architecture migrations, add frameworks, or touch unrelated files. A clean result with no edits is valid.

            Before editing, check whether your proposed change would require a migration, change documented architecture or the PR's Documentation impact declaration, expand the approved scope, alter a test expectation, or require a human decision. If so, make no change; comment on the PR with the exact finding for human review. Do not edit the issue or PR body. Never weaken, skip, or delete tests. Do not change workflows, secrets, configuration, or deployment.

            If you edit: run `bash scripts/validate.sh`; if validation fails, fix only your structural change and rerun it. Check the final diff against the issue and PR body and commit a focused architecture change locally. Do not push; a deterministic workflow step will mint a fresh GitHub App token and push the verified local head after your invocation. Comment on the PR with the structural changes and exact validation result. If you make no edits, comment briefly that no in-scope architectural corrections were needed. Never claim a command passed unless it ran successfully.

            Never merge, approve, deploy, edit labels, open another PR, change the PR description, or modify production data. Independent exact-SHA validation and review still follow this stage.
          claude_args: |
            --max-turns 100
            --allowedTools "Read,Glob,Grep,Edit,MultiEdit,Write"
            "Bash(gh issue view *),Bash(gh pr view *),Bash(gh pr diff *),Bash(gh pr list *),Bash(gh pr comment *)"
            "Bash(git status *),Bash(git diff *),Bash(git log *),Bash(git show *),Bash(git branch --show-current),Bash(git rev-parse *)"
            "Bash(git rm -- backend/*),Bash(git rm -- frontend/*),Bash(git rm -- docs/*),Bash(git rm -- scripts/*)"
            "Bash(git restore --staged -- backend/*),Bash(git restore --staged -- frontend/*),Bash(git restore --staged -- docs/*),Bash(git restore --staged -- scripts/*)"
            "Bash(git add *),Bash(git commit *)"
            "Bash(bash scripts/validate.sh),Bash(dotnet *),Bash(npm --prefix frontend/inventory-app *)"
            --disallowedTools "Agent,WebFetch,WebSearch"
            "Bash(git push *),Bash(git push * --force *),Bash(git push * -f *),Bash(git push * --force-with-lease *),Bash(git reset --hard *),Bash(git rebase *)"
            "Bash(git checkout *),Bash(git switch *),Bash(gh pr merge *),Bash(gh pr review *),Bash(gh pr edit *),Bash(gh pr create *),Bash(gh issue edit *),Bash(gh api *),Bash(gh workflow *),Bash(gh run *)"

      - name: Verify architecture result
        id: architecture_result
        if: steps.architect.outcome == 'success'
        env:
          START_SHA: ${{ steps.architecture_target.outputs.head_sha }}
          BRANCH: ${{ steps.architecture_target.outputs.branch }}
        run: |
          set -euo pipefail
          [ "$(git branch --show-current)" = "$BRANCH" ] || { echo "::error::Architecture pass changed branch"; exit 1; }
          git diff --quiet || { echo "::error::Tracked working-tree changes remain after architecture pass"; exit 1; }
          git diff --cached --quiet || { echo "::error::Staged changes remain after architecture pass"; exit 1; }
          head_sha="$(git rev-parse HEAD)"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Could not resolve architecture HEAD"; exit 1; }
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          if [ "$head_sha" = "$START_SHA" ]; then
            echo "push_required=false" >> "$GITHUB_OUTPUT"
          else
            echo "push_required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub App token for architecture publish
        id: architecture_app_token
        if: steps.architecture_result.outputs.push_required == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AGENT_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Push architecture head
        id: publish_architecture
        if: steps.architecture_result.outputs.push_required == 'true'
        env:
          GH_TOKEN: ${{ steps.architecture_app_token.outputs.token }}
          BRANCH: ${{ steps.architecture_target.outputs.branch }}
          HEAD_SHA: ${{ steps.architecture_result.outputs.head_sha }}
        run: |
          set -euo pipefail
          [ "$(git branch --show-current)" = "$BRANCH" ] || { echo "::error::Local branch changed before architecture publish"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ] || { echo "::error::Local HEAD changed before architecture publish"; exit 1; }

          publish_remote="https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN:-}" | base64 -w0)"
          echo "::add-mask::$auth"
          push_with_app_retry() {
            local remote="$1"
            local refspec="$2"
            local delays=(0 2 5 10)
            local attempt=0
            local delay
            local output
            local status

            for delay in "${delays[@]}"; do
              attempt=$((attempt + 1))
              if [ "$delay" -gt 0 ]; then
                echo "::warning::Retrying GitHub App Git push after ${delay}s (attempt ${attempt}/${#delays[@]})."
                sleep "$delay"
              fi

              set +e
              output="$(git -c credential.helper= -c core.hooksPath=/dev/null -c http.extraheader="AUTHORIZATION: basic $auth" push "$remote" "$refspec" 2>&1)"
              status=$?
              set -e
              printf '%s\n' "$output"

              if [ "$status" -eq 0 ]; then
                return 0
              fi

              if ! grep -Eqi '403|Permission to .* denied' <<<"$output"; then
                return "$status"
              fi

              if [ "$attempt" -ge "${#delays[@]}" ]; then
                return "$status"
              fi
            done
          }

          push_with_app_retry "$publish_remote" "HEAD:refs/heads/$BRANCH"

      - name: Record outcome on the issue
        id: outcome
        if: always()
        env:
          PERSIST_OUTCOME: ${{ steps.persist_implementation.outcome }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          ARCHITECT_OUTCOME: ${{ steps.architect.outcome }}
          TARGET_OUTCOME: ${{ steps.architecture_target.outcome }}
          ARCHITECTURE_RESULT_OUTCOME: ${{ steps.architecture_result.outcome }}
          AGENT_BLOCKED: ${{ steps.implementation_result.outputs.blocked }}
          SAVED_BRANCH: ${{ steps.persist_implementation.outputs.saved_branch }}
          SAVED_SHA: ${{ steps.persist_implementation.outputs.saved_sha }}
        run: |
          set -euo pipefail
          {
            echo "dispatch_validation=false"
            echo "pr_number="
            echo "head_sha="
          } >> "$GITHUB_OUTPUT"

          if [ -n "$SAVED_BRANCH" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Committed work preserved on $SAVED_BRANCH at $SAVED_SHA. This is storage only, not evidence of validation or approval. Run: $RUN_URL"
          fi
          prefix="agent/issue-$ISSUE_NUMBER-"
          pr_json="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base develop \
            --json number,url,headRefName,headRefOid \
            | jq -c --arg p "$prefix" '[.[] | select(.headRefName | startswith($p))][0] // {}')"
          pr_url="$(jq -r '.url // empty' <<<"$pr_json")"
          pr_number="$(jq -r '.number // empty' <<<"$pr_json")"
          head_sha="$(jq -r '.headRefOid // empty' <<<"$pr_json")"

          # Only tracked changes can alter the proposed PR commit. Agent scratch files are
          # untracked and disappear with this runner; they must not block validation.
          if [ "$AGENT_BLOCKED" = "true" ]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --remove-label agent-working --add-label agent-blocked
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$(cat <<EOF
          The implementation agent intentionally stopped before creating a pull request because a human decision is required. This is an expected blocked-task outcome, not an implementation workflow failure. Read the preceding agent comment for the exact decision or permission needed.

          Run: $RUN_URL
          EOF
          )"
          elif [ "$PERSIST_OUTCOME" = "success" ] &&
             [ "$CLAUDE_OUTCOME" = "success" ] &&
             [ "$TARGET_OUTCOME" = "success" ] &&
             [ "$ARCHITECT_OUTCOME" = "success" ] &&
             [ "$ARCHITECTURE_RESULT_OUTCOME" = "success" ] &&
             [ "$(git branch --show-current)" = "$(jq -r '.headRefName // empty' <<<"$pr_json")" ] &&
             [ "$(git rev-parse HEAD)" = "$head_sha" ] &&
             git diff --quiet &&
             git diff --cached --quiet &&
             [ -n "$pr_url" ] &&
             [[ "$pr_number" =~ ^[1-9][0-9]*$ ]] &&
             [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            {
              echo "dispatch_validation=true"
              echo "pr_number=$pr_number"
              echo "head_sha=$head_sha"
            } >> "$GITHUB_OUTPUT"

            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --remove-label agent-working --add-label agent-review
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$(cat <<EOF
          Implementation and architecture runs finished for $pr_url at head $head_sha.

          A separate follow-up job will apply the \`agent-review\` label and dispatch trusted validation for that exact SHA. Once the \`agent-validation\` status passes, the initial independent review starts automatically; no further action is needed to request it. Human approval and merge remain required.

          Run: $RUN_URL
          EOF
          )"
          elif [ "$CLAUDE_OUTCOME" = "cancelled" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body "Implementation run was cancelled (superseded by a newer run for this issue). Run: $RUN_URL"
          else
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --remove-label agent-working --add-label agent-blocked
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$(cat <<EOF
          Implementation or architecture stage ended without a verified completed pull request targeting develop from a \`$prefix*\` branch (coder: $CLAUDE_OUTCOME; target check: $TARGET_OUTCOME; architect: $ARCHITECT_OUTCOME). The task is now \`agent-blocked\` and needs a human decision. Read the run log and any comment the agent left above, resolve the blocker, then remove \`agent-blocked\` and re-apply \`agent-ready\` to start again.

          Run: $RUN_URL
          EOF
          )"
          fi

  dispatch-validation:
    name: Dispatch exact-SHA validation
    needs: implement
    if: always() && needs.implement.outputs.dispatch_validation == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: write

    steps:
      - name: Verify pull request and dispatch trusted validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.implement.outputs.pr_number }}
          HEAD_SHA: ${{ needs.implement.outputs.head_sha }}
          EXPECTED_AGENT_AUTHOR: ${{ vars.AGENT_AUTOMATION_APP_BOT_LOGIN }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          pr_json="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json state,isDraft,baseRefName,headRefName,headRefOid,headRepository,headRepositoryOwner)"
          state="$(jq -r '.state' <<<"$pr_json")"
          is_draft="$(jq -r '.isDraft' <<<"$pr_json")"
          base_ref="$(jq -r '.baseRefName' <<<"$pr_json")"
          head_ref="$(jq -r '.headRefName' <<<"$pr_json")"
          current_sha="$(jq -r '.headRefOid // empty' <<<"$pr_json")"
          head_repo="$(jq -r '"\(.headRepositoryOwner.login)/\(.headRepository.name)"' <<<"$pr_json")"
          author="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq '.user.login // empty')"

          [ "$state" = "OPEN" ] || fail "Pull request #$PR_NUMBER is not open."
          [ "$is_draft" = "false" ] || fail "Pull request #$PR_NUMBER is a draft."
          [ "$base_ref" = "develop" ] || fail "Automated validation is limited to pull requests targeting develop."
          [ "$head_repo" = "$GITHUB_REPOSITORY" ] || fail "Automated validation is limited to same-repository branches."
          [[ "$head_ref" == agent/issue-* ]] || fail "Automated validation requires an agent/issue-* head branch."
          [ -n "$EXPECTED_AGENT_AUTHOR" ] || fail "AGENT_AUTOMATION_APP_BOT_LOGIN is not configured."
          [ "$author" = "$EXPECTED_AGENT_AUTHOR" ] || fail "Automated validation requires $EXPECTED_AGENT_AUTHOR as the pull request author."
          [ "$current_sha" = "$HEAD_SHA" ] || fail "Refusing stale validation dispatch: pull request head is $current_sha, expected $HEAD_SHA."

          changed_files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')"
          if grep -Eq '^\.github/workflows/' <<<"$changed_files"; then
            fail "Pull requests that change .github/workflows/** require manual validation and review."
          fi

          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label agent-review

          gh workflow run validate.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f pr_number="$PR_NUMBER" \
            -f head_sha="$HEAD_SHA" \
            -f dispatch_review=true

\t'*}" = "$EXPECTED_HEAD" ] || fail "Existing persistence branch differs; refusing overwrite"
          else
            # Unique run/attempt namespace; ordinary push cannot replace unrelated history.
            push_with_app_retry "$publish_remote" "$EXPECTED_HEAD:refs/heads/$saved_branch"
          fi
          remote_head="$(git -c credential.helper= -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote "$publish_remote" "refs/heads/$saved_branch")"
          [ "${remote_head%%$'\t'*}" = "$EXPECTED_HEAD" ] || fail "Remote persistence verification failed"
          echo "saved_branch=$saved_branch" >> "$GITHUB_OUTPUT"
          echo "saved_sha=$EXPECTED_HEAD" >> "$GITHUB_OUTPUT"
          echo "Work preserved at $saved_branch ($EXPECTED_HEAD). Storage only; validation, architecture and human approval remain required." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify implementation result
        id: implementation_result
        if: success() && steps.claude.outcome == 'success'
        run: |
          set -euo pipefail
          {
            echo "ready=false"
            echo "blocked=false"
            echo "branch="
            echo "head_sha="
          } >> "$GITHUB_OUTPUT"

          branch="$(git branch --show-current)"
          if [ "$branch" = "develop" ] &&
             [ -f .agent-run-status ] &&
             [ -z "$(git ls-files -- .agent-run-status)" ] &&
             [ "$(cat .agent-run-status)" = "blocked" ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "Implementation agent intentionally stopped for a human decision."
            exit 0
          fi

          [[ "$branch" == agent/issue-"$ISSUE_NUMBER"-* ]] || { echo "::error::Unexpected feature branch: $branch"; exit 1; }
          git diff --quiet || { echo "::error::Tracked working-tree changes remain after implementation"; exit 1; }
          git diff --cached --quiet || { echo "::error::Staged changes remain after implementation"; exit 1; }
          [ -f .agent-pr-title ] || { echo "::error::Missing .agent-pr-title"; exit 1; }
          [ -f .agent-pr-body.md ] || { echo "::error::Missing .agent-pr-body.md"; exit 1; }
          [ -z "$(git ls-files -- .agent-pr-title .agent-pr-body.md)" ] || { echo "::error::PR metadata scratch files must remain untracked"; exit 1; }

          title="$(cat .agent-pr-title)"
          [ -n "$title" ] || { echo "::error::PR title is empty"; exit 1; }
          [[ "$title" != *$'\n'* ]] || { echo "::error::PR title must be a single line"; exit 1; }
          [ "${#title}" -le 256 ] || { echo "::error::PR title is too long"; exit 1; }
          node scripts/validate-documentation-impact.mjs --pr-body .agent-pr-body.md

          head_sha="$(git rev-parse HEAD)"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Could not resolve implementation HEAD"; exit 1; }

          {
            echo "ready=true"
            echo "branch=$branch"
            echo "head_sha=$head_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token for implementation publish
        id: implementation_app_token
        if: steps.implementation_result.outputs.ready == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AGENT_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Diagnose GitHub App publish permissions
        if: steps.implementation_result.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.implementation_app_token.outputs.token }}
        run: |
          set -euo pipefail
          permissions="$(gh api "repos/$GITHUB_REPOSITORY" --include 2>&1 >/dev/null \
            | tr -d '\r' \
            | grep -i '^x-accepted-github-permissions:' \
            | sed 's/^[^:]*:[[:space:]]*//' || true)"
          if [ -n "$permissions" ]; then
            echo "GitHub App token accepted repository permissions: $permissions"
          else
            echo "::warning::GitHub did not return an X-Accepted-GitHub-Permissions header for the repository metadata request."
          fi

          can_write="$(gh api "repos/$GITHUB_REPOSITORY/installation" --silent >/dev/null 2>&1 && echo yes || echo no)"
          echo "GitHub App installation endpoint accessible: $can_write"
          echo "Publish requires effective contents=write; pull_requests=write; workflows=write."

      - name: Push implementation and create pull request
        id: publish_implementation
        if: steps.implementation_result.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.implementation_app_token.outputs.token }}
          BRANCH: ${{ steps.implementation_result.outputs.branch }}
          HEAD_SHA: ${{ steps.implementation_result.outputs.head_sha }}
          EXPECTED_AGENT_AUTHOR: ${{ vars.AGENT_AUTOMATION_APP_BOT_LOGIN }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          [ "$HEAD_SHA" = "${{ steps.persist_implementation.outputs.saved_sha }}" ] || fail "Implementation was not durably persisted."
          [ -n "$EXPECTED_AGENT_AUTHOR" ] || fail "AGENT_AUTOMATION_APP_BOT_LOGIN is not configured."
          [ "$(git branch --show-current)" = "$BRANCH" ] || fail "Local branch changed before publish."
          [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ] || fail "Local HEAD changed before publish."

          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"

          title="$(cat .agent-pr-title)"
          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base develop --head "$BRANCH" --title "$title" --body-file .agent-pr-body.md)"
          pr_number="$(gh pr view "$pr_url" --repo "$GITHUB_REPOSITORY" --json number --jq '.number')"
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]] || fail "Could not determine created pull request number."

          pr_meta="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg author "$EXPECTED_AGENT_AUTHOR" --arg branch "$BRANCH" --arg sha "$HEAD_SHA"             '.state == "open" and .draft == false and .base.ref == "develop" and .head.repo.full_name == $repo and .head.ref == $branch and .head.sha == $sha and .user.login == $author'             <<<"$pr_meta" >/dev/null || fail "Created pull request failed the agent PR identity/head checks."

          {
            echo "pr_number=$pr_number"
            echo "pr_url=$pr_url"
            echo "branch=$BRANCH"
            echo "head_sha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Comment with opened pull request
        if: steps.publish_implementation.outcome == 'success'
        env:
          PR_URL: ${{ steps.publish_implementation.outputs.pr_url }}
          HEAD_SHA: ${{ steps.publish_implementation.outputs.head_sha }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"             --body "Implementation was validated and published as $PR_URL at head $HEAD_SHA. The independent architecture pass runs next. Run: $RUN_URL"

      - name: Verify the architecture pass target
        id: architecture_target
        if: steps.publish_implementation.outcome == 'success'
        env:
          EXPECTED_AGENT_AUTHOR: ${{ vars.AGENT_AUTOMATION_APP_BOT_LOGIN }}
        run: |
          set -euo pipefail
          branch="${{ steps.publish_implementation.outputs.branch }}"
          expected_pr="${{ steps.publish_implementation.outputs.pr_number }}"
          expected_sha="${{ steps.publish_implementation.outputs.head_sha }}"

          [ "$(git branch --show-current)" = "$branch" ] || { echo "::error::Unexpected local branch before architecture pass"; exit 1; }
          pr_json="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base develop --head "$branch"             --json number,headRefOid --jq 'if length == 1 then .[0] else {} end')"
          pr_number="$(jq -r '.number // empty' <<<"$pr_json")"
          head_sha="$(jq -r '.headRefOid // empty' <<<"$pr_json")"
          [ "$pr_number" = "$expected_pr" ] || { echo "::error::No unique expected open PR for $branch"; exit 1; }
          [ "$head_sha" = "$expected_sha" ] || { echo "::error::Published PR head changed before architecture pass"; exit 1; }
          [ -n "$EXPECTED_AGENT_AUTHOR" ] || { echo "::error::AGENT_AUTOMATION_APP_BOT_LOGIN is not configured"; exit 1; }

          pr_meta="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg author "$EXPECTED_AGENT_AUTHOR"             '.state == "open" and .draft == false and .base.ref == "develop" and .head.repo.full_name == $repo and .user.login == $author'             <<<"$pr_meta" >/dev/null || { echo "::error::PR is not a same-repository agent PR authored by $EXPECTED_AGENT_AUTHOR"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$head_sha" ] || { echo "::error::Local HEAD does not match the open PR"; exit 1; }

          {
            echo "pr_number=$pr_number"
            echo "branch=$branch"
            echo "head_sha=$head_sha"
            echo "pr_ready=true"
          } >> "$GITHUB_OUTPUT"

      # A fresh Claude invocation reviews the coder's PR and may make narrowly scoped,
      # behavior-preserving structural fixes on the same feature branch before validation.
      - name: Run Claude Code architecture agent
        id: architect
        if: steps.architecture_target.outputs.pr_ready == 'true'
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          base_branch: develop
          show_full_output: true
          branch_prefix: agent/
          prompt: |
            You are a new, separate InventoryApp architecture agent invocation. The coder has opened pull request #${{ steps.architecture_target.outputs.pr_number }}. Work only on its existing agent/issue-${{ github.event.issue.number }}-* feature branch; do not create another branch or pull request.

            Follow CLAUDE.md, AGENTS.md, docs/architecture.md and docs/automation.md. Complete all work yourself in this single foreground invocation. Do not delegate, spawn, or use Claude sub-agents, and do not invoke the `Agent` tool. Read the issue's acceptance criteria and exclusions, the open PR and its full diff, and the existing tests before proposing edits. Verify the current branch is the PR's head branch and that its base is develop. If there is no single matching open PR, stop without editing.

            Review only touched code and its directly affected boundaries: controllers versus use cases, domain rules versus adapters, dependency direction, framework or persistence leakage, duplicated calculations, information hiding, and testability. Make a small structural correction only when the current implementation violates an established rule or obscures the approved behavior. Preserve all observable behavior, API contracts, data semantics, and acceptance criteria. Do not perform broad Clean Architecture migrations, add frameworks, or touch unrelated files. A clean result with no edits is valid.

            Before editing, check whether your proposed change would require a migration, change documented architecture or the PR's Documentation impact declaration, expand the approved scope, alter a test expectation, or require a human decision. If so, make no change; comment on the PR with the exact finding for human review. Do not edit the issue or PR body. Never weaken, skip, or delete tests. Do not change workflows, secrets, configuration, or deployment.

            If you edit: run `bash scripts/validate.sh`; if validation fails, fix only your structural change and rerun it. Check the final diff against the issue and PR body and commit a focused architecture change locally. Do not push; a deterministic workflow step will mint a fresh GitHub App token and push the verified local head after your invocation. Comment on the PR with the structural changes and exact validation result. If you make no edits, comment briefly that no in-scope architectural corrections were needed. Never claim a command passed unless it ran successfully.

            Never merge, approve, deploy, edit labels, open another PR, change the PR description, or modify production data. Independent exact-SHA validation and review still follow this stage.
          claude_args: |
            --max-turns 100
            --allowedTools "Read,Glob,Grep,Edit,MultiEdit,Write"
            "Bash(gh issue view *),Bash(gh pr view *),Bash(gh pr diff *),Bash(gh pr list *),Bash(gh pr comment *)"
            "Bash(git status *),Bash(git diff *),Bash(git log *),Bash(git show *),Bash(git branch --show-current),Bash(git rev-parse *)"
            "Bash(git rm -- backend/*),Bash(git rm -- frontend/*),Bash(git rm -- docs/*),Bash(git rm -- scripts/*)"
            "Bash(git restore --staged -- backend/*),Bash(git restore --staged -- frontend/*),Bash(git restore --staged -- docs/*),Bash(git restore --staged -- scripts/*)"
            "Bash(git add *),Bash(git commit *)"
            "Bash(bash scripts/validate.sh),Bash(dotnet *),Bash(npm --prefix frontend/inventory-app *)"
            --disallowedTools "Agent,WebFetch,WebSearch"
            "Bash(git push *),Bash(git push * --force *),Bash(git push * -f *),Bash(git push * --force-with-lease *),Bash(git reset --hard *),Bash(git rebase *)"
            "Bash(git checkout *),Bash(git switch *),Bash(gh pr merge *),Bash(gh pr review *),Bash(gh pr edit *),Bash(gh pr create *),Bash(gh issue edit *),Bash(gh api *),Bash(gh workflow *),Bash(gh run *)"

      - name: Verify architecture result
        id: architecture_result
        if: steps.architect.outcome == 'success'
        env:
          START_SHA: ${{ steps.architecture_target.outputs.head_sha }}
          BRANCH: ${{ steps.architecture_target.outputs.branch }}
        run: |
          set -euo pipefail
          [ "$(git branch --show-current)" = "$BRANCH" ] || { echo "::error::Architecture pass changed branch"; exit 1; }
          git diff --quiet || { echo "::error::Tracked working-tree changes remain after architecture pass"; exit 1; }
          git diff --cached --quiet || { echo "::error::Staged changes remain after architecture pass"; exit 1; }
          head_sha="$(git rev-parse HEAD)"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Could not resolve architecture HEAD"; exit 1; }
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          if [ "$head_sha" = "$START_SHA" ]; then
            echo "push_required=false" >> "$GITHUB_OUTPUT"
          else
            echo "push_required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub App token for architecture publish
        id: architecture_app_token
        if: steps.architecture_result.outputs.push_required == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AGENT_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Push architecture head
        id: publish_architecture
        if: steps.architecture_result.outputs.push_required == 'true'
        env:
          GH_TOKEN: ${{ steps.architecture_app_token.outputs.token }}
          BRANCH: ${{ steps.architecture_target.outputs.branch }}
          HEAD_SHA: ${{ steps.architecture_result.outputs.head_sha }}
        run: |
          set -euo pipefail
          [ "$(git branch --show-current)" = "$BRANCH" ] || { echo "::error::Local branch changed before architecture publish"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ] || { echo "::error::Local HEAD changed before architecture publish"; exit 1; }
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"

      - name: Record outcome on the issue
        id: outcome
        if: always()
        env:
          PERSIST_OUTCOME: ${{ steps.persist_implementation.outcome }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          ARCHITECT_OUTCOME: ${{ steps.architect.outcome }}
          TARGET_OUTCOME: ${{ steps.architecture_target.outcome }}
          ARCHITECTURE_RESULT_OUTCOME: ${{ steps.architecture_result.outcome }}
          AGENT_BLOCKED: ${{ steps.implementation_result.outputs.blocked }}
          SAVED_BRANCH: ${{ steps.persist_implementation.outputs.saved_branch }}
          SAVED_SHA: ${{ steps.persist_implementation.outputs.saved_sha }}
        run: |
          set -euo pipefail
          {
            echo "dispatch_validation=false"
            echo "pr_number="
            echo "head_sha="
          } >> "$GITHUB_OUTPUT"

          if [ -n "$SAVED_BRANCH" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Committed work preserved on $SAVED_BRANCH at $SAVED_SHA. This is storage only, not evidence of validation or approval. Run: $RUN_URL"
          fi
          prefix="agent/issue-$ISSUE_NUMBER-"
          pr_json="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base develop \
            --json number,url,headRefName,headRefOid \
            | jq -c --arg p "$prefix" '[.[] | select(.headRefName | startswith($p))][0] // {}')"
          pr_url="$(jq -r '.url // empty' <<<"$pr_json")"
          pr_number="$(jq -r '.number // empty' <<<"$pr_json")"
          head_sha="$(jq -r '.headRefOid // empty' <<<"$pr_json")"

          # Only tracked changes can alter the proposed PR commit. Agent scratch files are
          # untracked and disappear with this runner; they must not block validation.
          if [ "$AGENT_BLOCKED" = "true" ]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --remove-label agent-working --add-label agent-blocked
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$(cat <<EOF
          The implementation agent intentionally stopped before creating a pull request because a human decision is required. This is an expected blocked-task outcome, not an implementation workflow failure. Read the preceding agent comment for the exact decision or permission needed.

          Run: $RUN_URL
          EOF
          )"
          elif [ "$PERSIST_OUTCOME" = "success" ] &&
             [ "$CLAUDE_OUTCOME" = "success" ] &&
             [ "$TARGET_OUTCOME" = "success" ] &&
             [ "$ARCHITECT_OUTCOME" = "success" ] &&
             [ "$ARCHITECTURE_RESULT_OUTCOME" = "success" ] &&
             [ "$(git branch --show-current)" = "$(jq -r '.headRefName // empty' <<<"$pr_json")" ] &&
             [ "$(git rev-parse HEAD)" = "$head_sha" ] &&
             git diff --quiet &&
             git diff --cached --quiet &&
             [ -n "$pr_url" ] &&
             [[ "$pr_number" =~ ^[1-9][0-9]*$ ]] &&
             [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            {
              echo "dispatch_validation=true"
              echo "pr_number=$pr_number"
              echo "head_sha=$head_sha"
            } >> "$GITHUB_OUTPUT"

            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --remove-label agent-working --add-label agent-review
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$(cat <<EOF
          Implementation and architecture runs finished for $pr_url at head $head_sha.

          A separate follow-up job will apply the \`agent-review\` label and dispatch trusted validation for that exact SHA. Once the \`agent-validation\` status passes, the initial independent review starts automatically; no further action is needed to request it. Human approval and merge remain required.

          Run: $RUN_URL
          EOF
          )"
          elif [ "$CLAUDE_OUTCOME" = "cancelled" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body "Implementation run was cancelled (superseded by a newer run for this issue). Run: $RUN_URL"
          else
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --remove-label agent-working --add-label agent-blocked
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$(cat <<EOF
          Implementation or architecture stage ended without a verified completed pull request targeting develop from a \`$prefix*\` branch (coder: $CLAUDE_OUTCOME; target check: $TARGET_OUTCOME; architect: $ARCHITECT_OUTCOME). The task is now \`agent-blocked\` and needs a human decision. Read the run log and any comment the agent left above, resolve the blocker, then remove \`agent-blocked\` and re-apply \`agent-ready\` to start again.

          Run: $RUN_URL
          EOF
          )"
          fi

  dispatch-validation:
    name: Dispatch exact-SHA validation
    needs: implement
    if: always() && needs.implement.outputs.dispatch_validation == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: write

    steps:
      - name: Verify pull request and dispatch trusted validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.implement.outputs.pr_number }}
          HEAD_SHA: ${{ needs.implement.outputs.head_sha }}
          EXPECTED_AGENT_AUTHOR: ${{ vars.AGENT_AUTOMATION_APP_BOT_LOGIN }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          pr_json="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json state,isDraft,baseRefName,headRefName,headRefOid,headRepository,headRepositoryOwner)"
          state="$(jq -r '.state' <<<"$pr_json")"
          is_draft="$(jq -r '.isDraft' <<<"$pr_json")"
          base_ref="$(jq -r '.baseRefName' <<<"$pr_json")"
          head_ref="$(jq -r '.headRefName' <<<"$pr_json")"
          current_sha="$(jq -r '.headRefOid // empty' <<<"$pr_json")"
          head_repo="$(jq -r '"\(.headRepositoryOwner.login)/\(.headRepository.name)"' <<<"$pr_json")"
          author="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq '.user.login // empty')"

          [ "$state" = "OPEN" ] || fail "Pull request #$PR_NUMBER is not open."
          [ "$is_draft" = "false" ] || fail "Pull request #$PR_NUMBER is a draft."
          [ "$base_ref" = "develop" ] || fail "Automated validation is limited to pull requests targeting develop."
          [ "$head_repo" = "$GITHUB_REPOSITORY" ] || fail "Automated validation is limited to same-repository branches."
          [[ "$head_ref" == agent/issue-* ]] || fail "Automated validation requires an agent/issue-* head branch."
          [ -n "$EXPECTED_AGENT_AUTHOR" ] || fail "AGENT_AUTOMATION_APP_BOT_LOGIN is not configured."
          [ "$author" = "$EXPECTED_AGENT_AUTHOR" ] || fail "Automated validation requires $EXPECTED_AGENT_AUTHOR as the pull request author."
          [ "$current_sha" = "$HEAD_SHA" ] || fail "Refusing stale validation dispatch: pull request head is $current_sha, expected $HEAD_SHA."

          changed_files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')"
          if grep -Eq '^\.github/workflows/' <<<"$changed_files"; then
            fail "Pull requests that change .github/workflows/** require manual validation and review."
          fi

          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label agent-review

          gh workflow run validate.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f pr_number="$PR_NUMBER" \
            -f head_sha="$HEAD_SHA" \
            -f dispatch_review=true

