name: Agent Copilot handoff

# Hands a Copilot-implemented pull request (agent-ready-copilot) to Claude's read-only architecture
# check. A successful current-head PR validation can automatically move Copilot's draft to Ready
# for review; a manual Ready for review transition remains a fallback.
#
# Authority and lifecycle: AGENTS.md ("Automated task contract") and docs/automation.md
# (Cross-review: Claude and Copilot).
# - Trusted source: pull_request_target and workflow_run both execute this definition from main.
#   This workflow never checks out or executes pull request code. It uses GITHUB_TOKEN for all
#   verification and dispatch calls, and the owner's COPILOT_AGENT_TOKEN only for Draft -> Ready
#   because GitHub does not permit GITHUB_TOKEN to perform markPullRequestReadyForReview. That
#   transition emits ready_for_review, so the pull_request_target path then dispatches the
#   architecture check; the workflow_run path dispatches only for a PR that is already Ready.
# - Automatic handoff accepts only a successful pull_request run of Validate pull request for the
#   exact current head, after the latest Copilot session on the PR's branch (initial run or
#   @copilot follow-up) has completed successfully.
# - Both paths accept only an open, same-repository copilot/* PR into develop, authored by the
#   Copilot bot, closing exactly one issue still in agent-working, with no .github/workflows/**
#   changes.
# - It may mark an eligible Copilot draft Ready for review and dispatch
#   agent-copilot-architecture.yml. It does not approve, merge, label, push, review, or deploy.

on:
  pull_request_target:
    types: [ready_for_review]
    branches:
      - develop
  workflow_run:
    workflows: ["Validate pull request"]
    types: [completed]

permissions: {}

concurrency:
  group: agent-copilot-handoff-pr-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  handoff:
    name: Hand Copilot pull request to Claude architecture check
    if: |
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.base.ref == 'develop' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'copilot/')) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'copilot/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      pull-requests: write
      issues: read
      contents: read

    steps:
      - name: Verify Copilot pull request and dispatch architecture check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_PATH: ${{ github.event.workflow_run.path }}
          EXPECTED_COPILOT_AUTHOR: ${{ vars.COPILOT_AGENT_BOT_LOGIN || 'Copilot' }}
          COPILOT_RUN_POLL_ATTEMPTS: "20"
          COPILOT_RUN_POLL_SECONDS: "15"
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          skip() { echo "::notice::No architecture check scheduled: $1"; exit 0; }

          auto_ready=false
          if [ "${GITHUB_EVENT_NAME:-}" = "workflow_run" ]; then
            [ "$RUN_EVENT" = "pull_request" ] || skip "validation run was not triggered by a pull request."
            [ "$RUN_CONCLUSION" = "success" ] || skip "validation run did not succeed."
            [ "$RUN_PATH" = ".github/workflows/validate.yml" ] || skip "completed run was not validate.yml."
            PR_NUMBER="$RUN_PR_NUMBER"
            HEAD_SHA="$RUN_HEAD_SHA"
            auto_ready=true
          else
            PR_NUMBER="$EVENT_PR_NUMBER"
            HEAD_SHA="$EVENT_HEAD_SHA"
          fi

          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || fail "The event did not contain a valid pull request number."
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "The event did not contain a full head SHA."

          pr_json="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"             --json state,isDraft,baseRefName,headRefName,headRefOid,headRepository,headRepositoryOwner,closingIssuesReferences)"
          state="$(jq -r '.state' <<<"$pr_json")"
          is_draft="$(jq -r '.isDraft' <<<"$pr_json")"
          base_ref="$(jq -r '.baseRefName' <<<"$pr_json")"
          head_ref="$(jq -r '.headRefName' <<<"$pr_json")"
          current_sha="$(jq -r '.headRefOid // empty' <<<"$pr_json")"
          head_repo="$(jq -r '"\(.headRepositoryOwner.login)/\(.headRepository.name)"' <<<"$pr_json")"
          author="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.user.login // empty')"

          [ "$state" = "OPEN" ] || skip "pull request #$PR_NUMBER is not open."
          [ "$base_ref" = "develop" ] || skip "pull request #$PR_NUMBER does not target develop."
          [ "$head_repo" = "$GITHUB_REPOSITORY" ] || skip "pull request #$PR_NUMBER does not use a same-repository branch."
          [[ "$head_ref" == copilot/* ]] || skip "pull request #$PR_NUMBER does not use a copilot/* branch."
          [ "$author" = "$EXPECTED_COPILOT_AUTHOR" ] || skip "pull request #$PR_NUMBER is not authored by $EXPECTED_COPILOT_AUTHOR."
          [ "$current_sha" = "$HEAD_SHA" ] || skip "Refusing stale handoff: head is now $current_sha."

          if [ "$auto_ready" != "true" ]; then
            [ "$is_draft" = "false" ] || skip "pull request #$PR_NUMBER is a draft."
          fi

          changed_files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')"
          if grep -Eq '^\.github/workflows/' <<<"$changed_files"; then
            fail "Pull requests that change .github/workflows/** require manual validation and review."
          fi

          issue_count="$(jq '[.closingIssuesReferences[]?] | length' <<<"$pr_json")"
          [ "$issue_count" = "1" ] || fail "Copilot pull request #$PR_NUMBER must close exactly one agent-ready-copilot issue (found $issue_count)."
          issue_number="$(jq -r '.closingIssuesReferences[0].number' <<<"$pr_json")"
          issue_json="$(gh issue view "$issue_number" --repo "$GITHUB_REPOSITORY" --json state,labels)"
          [ "$(jq -r '.state' <<<"$issue_json")" = "OPEN" ] || fail "Issue #$issue_number is not open."
          jq -e 'any(.labels[]?; .name == "agent-working")' <<<"$issue_json" >/dev/null             || skip "issue #$issue_number is not agent-working (the architecture check already ran or the task was not started with agent-ready-copilot)."
          # Provider mode (#339): verify the route claimed in the issue's label history against this pull request, using the
          # resolver from this workflow's own commit. A conflicting, malformed or disabled mode fails closed.
          gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/scripts/agent-mode.mjs?ref=$GITHUB_WORKFLOW_SHA" > "$RUNNER_TEMP/agent-mode.mjs"
          agent_mode="$(node "$RUNNER_TEMP/agent-mode.mjs" verify-pr "$PR_NUMBER" "copilot")" || fail "the provider mode of pull request #$PR_NUMBER could not be verified."

          if [ "$auto_ready" = "true" ]; then
            validation_state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/status"               --jq '.statuses | map(select(.context == "merge-validation")) | .[0].state // empty')"
            [ "$validation_state" = "success" ] || skip "current head does not have a successful merge-validation status."

            encoded_head="$(jq -rn --arg value "$head_ref" '$value | @uri')"
            copilot_state=""
            for attempt in $(seq 1 "$COPILOT_RUN_POLL_ATTEMPTS"); do
              # Every Copilot session on the branch (the initial "Running Copilot cloud agent" run and any
              # "Addressing comment on PR #N" run) is a dynamic run of this path. The copilot/* branch
              # identifies the PR; the runs' pull_requests list is not relied on.
              runs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$encoded_head&event=dynamic&per_page=100")"
              copilot_state="$(jq -r --arg branch "$head_ref" '
                (.workflow_runs | map(select(
                  .event == "dynamic" and
                  .path == "dynamic/copilot-swe-agent/copilot" and
                  .head_branch == $branch
                )) | sort_by(.created_at) | reverse | .[0] // {}) |
                "\(.status // ""):\(.conclusion // "")"
              ' <<<"$runs_json")"

              case "$copilot_state" in
                completed:success) break ;;
                completed:*) skip "latest Copilot session did not succeed ($copilot_state)." ;;
              esac

              if [ "$attempt" -lt "$COPILOT_RUN_POLL_ATTEMPTS" ]; then
                sleep "$COPILOT_RUN_POLL_SECONDS"
              fi
            done
            [ "$copilot_state" = "completed:success" ] || skip "latest Copilot session has not completed successfully."

            latest_pr_json="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,isDraft,headRefOid)"
            [ "$(jq -r '.state' <<<"$latest_pr_json")" = "OPEN" ] || skip "pull request #$PR_NUMBER is no longer open."
            latest_sha="$(jq -r '.headRefOid // empty' <<<"$latest_pr_json")"
            [ "$latest_sha" = "$HEAD_SHA" ] || skip "Refusing stale handoff: head is now $latest_sha."
            latest_draft="$(jq -r '.isDraft' <<<"$latest_pr_json")"
            if [ "$latest_draft" = "true" ]; then
              [ -n "$COPILOT_AGENT_TOKEN" ] || fail "COPILOT_AGENT_TOKEN is not configured, so the trusted handoff cannot mark the Copilot pull request Ready for review."
              GH_TOKEN="$COPILOT_AGENT_TOKEN" gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
              echo "::notice::Marked Copilot pull request #$PR_NUMBER ready for review after successful current-head validation."
              # A transition made with the owner token emits ready_for_review, which starts this workflow's
              # pull_request_target path with the same guards; that run dispatches the architecture check, so
              # dispatching here as well would run it twice.
              skip "the ready_for_review event from this transition dispatches the architecture check."
            fi
          fi

          gh workflow run agent-copilot-architecture.yml             --repo "$GITHUB_REPOSITORY"             --ref main             -f issue_number="$issue_number"             -f pr_number="$PR_NUMBER"             -f head_sha="$HEAD_SHA"
          echo "::notice::Dispatched Claude's read-only architecture check for $HEAD_SHA."
