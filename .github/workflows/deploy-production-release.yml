name: Deploy Production release

# The one implementation of a production release (issues #343 and #491). It is never started on its
# own: it runs only when one of the two human-started entry points calls it.
#
# - deploy-production.yml ("Deploy Production") is the normal release. It has no inputs and deploys
#   the main commit the run was dispatched from (github.sha, captured when the run starts, so later
#   pushes to main cannot change it), with the baseline read from the release records.
# - deploy-production-recovery.yml ("Deploy Production (advanced recovery)") deploys an exact,
#   operator-supplied main commit, and accepts an operator baseline only when no release is recorded.
#
# Both callers share one concurrency group, so they never deploy at the same time. A push or merge to
# main deploys nothing. The run validates the release commit, reports the EF Core migrations
# production startup is expected to apply, deploys the API, verifies its health, and only then
# deploys the frontend built from the same commit. A failure stops the run; it never reverts,
# merges, relabels or starts an agent repair. Recovery is a human decision.
on:
  workflow_call:
    inputs:
      entry_point:
        description: Which human-started entry point called this release, normal or recovery.
        required: true
        type: string
      sha:
        description: Recovery only. The full 40-character main commit SHA to deploy.
        required: false
        default: ''
        type: string
      baseline_sha:
        description: Recovery only. The full SHA of the backend production runs now, accepted only when no release is recorded.
        required: false
        default: ''
        type: string

permissions: {}

env:
  AZURE_WEBAPP_NAME: vm-manager
  PRODUCTION_ENVIRONMENT: VmInventoryApi_Env
  # GitHub deployment records written by this workflow after each backend deployment; the newest
  # one is the baseline for the next run's migration preflight.
  RELEASE_RECORD_TASK: deploy:production-backend
  API_PROJECT: ./backend/InventoryApi/InventoryApi.csproj
  FRONTEND_DIR: frontend/inventory-app
  FRONTEND_OUTPUT: frontend/inventory-app/dist/inventory-app/browser

jobs:
  resolve:
    name: Resolve release commit
    runs-on: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL == 'true' && fromJSON('["self-hosted","linux","x64","inventory-agent"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      baseline_sha: ${{ steps.baseline.outputs.baseline_sha }}
      baseline_source: ${{ steps.baseline.outputs.baseline_source }}

    steps:
      - name: Report and validate runner mode
        env:
          RUNNER_MODE: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL }}
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          case "$RUNNER_MODE" in
            true) selected=self-hosted ;;
            ''|false) selected=github-hosted ;;
            *) echo "::error::The repository variable INVENTORY_AGENT_SELF_HOSTED_ALL must be exactly true, false or unset. See docs/automation.md § Runner placement."; exit 1 ;;
          esac
          echo "Runner mode: INVENTORY_AGENT_SELF_HOSTED_ALL=${RUNNER_MODE:-<unset>} selects $selected runners."
          echo "This job runs on $RUNNER_NAME ($RUNNER_KIND)."
          if [ "$RUNNER_KIND" != "$selected" ]; then
            echo "::error::This job runs on a $RUNNER_KIND runner, but INVENTORY_AGENT_SELF_HOSTED_ALL now selects $selected runners; the variable changed after the job was queued. Re-run the job. See docs/automation.md § Runner placement."
            exit 1
          fi

      - name: Refuse runs not started from main
        if: github.ref != 'refs/heads/main'
        env:
          RUN_REF: ${{ github.ref }}
        run: |
          echo "::error::Deploy Production must be started from main; this run was started from $RUN_REF."
          exit 1

      - name: Require verified runner isolation for credentialed jobs
        # Issue #645 review: jobs that receive a long-lived secret, an App key or Azure OIDC are skipped
        # in self-hosted mode until a human confirms those runners are reset or ephemeral per job. This step makes
        # that refusal a visible failure instead of a silent skip.
        env:
          RUNNER_MODE: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL }}
          RUNNER_ISOLATION_VERIFIED: ${{ vars.INVENTORY_RUNNER_ISOLATION_VERIFIED }}
        run: |
          if [ "$RUNNER_MODE" = "true" ] && [ "$RUNNER_ISOLATION_VERIFIED" != "true" ]; then
            echo "::error::Credentialed jobs are disabled in self-hosted mode (INVENTORY_AGENT_SELF_HOSTED_ALL is true) until a human sets the repository variable INVENTORY_RUNNER_ISOLATION_VERIFIED to true after provisioning reset or ephemeral self-hosted runners. See docs/automation.md § Runner placement."
            exit 1
          fi

      - name: Require a verified tool baseline on every runner
        # Any runner in the pool can take any deploy job, so the host that later uploads the
        # frontend is unknown when the API is deployed. A check on that host would come after the
        # API had already changed. In self-hosted mode deploy-api and deploy-frontend therefore run
        # only once a human has run the runner diagnostic on every runner in the pool and recorded
        # the result. In GitHub-hosted mode (issue #807) every job gets a fresh runner from the same
        # published ubuntu-latest image, so this job checks the deploy jobs' tools on its own runner
        # before anything changes, and each deploy job checks them again before using a credential.
        env:
          RUNNER_MODE: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL }}
          RUNNER_BASELINE_VERIFIED: ${{ vars.INVENTORY_RUNNER_BASELINE_VERIFIED }}
        run: |
          if [ "$RUNNER_MODE" = "true" ] && [ "$RUNNER_BASELINE_VERIFIED" != "true" ]; then
            echo "::error::Deployment is disabled in self-hosted mode (INVENTORY_AGENT_SELF_HOSTED_ALL is true) until a human runs the Inventory agent runner diagnostic on every self-hosted runner and sets the repository variable INVENTORY_RUNNER_BASELINE_VERIFIED to true. See docs/automation.md § Runner placement."
            exit 1
          fi
          if [ "$RUNNER_MODE" != "true" ]; then
            missing=0
            for tool in az jq curl docker; do
              if ! command -v "$tool" >/dev/null 2>&1; then echo "::error::$tool is not installed on GitHub-hosted runner $RUNNER_NAME."; missing=1; fi
            done
            if [ ! -x /usr/bin/gh ]; then echo "::error::/usr/bin/gh is not installed on GitHub-hosted runner $RUNNER_NAME."; missing=1; fi
            docker info >/dev/null 2>&1 || { echo "::error::The Docker daemon is not reachable on GitHub-hosted runner $RUNNER_NAME."; missing=1; }
            [ "$missing" -eq 0 ] || exit 1
            echo "GitHub-hosted mode: runner $RUNNER_NAME has the deploy jobs' tools. INVENTORY_RUNNER_BASELINE_VERIFIED describes the self-hosted VM and is not required."
          fi

      - name: Check out main history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and verify the release SHA
        id: release
        env:
          ENTRY_POINT: ${{ inputs.entry_point }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_BASELINE: ${{ inputs.baseline_sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          # The normal release takes no inputs: it deploys the commit the run was dispatched from,
          # captured as github.sha when the run started, never a main HEAD read later.
          case "$ENTRY_POINT" in
            normal)
              [ -z "$INPUT_SHA" ] && [ -z "$INPUT_BASELINE" ] \
                || fail "The normal Deploy Production release takes no sha or baseline_sha. Use Deploy Production (advanced recovery) to deploy an exact commit or bootstrap a baseline."
              sha="$GITHUB_SHA"
              ;;
            recovery)
              [ -n "$INPUT_SHA" ] || fail "Deploy Production (advanced recovery) requires sha, the full 40-character main commit to deploy."
              sha="$INPUT_SHA"
              ;;
            *) fail "Unknown entry point '$ENTRY_POINT'; only Deploy Production and Deploy Production (advanced recovery) may call this release." ;;
          esac

          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || fail "The release SHA must be a full 40-character lowercase commit SHA."
          git cat-file -e "${sha}^{commit}" 2>/dev/null || fail "Commit $sha does not exist in this repository."
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main \
            || fail "Commit $sha is not contained in main. Only main commits are deployed to production."

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Entry point: $ENTRY_POINT"
          echo "Release SHA: $sha"

      # The baseline is the backend production is known to run healthily: the newest release this
      # workflow recorded. It is never guessed and never replaced by the release SHA. An operator
      # baseline is accepted only by the recovery entry point and only when no release is recorded.
      - name: Resolve the production baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          ENTRY_POINT: ${{ inputs.entry_point }}
          INPUT_BASELINE: ${{ inputs.baseline_sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          recorded="$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=$PRODUCTION_ENVIRONMENT&task=$RELEASE_RECORD_TASK&per_page=1" \
            --jq '.[0].sha // empty')" \
            || fail "Could not read the recorded production releases (GitHub deployments on $PRODUCTION_ENVIRONMENT, task $RELEASE_RECORD_TASK). Nothing was deployed. Re-run this workflow once the GitHub API is reachable; do not supply a baseline instead."

          if [ -n "$recorded" ]; then
            if ! [[ "$recorded" =~ ^[0-9a-f]{40}$ ]] \
              || ! git cat-file -e "${recorded}^{commit}" 2>/dev/null \
              || ! git merge-base --is-ancestor "$recorded" refs/remotes/origin/main; then
              fail "The newest recorded production release '$recorded' is not a main commit, so it cannot be the baseline. Nothing was deployed. A human must confirm which commit production runs, mark that deployment record inactive (or delete it) in GitHub, and then bootstrap the baseline with Deploy Production (advanced recovery). See docs/automation.md § Deploy Production."
            fi
            if [ -n "$INPUT_BASELINE" ] && [ "$INPUT_BASELINE" != "$recorded" ]; then
              fail "baseline_sha $INPUT_BASELINE differs from the last recorded production release $recorded. A supplied baseline is accepted only when no release is recorded. Leave baseline_sha empty, or resolve the difference before deploying."
            fi
            baseline="$recorded"
            source="recorded"
          elif [ "$ENTRY_POINT" = "recovery" ] && [ -n "$INPUT_BASELINE" ]; then
            baseline="$INPUT_BASELINE"
            source="operator input (no release recorded)"
          elif [ "$ENTRY_POINT" = "recovery" ]; then
            fail "No production release is recorded yet. Start Deploy Production (advanced recovery) again with baseline_sha set to the main commit production runs now (the previous release's merge commit)."
          else
            fail "No production release is recorded yet, so the baseline cannot be resolved automatically. Nothing was deployed. Bootstrap the first record with Deploy Production (advanced recovery): set sha to $GITHUB_SHA and baseline_sha to the main commit production runs now. See docs/automation.md § Deploy Production."
          fi

          [[ "$baseline" =~ ^[0-9a-f]{40}$ ]] || fail "The baseline must be a full 40-character lowercase commit SHA."
          git cat-file -e "${baseline}^{commit}" 2>/dev/null || fail "Baseline $baseline does not exist in this repository."
          git merge-base --is-ancestor "$baseline" refs/remotes/origin/main \
            || fail "Baseline $baseline is not contained in main."

          echo "baseline_sha=$baseline" >> "$GITHUB_OUTPUT"
          echo "baseline_source=$source" >> "$GITHUB_OUTPUT"
          echo "Baseline SHA: $baseline ($source)"

  validate:
    name: Validate release commit
    needs: resolve
    runs-on: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL == 'true' && fromJSON('["self-hosted","linux","x64","inventory-agent"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Report and validate runner mode
        env:
          RUNNER_MODE: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL }}
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          case "$RUNNER_MODE" in
            true) selected=self-hosted ;;
            ''|false) selected=github-hosted ;;
            *) echo "::error::The repository variable INVENTORY_AGENT_SELF_HOSTED_ALL must be exactly true, false or unset. See docs/automation.md § Runner placement."; exit 1 ;;
          esac
          echo "Runner mode: INVENTORY_AGENT_SELF_HOSTED_ALL=${RUNNER_MODE:-<unset>} selects $selected runners."
          echo "This job runs on $RUNNER_NAME ($RUNNER_KIND)."
          if [ "$RUNNER_KIND" != "$selected" ]; then
            echo "::error::This job runs on a $RUNNER_KIND runner, but INVENTORY_AGENT_SELF_HOSTED_ALL now selects $selected runners; the variable changed after the job was queued. Re-run the job. See docs/automation.md § Runner placement."
            exit 1
          fi

      - name: Check out release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/inventory-app/package-lock.json

      - name: Validate repository
        run: bash scripts/validate.sh

  preflight:
    name: Migration preflight
    needs: resolve
    runs-on: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL == 'true' && fromJSON('["self-hosted","linux","x64","inventory-agent"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      pending_count: ${{ steps.preflight.outputs.pending_count }}
      pending: ${{ steps.preflight.outputs.pending }}

    steps:
      - name: Report and validate runner mode
        env:
          RUNNER_MODE: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL }}
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          case "$RUNNER_MODE" in
            true) selected=self-hosted ;;
            ''|false) selected=github-hosted ;;
            *) echo "::error::The repository variable INVENTORY_AGENT_SELF_HOSTED_ALL must be exactly true, false or unset. See docs/automation.md § Runner placement."; exit 1 ;;
          esac
          echo "Runner mode: INVENTORY_AGENT_SELF_HOSTED_ALL=${RUNNER_MODE:-<unset>} selects $selected runners."
          echo "This job runs on $RUNNER_NAME ($RUNNER_KIND)."
          if [ "$RUNNER_KIND" != "$selected" ]; then
            echo "::error::This job runs on a $RUNNER_KIND runner, but INVENTORY_AGENT_SELF_HOSTED_ALL now selects $selected runners; the variable changed after the job was queued. Re-run the job. See docs/automation.md § Runner placement."
            exit 1
          fi

      - name: Check out main history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Compare release and baseline migrations
        id: preflight
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          BASELINE_SHA: ${{ needs.resolve.outputs.baseline_sha }}
          BASELINE_SOURCE: ${{ needs.resolve.outputs.baseline_source }}
        run: |
          set -euo pipefail
          result="$(node scripts/deployment-migration-preflight.mjs --release "$RELEASE_SHA" --baseline "$BASELINE_SHA")"
          count="$(jq -r '.expectedPending | length' <<<"$result")"
          pending="$(jq -r '.expectedPending | join(",")' <<<"$result")"
          [[ "$count" =~ ^[0-9]+$ ]] || { echo "::error::The migration preflight returned no usable result."; exit 1; }

          echo "pending_count=$count" >> "$GITHUB_OUTPUT"
          echo "pending=$pending" >> "$GITHUB_OUTPUT"

          {
            echo "## Migration preflight"
            echo
            echo "Derived from the repository (migrations in the release minus migrations in the baseline); production's database was not read."
            echo
            echo "- Release: \`$RELEASE_SHA\`"
            echo "- Baseline: \`$BASELINE_SHA\` ($BASELINE_SOURCE)"
            if [ "$count" -gt 0 ]; then
              echo "- **This release contains $count EF Core migration(s) that production startup is expected to apply automatically:**"
              jq -r '.expectedPending[] | "  - `\(.)`"' <<<"$result"
            else
              echo "- No new EF Core migrations; production startup is not expected to change the schema."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$count" -gt 0 ]; then
            echo "::warning::This release contains $count EF Core migration(s) that production startup is expected to apply: $pending"
          fi

  build:
    name: Build release artifacts
    needs: resolve
    runs-on: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL == 'true' && fromJSON('["self-hosted","linux","x64","inventory-agent"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Report and validate runner mode
        env:
          RUNNER_MODE: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL }}
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          case "$RUNNER_MODE" in
            true) selected=self-hosted ;;
            ''|false) selected=github-hosted ;;
            *) echo "::error::The repository variable INVENTORY_AGENT_SELF_HOSTED_ALL must be exactly true, false or unset. See docs/automation.md § Runner placement."; exit 1 ;;
          esac
          echo "Runner mode: INVENTORY_AGENT_SELF_HOSTED_ALL=${RUNNER_MODE:-<unset>} selects $selected runners."
          echo "This job runs on $RUNNER_NAME ($RUNNER_KIND)."
          if [ "$RUNNER_KIND" != "$selected" ]; then
            echo "::error::This job runs on a $RUNNER_KIND runner, but INVENTORY_AGENT_SELF_HOSTED_ALL now selects $selected runners; the variable changed after the job was queued. Re-run the job. See docs/automation.md § Runner placement."
            exit 1
          fi

      - name: Check out release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/inventory-app/package-lock.json

      # The complete publish output is deployed, so publish content added by other changes (for
      # example a scheduled WebJob) reaches production with the API.
      - name: Publish API
        run: dotnet publish "$API_PROJECT" --configuration Release --output "$RUNNER_TEMP/api"

      # Lifecycle scripts are not needed for the production bundle (the build output is identical
      # without them), so a dependency cannot run code on the runner during installation.
      - name: Build frontend
        run: |
          npm --prefix "$FRONTEND_DIR" ci --ignore-scripts
          npm --prefix "$FRONTEND_DIR" run build

      - name: Upload API package
        uses: actions/upload-artifact@v4
        with:
          name: api-${{ needs.resolve.outputs.sha }}
          path: ${{ runner.temp }}/api
          if-no-files-found: error

      - name: Upload frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ needs.resolve.outputs.sha }}
          path: ${{ env.FRONTEND_OUTPUT }}
          if-no-files-found: error

  deploy-api:
    name: Deploy API
    if: github.ref == 'refs/heads/main' && (vars.INVENTORY_AGENT_SELF_HOSTED_ALL != 'true' || vars.INVENTORY_RUNNER_ISOLATION_VERIFIED == 'true') && (vars.INVENTORY_AGENT_SELF_HOSTED_ALL != 'true' || vars.INVENTORY_RUNNER_BASELINE_VERIFIED == 'true')
    needs:
      - resolve
      - validate
      - preflight
      - build
    environment: VmInventoryApi_Env
    runs-on: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL == 'true' && fromJSON('["self-hosted","linux","x64","inventory-agent"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      webapp_url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
      - name: Report and validate runner mode
        env:
          RUNNER_MODE: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL }}
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          case "$RUNNER_MODE" in
            true) selected=self-hosted ;;
            ''|false) selected=github-hosted ;;
            *) echo "::error::The repository variable INVENTORY_AGENT_SELF_HOSTED_ALL must be exactly true, false or unset. See docs/automation.md § Runner placement."; exit 1 ;;
          esac
          echo "Runner mode: INVENTORY_AGENT_SELF_HOSTED_ALL=${RUNNER_MODE:-<unset>} selects $selected runners."
          echo "This job runs on $RUNNER_NAME ($RUNNER_KIND)."
          if [ "$RUNNER_KIND" != "$selected" ]; then
            echo "::error::This job runs on a $RUNNER_KIND runner, but INVENTORY_AGENT_SELF_HOSTED_ALL now selects $selected runners; the variable changed after the job was queued. Re-run the job. See docs/automation.md § Runner placement."
            exit 1
          fi

      - name: Check runner tools for the API deployment
        run: |
          missing=0
          for tool in az jq curl; do
            if ! command -v "$tool" >/dev/null 2>&1; then echo "::error::$tool is not installed on runner $RUNNER_NAME."; missing=1; fi
          done
          if [ ! -x /usr/bin/gh ]; then echo "::error::/usr/bin/gh is not installed on runner $RUNNER_NAME."; missing=1; fi
          [ "$missing" -eq 0 ] || exit 1
          echo "Runner $RUNNER_NAME has the tools the API deployment needs."

      - name: Announce release and migrations
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          PENDING_COUNT: ${{ needs.preflight.outputs.pending_count }}
          PENDING: ${{ needs.preflight.outputs.pending }}
        run: |
          echo "Deploying API from $RELEASE_SHA."
          if [ "$PENDING_COUNT" -gt 0 ]; then
            echo "::warning::Production startup is expected to apply $PENDING_COUNT EF Core migration(s) after this deployment: $PENDING"
          else
            echo "No new EF Core migrations in this release."
          fi

      # Approval of this environment can come long after the run started, so containment in main
      # is checked again immediately before Azure authentication.
      - name: Reverify release SHA is in main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$RELEASE_SHA...main" --jq '.status')"
          case "$status" in
            identical|ahead) echo "Release $RELEASE_SHA is contained in main." ;;
            *) echo "::error::Release $RELEASE_SHA is no longer contained in main (compare status: $status)."; exit 1 ;;
          esac

      - name: Download API package
        uses: actions/download-artifact@v4
        with:
          name: api-${{ needs.resolve.outputs.sha }}
          path: ${{ runner.temp }}/api

      - name: Isolate the Azure CLI profile to this job
        # The self-hosted runner is persistent: keep the Azure CLI login in this job's temporary
        # directory, which the runner discards, instead of the runner account's ~/.azure.
        run: |
          set -euo pipefail
          profile="$RUNNER_TEMP/azure-cli-profile"
          rm -rf "$profile"
          mkdir -m 700 "$profile"
          echo "AZURE_CONFIG_DIR=$profile" >> "$GITHUB_ENV"

      - name: Azure Login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.VmInventoryApi_CLIENT_ID_4D7F }}
          tenant-id: ${{ vars.VmInventoryApi_TENANT_ID_4D7F }}
          subscription-id: ${{ vars.VmInventoryApi_SUBSCRIPTION_ID_4D7F }}

      - name: Deploy to Azure WebApp
        id: deploy
        uses: azure/webapps-deploy@5cfb776471c748b351e1ebf5770e208a54ace016 # v2.2.19
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ runner.temp }}/api

      - name: Azure Logout
        if: always()
        run: |
          az logout || true
          if [ -n "${AZURE_CONFIG_DIR:-}" ]; then rm -rf "$AZURE_CONFIG_DIR"; fi

  verify-api:
    name: Verify API health
    needs:
      - resolve
      - deploy-api
    runs-on: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL == 'true' && fromJSON('["self-hosted","linux","x64","inventory-agent"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions: {}

    steps:
      - name: Report and validate runner mode
        env:
          RUNNER_MODE: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL }}
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          case "$RUNNER_MODE" in
            true) selected=self-hosted ;;
            ''|false) selected=github-hosted ;;
            *) echo "::error::The repository variable INVENTORY_AGENT_SELF_HOSTED_ALL must be exactly true, false or unset. See docs/automation.md § Runner placement."; exit 1 ;;
          esac
          echo "Runner mode: INVENTORY_AGENT_SELF_HOSTED_ALL=${RUNNER_MODE:-<unset>} selects $selected runners."
          echo "This job runs on $RUNNER_NAME ($RUNNER_KIND)."
          if [ "$RUNNER_KIND" != "$selected" ]; then
            echo "::error::This job runs on a $RUNNER_KIND runner, but INVENTORY_AGENT_SELF_HOSTED_ALL now selects $selected runners; the variable changed after the job was queued. Re-run the job. See docs/automation.md § Runner placement."
            exit 1
          fi

      - name: Wait for /health/ready
        env:
          WEBAPP_URL: ${{ vars.PRODUCTION_API_BASE_URL || needs.deploy-api.outputs.webapp_url }}
        run: |
          set -uo pipefail
          base="${WEBAPP_URL%/}"
          base="${base/#http:\/\//https://}"
          [[ "$base" =~ ^https://[A-Za-z0-9.-]+$ ]] || { echo "::error::No usable HTTPS API URL ('$base'); the API health cannot be verified."; exit 1; }

          # Startup may be applying migrations, so allow up to about 15 minutes.
          for attempt in $(seq 1 90); do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 "$base/health/ready" || true)"
            if [ "$code" = "200" ]; then
              echo "API is healthy: $base/health/ready returned 200 (attempt $attempt)."
              exit 0
            fi
            echo "Attempt $attempt: $base/health/ready returned ${code:-no response}; retrying."
            sleep 10
          done

          echo "::error::$base/health/ready did not return 200; the frontend will not be deployed."
          exit 1

  # The baseline for the next run's migration preflight is the backend production is known to
  # run healthily, so the release is recorded only after /health/ready succeeded. An upload whose
  # startup or migration then fails leaves the last healthy release as the baseline.
  record-release:
    name: Record production backend release
    # Without a status function this still runs only when every job it needs succeeded.
    if: (vars.INVENTORY_AGENT_SELF_HOSTED_ALL != 'true' || vars.INVENTORY_RUNNER_ISOLATION_VERIFIED == 'true')
    needs:
      - resolve
      - deploy-api
      - verify-api
    runs-on: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL == 'true' && fromJSON('["self-hosted","linux","x64","inventory-agent"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      deployments: write

    steps:
      - name: Report and validate runner mode
        env:
          RUNNER_MODE: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL }}
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          case "$RUNNER_MODE" in
            true) selected=self-hosted ;;
            ''|false) selected=github-hosted ;;
            *) echo "::error::The repository variable INVENTORY_AGENT_SELF_HOSTED_ALL must be exactly true, false or unset. See docs/automation.md § Runner placement."; exit 1 ;;
          esac
          echo "Runner mode: INVENTORY_AGENT_SELF_HOSTED_ALL=${RUNNER_MODE:-<unset>} selects $selected runners."
          echo "This job runs on $RUNNER_NAME ($RUNNER_KIND)."
          if [ "$RUNNER_KIND" != "$selected" ]; then
            echo "::error::This job runs on a $RUNNER_KIND runner, but INVENTORY_AGENT_SELF_HOSTED_ALL now selects $selected runners; the variable changed after the job was queued. Re-run the job. See docs/automation.md § Runner placement."
            exit 1
          fi

      - name: Record the deployed backend SHA
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          deployment_id="$(jq -n \
            --arg ref "$RELEASE_SHA" \
            --arg task "$RELEASE_RECORD_TASK" \
            --arg environment "$PRODUCTION_ENVIRONMENT" \
            '{ref: $ref, task: $task, environment: $environment, auto_merge: false, required_contexts: [], production_environment: true, transient_environment: false, description: "Backend deployed and healthy (Deploy Production)"}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input - --jq '.id')"
          [[ "$deployment_id" =~ ^[0-9]+$ ]] || { echo "::error::The production release record was not created."; exit 1; }
          jq -n --arg url "$RUN_URL" '{state: "success", log_url: $url, auto_inactive: false}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" --input - >/dev/null
          echo "Recorded production backend release $RELEASE_SHA (deployment $deployment_id)."

  deploy-frontend:
    name: Deploy frontend
    if: github.ref == 'refs/heads/main' && (vars.INVENTORY_AGENT_SELF_HOSTED_ALL != 'true' || vars.INVENTORY_RUNNER_ISOLATION_VERIFIED == 'true') && (vars.INVENTORY_AGENT_SELF_HOSTED_ALL != 'true' || vars.INVENTORY_RUNNER_BASELINE_VERIFIED == 'true')
    needs:
      - resolve
      - build
      - deploy-api
      - verify-api
      - record-release
    environment: VmInventoryApi_Env
    runs-on: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL == 'true' && fromJSON('["self-hosted","linux","x64","inventory-agent"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      url: ${{ steps.deploy.outputs.static_web_app_url }}

    steps:
      - name: Report and validate runner mode
        env:
          RUNNER_MODE: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL }}
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          case "$RUNNER_MODE" in
            true) selected=self-hosted ;;
            ''|false) selected=github-hosted ;;
            *) echo "::error::The repository variable INVENTORY_AGENT_SELF_HOSTED_ALL must be exactly true, false or unset. See docs/automation.md § Runner placement."; exit 1 ;;
          esac
          echo "Runner mode: INVENTORY_AGENT_SELF_HOSTED_ALL=${RUNNER_MODE:-<unset>} selects $selected runners."
          echo "This job runs on $RUNNER_NAME ($RUNNER_KIND)."
          if [ "$RUNNER_KIND" != "$selected" ]; then
            echo "::error::This job runs on a $RUNNER_KIND runner, but INVENTORY_AGENT_SELF_HOSTED_ALL now selects $selected runners; the variable changed after the job was queued. Re-run the job. See docs/automation.md § Runner placement."
            exit 1
          fi

      - name: Check runner tools for the frontend deployment
        run: |
          missing=0
          for tool in docker curl; do
            if ! command -v "$tool" >/dev/null 2>&1; then echo "::error::$tool is not installed on runner $RUNNER_NAME."; missing=1; fi
          done
          if [ ! -x /usr/bin/gh ]; then echo "::error::/usr/bin/gh is not installed on runner $RUNNER_NAME."; missing=1; fi
          [ "$missing" -eq 0 ] || exit 1
          echo "Runner $RUNNER_NAME has the tools the frontend deployment needs."

      - name: Check the Docker daemon is reachable
        run: docker info >/dev/null || { echo "::error::The Docker daemon is not reachable by the runner account on $RUNNER_NAME."; exit 1; }

      - name: Reverify release SHA is in main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$RELEASE_SHA...main" --jq '.status')"
          case "$status" in
            identical|ahead) echo "Release $RELEASE_SHA is contained in main." ;;
            *) echo "::error::Release $RELEASE_SHA is no longer contained in main (compare status: $status)."; exit 1 ;;
          esac

      - name: Download frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: frontend-${{ needs.resolve.outputs.sha }}
          path: release-frontend

      # Deploys the bundle built from the release SHA as is; the action does not rebuild it.
      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_RED_ISLAND_0C128C000 }}
          action: upload
          app_location: release-frontend
          output_location: ''
          skip_app_build: true
          skip_api_build: true

      - name: Verify frontend responds
        env:
          SITE_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          set -uo pipefail
          base="${SITE_URL%/}"
          base="${base/#http:\/\//https://}"
          [[ "$base" =~ ^https://[A-Za-z0-9.-]+$ ]] || { echo "::error::No usable frontend URL ('$base')."; exit 1; }
          for attempt in $(seq 1 12); do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 "$base/" || true)"
            if [ "$code" = "200" ]; then
              echo "Frontend responds: $base/ returned 200."
              exit 0
            fi
            echo "Attempt $attempt: $base/ returned ${code:-no response}; retrying."
            sleep 10
          done
          echo "::error::$base/ did not return 200 after deployment."
          exit 1

  summary:
    name: Deployment summary
    if: always()
    needs:
      - resolve
      - validate
      - preflight
      - build
      - deploy-api
      - record-release
      - verify-api
      - deploy-frontend
    runs-on: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL == 'true' && fromJSON('["self-hosted","linux","x64","inventory-agent"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Report and validate runner mode
        env:
          RUNNER_MODE: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL }}
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          case "$RUNNER_MODE" in
            true) selected=self-hosted ;;
            ''|false) selected=github-hosted ;;
            *) echo "::error::The repository variable INVENTORY_AGENT_SELF_HOSTED_ALL must be exactly true, false or unset. See docs/automation.md § Runner placement."; exit 1 ;;
          esac
          echo "Runner mode: INVENTORY_AGENT_SELF_HOSTED_ALL=${RUNNER_MODE:-<unset>} selects $selected runners."
          echo "This job runs on $RUNNER_NAME ($RUNNER_KIND)."
          if [ "$RUNNER_KIND" != "$selected" ]; then
            echo "::error::This job runs on a $RUNNER_KIND runner, but INVENTORY_AGENT_SELF_HOSTED_ALL now selects $selected runners; the variable changed after the job was queued. Re-run the job. See docs/automation.md § Runner placement."
            exit 1
          fi

      - name: Publish deployment summary
        env:
          ENTRY_POINT: ${{ inputs.entry_point }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          BASELINE_SHA: ${{ needs.resolve.outputs.baseline_sha }}
          BASELINE_SOURCE: ${{ needs.resolve.outputs.baseline_source }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          PENDING_COUNT: ${{ needs.preflight.outputs.pending_count }}
          PENDING: ${{ needs.preflight.outputs.pending }}
          BUILD_RESULT: ${{ needs.build.result }}
          API_RESULT: ${{ needs.deploy-api.result }}
          RECORD_RESULT: ${{ needs.record-release.result }}
          HEALTH_RESULT: ${{ needs.verify-api.result }}
          FRONTEND_RESULT: ${{ needs.deploy-frontend.result }}
        run: |
          if [ "$PREFLIGHT_RESULT" = "success" ]; then
            if [ "${PENDING_COUNT:-0}" -gt 0 ]; then
              migrations="$PENDING_COUNT expected: $PENDING"
            else
              migrations="none expected"
            fi
          else
            migrations="not established"
          fi
          case "$ENTRY_POINT" in
            normal) entry="Deploy Production (normal release from the dispatch commit)" ;;
            recovery) entry="Deploy Production (advanced recovery, operator-supplied commit)" ;;
            *) entry="unknown ($ENTRY_POINT)" ;;
          esac
          {
            echo "## Deploy Production"
            echo
            echo "| Item | Result |"
            echo "| --- | --- |"
            echo "| Entry point | $entry |"
            echo "| Release SHA | \`${RELEASE_SHA:-not resolved}\` ($RESOLVE_RESULT) |"
            echo "| Baseline SHA | \`${BASELINE_SHA:-none}\` (${BASELINE_SOURCE:-n/a}) |"
            echo "| Validation | $VALIDATE_RESULT |"
            echo "| Migration preflight | $PREFLIGHT_RESULT; migrations $migrations |"
            echo "| Build | $BUILD_RESULT |"
            echo "| Backend deployment | $API_RESULT |"
            echo "| Release record | $RECORD_RESULT |"
            echo "| Backend health (/health/ready) | $HEALTH_RESULT |"
            echo "| Frontend deployment | $FRONTEND_RESULT |"
            echo
            if [ "$API_RESULT" = "success" ] && [ "$HEALTH_RESULT" != "success" ]; then
              echo "**The API package was deployed but did not become healthy.** It was not recorded as a production release, so the next run's baseline stays at \`${BASELINE_SHA:-the previous release}\`, and startup may already have applied some of this release's migrations."
              echo
            fi
            echo "A failed run changes nothing else: it does not revert, merge, relabel, roll back the database, start an agent repair or start another deployment. Recovery is a human decision."
          } >> "$GITHUB_STEP_SUMMARY"
