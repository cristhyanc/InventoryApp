name: Price collector (manual)

# #929 rollout: manual only, no cron. A separately reviewed change enables the Sydney schedule.
# target test: a human starts it from reviewed main or develop, normally against the hosted testing
# API that Deploy Testing deploys from develop (docs/testing-environment.md), in the price-collector
# environment with the collector's own federated identity, and it refuses the production API.
# target production (owner decision, 1 November 2026): reviewed main only, in the separate
# price-collector-production environment (main-only deployment branch rule and a required
# reviewer), with that environment's own identity, and only to the production API origin.
# full_run is the production-sized dry run the schedule waits for: every issued search with the
# production page sizes, in fresh Claude sessions of a few searches each, still manual and still
# against the test API, so the owner sees a full run's real duration and provider cost first.
on:
  workflow_dispatch:
    inputs:
      target:
        description: test = the disposable test API (main or develop); production = the production API (main only, needs the environment reviewer's approval)
        required: true
        type: choice
        options:
          - test
          - production
        default: test
      confirm_test_api:
        description: For target test only - the price-collector environment points to a disposable test API; provider spend limits are set
        required: true
        type: boolean
        default: false
      confirm_production_api:
        description: For target production only - this run writes prices to the production API; provider spend limits are set
        required: true
        type: boolean
        default: false
      sample_size:
        description: Maximum supplier searches (1-10); all other issued work becomes not_searched
        required: true
        type: string
        default: '3'
      full_run:
        description: Production-sized dry run - every issued search (up to 576) with production page sizes, in Claude batches of 24 (3 products); sample_size is ignored
        required: true
        type: boolean
        default: false
      include_verified_retailers:
        description: Permit previously verified Kmart and BIG W actors for this paid test run
        required: true
        type: boolean
        default: false
      stop_after_minutes:
        description: Interruption test only - stop Claude after this many minutes (1-14); leave blank for a normal run
        required: false
        type: string
        default: ''

permissions: {}

concurrency:
  group: price-collector
  cancel-in-progress: false

jobs:
  gate:
    name: Check manual test authorization
    runs-on: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL == 'true' && fromJSON('["self-hosted","linux","x64","inventory-agent"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Report and validate runner mode
        env:
          RUNNER_MODE: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL }}
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          case "$RUNNER_MODE" in
            true) selected=self-hosted ;;
            ''|false) selected=github-hosted ;;
            *) echo "::error::The repository variable INVENTORY_AGENT_SELF_HOSTED_ALL must be exactly true, false or unset. See docs/automation.md § Runner placement."; exit 1 ;;
          esac
          echo "Runner mode: INVENTORY_AGENT_SELF_HOSTED_ALL=${RUNNER_MODE:-<unset>} selects $selected runners."
          echo "This job runs on $RUNNER_NAME ($RUNNER_KIND)."
          if [ "$RUNNER_KIND" != "$selected" ]; then
            echo "::error::This job runs on a $RUNNER_KIND runner, but INVENTORY_AGENT_SELF_HOSTED_ALL now selects $selected runners; the variable changed after the job was queued. Re-run the job. See docs/automation.md § Runner placement."
            exit 1
          fi

      - name: Require main or develop and the owner's confirmation for the chosen target
        env:
          RUN_REF: ${{ github.ref }}
          TARGET: ${{ inputs.target }}
          CONFIRM_TEST_API: ${{ inputs.confirm_test_api }}
          CONFIRM_PRODUCTION_API: ${{ inputs.confirm_production_api }}
        run: |
          case "$RUN_REF" in
            refs/heads/main|refs/heads/develop) ;;
            *) echo '::error::Start the reviewed workflow from main or develop; feature branches never receive collector credentials.'; exit 1 ;;
          esac
          case "$TARGET" in
            test)
              if [ "$CONFIRM_TEST_API" != 'true' ] || [ "$CONFIRM_PRODUCTION_API" != 'false' ]; then
                echo '::error::For the test target, confirm the disposable test API and provider limits, and leave the production confirmation off.'
                exit 1
              fi ;;
            production)
              if [ "$RUN_REF" != 'refs/heads/main' ]; then
                echo '::error::Only the reviewed main workflow may run against production.'
                exit 1
              fi
              if [ "$CONFIRM_PRODUCTION_API" != 'true' ] || [ "$CONFIRM_TEST_API" != 'false' ]; then
                echo '::error::For the production target, confirm the production API and provider limits, and leave the test confirmation off.'
                exit 1
              fi ;;
            *) echo '::error::Choose the test or production target.'; exit 1 ;;
          esac

      - name: Require verified runner isolation for credentialed jobs
        env:
          RUNNER_MODE: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL }}
          RUNNER_ISOLATION_VERIFIED: ${{ vars.INVENTORY_RUNNER_ISOLATION_VERIFIED }}
        run: |
          if [ "$RUNNER_MODE" = "true" ] && [ "$RUNNER_ISOLATION_VERIFIED" != "true" ]; then
            echo '::error::Credentialed collector jobs require verified reset or ephemeral self-hosted runners.'
            exit 1
          fi

  collect:
    name: Collect and finalise the run
    needs: gate
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && (inputs.target == 'test' || (inputs.target == 'production' && github.ref == 'refs/heads/main')) && (vars.INVENTORY_AGENT_SELF_HOSTED_ALL != 'true' || vars.INVENTORY_RUNNER_ISOLATION_VERIFIED == 'true')
    runs-on: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL == 'true' && fromJSON('["self-hosted","linux","x64","inventory-agent"]') || 'ubuntu-latest' }}
    # Each target has its own protected environment, identity, API URL variable and provider secrets.
    environment: ${{ inputs.target == 'production' && 'price-collector-production' || 'price-collector' }}
    timeout-minutes: 160
    permissions:
      contents: read
      id-token: write
    env:
      PRICE_COLLECTOR_TARGET: ${{ inputs.target }}
      PRICE_COLLECTOR_TEST_API_URL: ${{ vars.PRICE_COLLECTOR_TEST_API_URL }}
      PRICE_COLLECTOR_PRODUCTION_API_URL: ${{ vars.PRICE_COLLECTOR_PRODUCTION_API_URL }}
      PRICE_COLLECTOR_TENANT_ID: ${{ vars.PRICE_COLLECTOR_TENANT_ID }}
      PRICE_COLLECTOR_CLIENT_ID: ${{ vars.PRICE_COLLECTOR_CLIENT_ID }}
      PRICE_COLLECTOR_API_SCOPE: ${{ vars.PRICE_COLLECTOR_API_SCOPE }}
    steps:
      - name: Report and validate runner mode
        env:
          RUNNER_MODE: ${{ vars.INVENTORY_AGENT_SELF_HOSTED_ALL }}
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          case "$RUNNER_MODE" in
            true) selected=self-hosted ;;
            ''|false) selected=github-hosted ;;
            *) echo "::error::The repository variable INVENTORY_AGENT_SELF_HOSTED_ALL must be exactly true, false or unset. See docs/automation.md § Runner placement."; exit 1 ;;
          esac
          echo "Runner mode: INVENTORY_AGENT_SELF_HOSTED_ALL=${RUNNER_MODE:-<unset>} selects $selected runners."
          echo "This job runs on $RUNNER_NAME ($RUNNER_KIND)."
          if [ "$RUNNER_KIND" != "$selected" ]; then
            echo "::error::This job runs on a $RUNNER_KIND runner, but INVENTORY_AGENT_SELF_HOSTED_ALL now selects $selected runners; the variable changed after the job was queued. Re-run the job. See docs/automation.md § Runner placement."
            exit 1
          fi

      - name: Check out the dispatched reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Allocate private per-attempt state
        run: echo "PRICE_COLLECTOR_STATE_DIR=$RUNNER_TEMP/price-collector-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Install the reviewed Claude CLI in this job's temporary directory
        timeout-minutes: 5
        run: npm install --prefix "$RUNNER_TEMP/price-collector-cli-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --no-audit --no-fund @anthropic-ai/claude-code@2.1.316 > /dev/null 2>&1

      - name: Issue work using a short-lived OIDC token
        timeout-minutes: 2
        env:
          PRICE_COLLECTOR_SAMPLE_SIZE: ${{ inputs.sample_size }}
          PRICE_COLLECTOR_FULL_RUN: ${{ inputs.full_run }}
          PRICE_COLLECTOR_INCLUDE_REVIEWED: ${{ inputs.include_verified_retailers }}
          PRICE_COLLECTOR_STOP_AFTER_MINUTES: ${{ inputs.stop_after_minutes }}
        run: node scripts/price-collector/workflow.mjs prepare

      - name: Run the bounded Claude collector
        id: claude
        # A backstop only: workflow.mjs stops Claude after 14 minutes for a sample and 120 for a full
        # run. The job leaves 30 minutes after this step for finalisation and cleanup.
        timeout-minutes: 130
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          PRICE_COLLECTOR_STOP_AFTER_MINUTES: ${{ inputs.stop_after_minutes }}
        run: |
          export PRICE_COLLECTOR_CLAUDE_BIN="$RUNNER_TEMP/price-collector-cli-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/node_modules/.bin/claude"
          node scripts/price-collector/workflow.mjs collect

      - name: Submit finished files and complete the issued run
        if: always()
        timeout-minutes: 15
        run: node scripts/price-collector/workflow.mjs finalize

      - name: Upload the run log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: price-collector-logs
          path: ${{ runner.temp }}/price-collector-${{ github.run_id }}-${{ github.run_attempt }}/logs
          retention-days: 7
          if-no-files-found: ignore

      - name: Remove private work, files and CLI installation
        if: always()
        run: |
          node scripts/price-collector/workflow.mjs cleanup
          rm -rf -- "$RUNNER_TEMP/price-collector-cli-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
