<div class="page">
  <header class="page-header">
    <h1 class="page-title">Categories</h1>
  </header>

  <div class="card">
    <div class="card-body p-0">
      <p class="p-4 text-md-body value-muted">Categories are managed from the product import and are read-only here.</p>
      @if (categories.length === 0) {
        <p class="p-4 text-md-body value-muted">No categories yet.</p>
      } @else {
        <div class="overflow-x-auto">
          <table class="table">
            <thead class="table-head">
              <tr>
                <th scope="col" class="table-cell">Name</th>
                <th scope="col" class="table-cell">Description</th>
              </tr>
            </thead>
            <tbody>
              @for (c of categories; track c.id) {
                <tr class="table-row">
                  <td class="table-cell">{{ c.name }}</td>
                  <td class="table-cell">{{ c.description }}</td>
                </tr>
              }
            </tbody>
          </table>
        </div>
      }
    </div>
  </div>
</div>
