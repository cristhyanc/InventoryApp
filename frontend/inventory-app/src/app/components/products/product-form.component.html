<h1 class="mb-6 text-2xl font-semibold text-slate-800">Edit Product</h1>

<div class="mx-auto max-w-2xl rounded-xl bg-white p-6 shadow-sm">
  @if (error) {
    <p class="mb-4 text-sm text-red-600">{{ error }}</p>
  }

  <p class="mb-4 rounded-md bg-blue-50 px-3 py-2 text-sm text-blue-800">Product name, category, and unit price are managed by Nayax and cannot be edited here.</p>

  <form class="space-y-4" (ngSubmit)="save()">
    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700">Name *</label>
      <input [(ngModel)]="form.name" name="name" readonly />
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700">SKU</label>
      <input [(ngModel)]="form.sku" name="sku" placeholder="Optional, e.g. SNK-001" />
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700">Description</label>
      <textarea [(ngModel)]="form.description" name="description" rows="2"></textarea>
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700">Category</label>
      <select [(ngModel)]="form.categoryId" name="categoryId" disabled>
        <option value="">None</option>
        @for (c of categories; track c.id) {
          <option [ngValue]="c.id">{{ c.name }}</option>
        }
      </select>
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700">Supplier</label>
      <select [(ngModel)]="form.supplierId" name="supplierId">
        <option value="">None</option>
        @for (s of suppliers; track s.id) {
          <option [ngValue]="s.id">{{ s.name }}</option>
        }
      </select>
    </div>

    <div class="flex items-center gap-2 rounded-lg border border-slate-200 bg-slate-50 px-3 py-2">
      <input [(ngModel)]="form.isActive" name="isActive" type="checkbox" class="h-4 w-4 rounded border-slate-300 text-blue-600" />
      <label class="text-sm font-medium text-slate-700">Active product</label>
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700">Unit Price ($) *</label>
      <input [(ngModel)]="form.unitPrice" name="unitPrice" type="number" readonly />
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700">Low Stock Threshold *</label>
      <input [(ngModel)]="form.lowStockThreshold" name="lowStockThreshold" type="number" min="0" required />
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700">Unit Label</label>
      <input [(ngModel)]="form.unit" name="unit" placeholder="e.g. bag, can, bottle" />
    </div>

    <div class="flex flex-wrap gap-3 pt-2">
      <button type="submit" class="inline-flex items-center rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60" [disabled]="saving">Update Product</button>
      <a routerLink="/products" class="inline-flex items-center rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Cancel</a>
    </div>
  </form>
</div>
