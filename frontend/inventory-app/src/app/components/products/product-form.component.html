<h1>{{ isEdit ? 'Edit Product' : 'New Product' }}</h1>

<div class="card" style="max-width:600px">
  @if (error) {
    <p style="color:#b91c1c">{{ error }}</p>
  }

  <form (ngSubmit)="save()">
    <div class="form-row">
      <label>Name *</label>
      <input [(ngModel)]="form.name" name="name" required placeholder="e.g. Potato Chips" />
    </div>

    <div class="form-row">
      <label>SKU</label>
      <input [(ngModel)]="form.sku" name="sku" placeholder="Optional, e.g. SNK-001" />
    </div>

    <div class="form-row">
      <label>Description</label>
      <textarea [(ngModel)]="form.description" name="description" rows="2"></textarea>
    </div>

    <div class="form-row">
      <label>Category</label>
      <select [(ngModel)]="form.categoryId" name="categoryId">
        <option value="">None</option>
        @for (c of categories; track c.id) {
          <option [ngValue]="c.id">{{ c.name }}</option>
        }
      </select>
    </div>

    <div class="form-row">
      <label>Supplier</label>
      <select [(ngModel)]="form.supplierId" name="supplierId">
        <option value="">None</option>
        @for (s of suppliers; track s.id) {
          <option [ngValue]="s.id">{{ s.name }}</option>
        }
      </select>
    </div>

    <div class="form-row">
      <label>Unit Price ($) *</label>
      <input [(ngModel)]="form.unitPrice" name="unitPrice" type="number" step="0.01" min="0" required />
    </div>

    @if (!isEdit) {
      <div class="form-row">
        <label>Initial Quantity in Stock</label>
        <input [(ngModel)]="form.quantityInStock" name="quantityInStock" type="number" min="0" />
      </div>
    }

    <div class="form-row">
      <label>Low Stock Threshold *</label>
      <input [(ngModel)]="form.lowStockThreshold" name="lowStockThreshold" type="number" min="0" required />
    </div>

    <div class="form-row">
      <label>Unit Label</label>
      <input [(ngModel)]="form.unit" name="unit" placeholder="e.g. bag, can, bottle" />
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="saving">{{ isEdit ? 'Update' : 'Create' }} Product</button>
    <a routerLink="/products" class="btn btn-secondary">Cancel</a>
  </form>
</div>
