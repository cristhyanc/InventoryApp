<div class="page">
  <header class="page-header">
    <h1 class="page-title">Products</h1>
    <!-- "New Product" is not here (issue #825): a create action in the shared header reached every
         view the shell wraps, including Needs Ordering, which orders products that already exist.
         It lives in the All Products search/filter toolbar instead, which is also where it is
         hidden during a support session. -->
    <nav
      aria-label="Products views"
      class="flex overflow-hidden rounded-md-control border border-md-gray-300 bg-white text-md-body text-md-gray-800"
    >
      <a
        routerLink="/products"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="bg-md-dark-gradient text-white"
        class="px-3 py-2"
      >
        All products
      </a>
      <a
        routerLink="/products/needs-ordering"
        routerLinkActive="bg-md-dark-gradient text-white"
        class="border-x border-md-gray-300 px-3 py-2"
      >
        Needs ordering
      </a>
      <a
        routerLink="/purchases/orders"
        routerLinkActive="bg-md-dark-gradient text-white"
        class="px-3 py-2"
      >
        On order
      </a>
    </nav>
  </header>

  <router-outlet></router-outlet>
</div>
