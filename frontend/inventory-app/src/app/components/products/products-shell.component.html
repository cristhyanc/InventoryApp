<div class="page">
  <header class="page-header">
    <h1 class="page-title">Products</h1>
    <!-- Hidden rather than disabled while a support session is active (issue #554): a session
         grants InventoryOperate, so this write would otherwise still render. -->
    @if (!sessionActive) {
      <a routerLink="/products/new" class="btn btn-primary">New Product</a>
    }
    <nav
      aria-label="Products views"
      class="flex overflow-hidden rounded-md-control border border-md-gray-300 bg-white text-md-body text-md-gray-800"
    >
      <a
        routerLink="/products"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="bg-md-dark-gradient text-white"
        class="px-3 py-2"
      >
        All products
      </a>
      <a
        routerLink="/products/needs-ordering"
        routerLinkActive="bg-md-dark-gradient text-white"
        class="border-x border-md-gray-300 px-3 py-2"
      >
        Needs ordering
      </a>
      <a
        routerLink="/purchases/orders"
        routerLinkActive="bg-md-dark-gradient text-white"
        class="px-3 py-2"
      >
        On order
      </a>
    </nav>
  </header>

  <router-outlet></router-outlet>
</div>
