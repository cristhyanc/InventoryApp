<!-- The choice itself is the edit page's panel, deferred (issue #829): it reads nothing and saves
     nothing, so the vocabulary, the labels and the help stay the ones that page uses. There is no
     button here (issue #1111): the page's primary action retries a failed rule write. -->
<app-product-gst-rule [deferred]="true" [disabled]="disabled || saving" (ruleChange)="onRuleChange($event)"></app-product-gst-rule>

<!-- Only ever shown once the product exists and its rule write failed: until then there is no
     partial outcome to report. -->
@if (createdProductId !== null && error) {
  <p class="mt-3 rounded-lg border border-rr-warn-bg bg-rr-warn-bg p-3 text-sm text-rr-warn-text" role="alert" data-testid="product-create-gst-rule-error">
    {{ error }}
  </p>
}
