<div class="relative inline-block text-left">
  <span class="block text-xs font-semibold uppercase text-slate-500">{{ label }}</span>
  <button
    #trigger
    type="button"
    class="mt-1 flex w-56 items-center justify-between gap-2 rounded-md border border-slate-300 bg-white px-3 py-2 text-left text-sm text-slate-700 hover:bg-slate-50"
    aria-haspopup="true"
    [attr.aria-expanded]="isOpen"
    [attr.aria-controls]="panelId"
    [attr.aria-label]="label + ': ' + triggerText"
    (click)="toggleOpen()"
  >
    <span class="truncate">{{ triggerText }}</span>
    <span aria-hidden="true" class="text-slate-400">&#9662;</span>
  </button>

  @if (isOpen) {
    <div [attr.id]="panelId" role="group" [attr.aria-label]="label + ' options'" class="absolute z-20 mt-1 w-64 rounded-md border border-slate-200 bg-white p-2 shadow-lg">
      <label class="flex items-center gap-2 rounded px-2 py-1 text-sm font-medium text-slate-700 hover:bg-slate-50">
        <input type="checkbox" [checked]="allSelected" [indeterminate]="someSelected" [disabled]="options.length === 0" (change)="toggleSelectAll()" />
        Select all
      </label>
      <div class="my-1 border-t border-slate-100"></div>
      <div class="max-h-56 overflow-y-auto">
        @for (option of options; track option.id) {
          <label class="flex items-center gap-2 rounded px-2 py-1 text-sm text-slate-700 hover:bg-slate-50">
            <input type="checkbox" [checked]="isSelected(option.id)" (change)="toggleOption(option.id)" />
            <span class="truncate">{{ option.label }}</span>
          </label>
        }
        @if (options.length === 0) {
          <p class="px-2 py-1 text-sm text-slate-500">No {{ itemLabelPlural }} available.</p>
        }
      </div>
    </div>
  }
</div>
