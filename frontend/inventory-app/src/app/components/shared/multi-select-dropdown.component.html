<div class="relative inline-block text-left">
  <span class="block text-md-table-head font-bold uppercase tracking-wide text-md-gray-600">{{ label }}</span>
  <button
    #trigger
    type="button"
    class="mt-1 flex w-56 items-center justify-between gap-2 rounded-md-control border border-md-input-border bg-white px-3 py-2 text-left text-sm text-md-gray-800 hover:bg-md-gray-100"
    aria-haspopup="true"
    [attr.aria-expanded]="isOpen"
    [attr.aria-controls]="panelId"
    [attr.aria-label]="label + ': ' + triggerText"
    (click)="toggleOpen()"
  >
    <span class="truncate">{{ triggerText }}</span>
    <span aria-hidden="true" class="text-md-gray-500">&#9662;</span>
  </button>

  @if (isOpen) {
    <div [attr.id]="panelId" role="group" [attr.aria-label]="label + ' options'" class="absolute z-20 mt-1 w-64 rounded-md-card border border-md-gray-200 bg-white p-2 shadow-md">
      <label class="msd-row rounded px-2 py-1 text-sm font-medium text-md-gray-800 hover:bg-md-gray-100">
        <input type="checkbox" class="msd-checkbox" [checked]="allSelected" [indeterminate]="someSelected" [disabled]="options.length === 0" (change)="toggleSelectAll()" />
        <span class="msd-label">Select all</span>
      </label>
      <div class="my-1 border-t border-md-gray-200"></div>
      <div class="max-h-56 overflow-y-auto">
        @for (option of options; track option.id) {
          <label class="msd-row rounded px-2 py-1 text-sm text-md-gray-600 hover:bg-md-gray-100">
            <input type="checkbox" class="msd-checkbox" [checked]="isSelected(option.id)" (change)="toggleOption(option.id)" />
            <span class="msd-label">{{ option.label }}</span>
          </label>
        }
        @if (options.length === 0) {
          <p class="px-2 py-1 text-sm text-md-gray-500">No {{ itemLabelPlural }} available.</p>
        }
      </div>
    </div>
  }
</div>
