<!--
  The cell. It is a button only when there is a comparison to open: "Not tracked", "Awaiting
  match", "Loading" and "Unavailable" are statements, and a control that opens nothing would be a
  control that lies about having something to show.
-->
@if (canOpen) {
  <button
    #trigger
    type="button"
    class="text-left text-md-body font-semibold text-md-primary hover:underline"
    aria-haspopup="dialog"
    [attr.aria-expanded]="open"
    [attr.aria-label]="'Supplier prices for ' + productName + ': ' + display"
    (click)="openPopup()"
    data-testid="cheapest-supplier-cell"
  >{{ display }}</button>
} @else {
  <span
    class="text-md-body value-muted"
    data-testid="cheapest-supplier-cell"
  >{{ display }}</span>
}
@if (onlinePriceNote) {
  <span class="block text-md-body value-muted" data-testid="cheapest-supplier-online-note">{{ onlinePriceNote }}</span>
}
@if (stockNote) {
  <span class="block text-md-body value-muted" data-testid="cheapest-supplier-stock-note">{{ stockNote }}</span>
}

@if (open && product) {
  <!-- The one shared supplier comparison (issue #1093), opened as a native modal. -->
  <app-supplier-comparison-dialog
    [product]="product"
    [displayBasis]="displayBasis"
    [productName]="productName"
    (closed)="onPopupClosed()"
  ></app-supplier-comparison-dialog>
}
