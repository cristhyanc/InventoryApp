<h1 class="mb-6 text-2xl font-semibold text-slate-800">Upload Receipt</h1>

<div class="mx-auto max-w-2xl rounded-xl bg-white p-6 shadow-sm">
  @if (error) {
    <p class="mb-4 text-sm text-red-600">{{ error }}</p>
  }

  <form class="space-y-4" (ngSubmit)="upload()">
    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700">Receipt File (image or PDF) *</label>
      <input type="file" accept="image/*,.pdf" (change)="onFileSelected($event)" />
    </div>

    @if (previewUrl) {
      <div>
        <img [src]="previewUrl" alt="Receipt preview" class="max-h-72 rounded-lg object-contain" />
      </div>
    }

    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700">Title *</label>
      <input [(ngModel)]="form.title" name="title" required placeholder="e.g. Weekly snack restock" />
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700">Supplier</label>
      <select [(ngModel)]="form.supplierId" name="supplierId">
        <option value="">None</option>
        @for (s of suppliers; track s.id) {
          <option [ngValue]="s.id">{{ s.name }}</option>
        }
      </select>
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700">Purchase Date</label>
      <input type="date" [(ngModel)]="form.purchaseDate" name="purchaseDate" />
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700">Total Amount ($)</label>
      <input type="number" step="0.01" min="0" [(ngModel)]="form.totalAmount" name="totalAmount" placeholder="Optional" />
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium text-slate-700">Notes</label>
      <textarea [(ngModel)]="form.notes" name="notes" rows="2" placeholder="Optional"></textarea>
    </div>

    <div class="flex flex-wrap gap-3">
      <button type="submit" class="inline-flex items-center rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60" [disabled]="saving">Upload Receipt</button>
      <a routerLink="/receipts" class="inline-flex items-center rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Cancel</a>
    </div>
  </form>
</div>
