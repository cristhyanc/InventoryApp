<div class="page">
  <header class="page-header">
    <div>
      <h1 class="page-title">Suppliers</h1>
    </div>
  </header>

  <section class="card">
    <div class="card-header">
      <h2 class="card-title">{{ editing ? 'Edit Supplier' : 'New Supplier' }}</h2>
    </div>
    <div class="card-body">
      <form class="flex flex-col gap-4" (ngSubmit)="save()">
        <div class="field">
          <label class="field-label" for="supplierName">Name</label>
          <input id="supplierName" [(ngModel)]="form.name" name="name" required placeholder="e.g. General Distributors Inc." />
        </div>
        <div class="field">
          <label class="field-label" for="supplierContactName">Contact Name</label>
          <input id="supplierContactName" [(ngModel)]="form.contactName" name="contactName" placeholder="Optional" />
        </div>
        <div class="field">
          <label class="field-label" for="supplierPhone">Phone</label>
          <input id="supplierPhone" [(ngModel)]="form.phone" name="phone" placeholder="Optional" />
        </div>
        <div class="field">
          <label class="field-label" for="supplierEmail">Email</label>
          <input id="supplierEmail" [(ngModel)]="form.email" name="email" type="email" placeholder="Optional" />
        </div>
        <div class="field">
          <label class="field-label" for="supplierAddress">Address</label>
          <textarea id="supplierAddress" [(ngModel)]="form.address" name="address" rows="2" placeholder="Optional"></textarea>
        </div>
        <div class="page-actions">
          <button type="submit" class="btn btn-primary">{{ editing ? 'Update' : 'Create' }}</button>
          @if (editing) {
            <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
          }
        </div>
      </form>
    </div>
  </section>

  @if (editing) {
    <app-supplier-gst-defaults
      [supplierId]="editing.id"
      [supplierName]="editing.name"
    ></app-supplier-gst-defaults>
  }

  <section class="card">
    <div class="card-header">
      <h2 class="card-title">All Suppliers</h2>
    </div>
    <div class="card-body p-0">
      @if (suppliers.length === 0) {
        <p class="p-4 text-md-body value-muted">No suppliers yet.</p>
      } @else {
        <div class="overflow-x-auto">
          <table class="table">
            <thead class="table-head">
              <tr>
                <th scope="col" class="table-cell">Name</th>
                <th scope="col" class="table-cell">Contact</th>
                <th scope="col" class="table-cell">Phone</th>
                <th scope="col" class="table-cell">Email</th>
                <th scope="col" class="table-cell"></th>
              </tr>
            </thead>
            <tbody>
              @for (s of suppliers; track s.id) {
                <tr class="table-row">
                  <td class="table-cell">{{ s.name }}</td>
                  <td class="table-cell">{{ s.contactName }}</td>
                  <td class="table-cell">{{ s.phone }}</td>
                  <td class="table-cell">{{ s.email }}</td>
                  <td class="table-cell">
                    <div class="flex flex-wrap gap-2">
                      <button type="button" class="btn btn-sm btn-secondary" (click)="startEdit(s)">
                        <app-icon name="edit" [size]="16" />
                        Edit
                      </button>
                      <button type="button" class="btn btn-sm btn-danger" (click)="remove(s)">
                        <app-icon name="delete" [size]="16" />
                        Delete
                      </button>
                    </div>
                  </td>
                </tr>
              }
            </tbody>
          </table>
        </div>
      }
    </div>
  </section>
</div>
