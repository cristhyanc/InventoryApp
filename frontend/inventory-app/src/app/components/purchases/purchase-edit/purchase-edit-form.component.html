<!--
  The shared Add/Edit purchase layout (issue #1029). This component keeps every edit rule - stored
  line identity, changed-only GST classifications, the stored purchase instant - and the layout only
  presents the form object and lines it is given.
-->
<app-purchase-form-layout
  mode="edit"
  idPrefix="edit"
  testIdPrefix="edit-"
  [form]="editForm"
  [items]="editItems"
  [suppliers]="suppliers"
  [products]="products"
  [saving]="saving"
  [sessionActive]="sessionActive"
  [error]="error"
  [lineError]="lineError"
  [pendingFile]="pendingFile"
  [storedReceipt]="storedReceipt"
  [gstSummary]="gstSummary"
  (submitted)="submit()"
  (cancelled)="cancelEdit()"
  (addLine)="addEditItem()"
  (removeLine)="removeEditItem($event)"
  (pendingFileChange)="pendingFileChange.emit($event)"
  (previewStoredReceipt)="previewStoredReceipt.emit()"
/>
