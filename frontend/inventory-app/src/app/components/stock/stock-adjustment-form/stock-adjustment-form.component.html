<div class="mb-6 max-w-2xl rounded-xl bg-white p-6 shadow-sm">
  <h2 class="mb-4 text-lg font-semibold text-slate-800">Adjust Stock</h2>
  @if (error) {
    <p role="alert" data-testid="adjustment-error" class="mb-4 text-sm text-red-600">{{ error }}</p>
  }
  <form class="space-y-4" (ngSubmit)="adjust()">
    <div>
      <label for="adjustment-quantity-change" class="mb-1 block text-sm font-medium text-slate-700">Quantity Change *</label>
      <input id="adjustment-quantity-change" [(ngModel)]="form.quantityChange" (ngModelChange)="onAdjustmentInputsChanged()" name="quantityChange" type="number" [min]="isCorrection ? 1 : null" step="1" required [placeholder]="isCorrection ? 'e.g. 4' : 'e.g. 20 to add, -5 to remove'" />
      @if (isCorrection) {
        <p class="mt-1 text-xs text-slate-500">Enter the quantity to remove. It will be recorded as a negative stock correction.</p>
      }
    </div>
    <div>
      <label for="adjustment-reason" class="mb-1 block text-sm font-medium text-slate-700">Reason</label>
      <select id="adjustment-reason" [(ngModel)]="form.reason" (ngModelChange)="onAdjustmentInputsChanged()" name="reason">
        @for (r of reasonOptions; track r.value) {
          <option [ngValue]="r.value">{{ r.label }}</option>
        }
      </select>
    </div>
    @if (requiresRestockCost) {
      <div>
        <label for="adjustment-unit-cost" class="mb-1 block text-sm font-medium text-slate-700">Unit Cost *</label>
        <input id="adjustment-unit-cost" [(ngModel)]="form.unitCost" name="unitCost" type="number" min="0" step="0.0001" required placeholder="Acquisition cost per unit" />
        <p class="mt-1 text-xs text-slate-500">{{ restockCostHelp }}</p>
      </div>
    }
    <div>
      <label for="adjustment-machine" class="mb-1 block text-sm font-medium text-slate-700">Machine (optional)</label>
      <select id="adjustment-machine" [(ngModel)]="form.machineId" name="machineId">
        <option [ngValue]="null">— None —</option>
        @for (m of machines; track m.machineID) {
          <option [ngValue]="m.machineID">{{ m.machineName || m.machineID }}</option>
        }
      </select>
    </div>
    <div>
      <label for="adjustment-eat-before" class="mb-1 block text-sm font-medium text-slate-700">Eat Before</label>
      <input id="adjustment-eat-before" [(ngModel)]="form.EatBefore" name="eatBefore" type="date" />
    </div>
    <div>
      <label for="adjustment-notes" class="mb-1 block text-sm font-medium text-slate-700">Notes</label>
      <textarea id="adjustment-notes" [(ngModel)]="form.notes" name="notes" rows="2" placeholder="Optional"></textarea>
    </div>
    <button type="submit" data-testid="apply-adjustment" [disabled]="saving" class="inline-flex items-center rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60">
      {{ saving ? 'Applying…' : 'Apply Adjustment' }}
    </button>
  </form>
</div>
