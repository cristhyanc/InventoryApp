<header class="border-b border-slate-200 bg-white/90 shadow-sm backdrop-blur">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
    <span class="text-lg font-semibold text-slate-800">🧃 Inventory Manager</span>
    <nav class="flex flex-wrap items-center gap-5 text-sm font-medium text-slate-600">
      <a routerLink="/" routerLinkActive="text-blue-600" [routerLinkActiveOptions]="{ exact: true }" class="transition hover:text-blue-600">Dashboard</a>
      <a routerLink="/products" routerLinkActive="text-blue-600" class="transition hover:text-blue-600">Products</a>
      <a routerLink="/categories" routerLinkActive="text-blue-600" class="transition hover:text-blue-600">Categories</a>
      <a routerLink="/suppliers" routerLinkActive="text-blue-600" class="transition hover:text-blue-600">Suppliers</a>
      <a routerLink="/receipts" routerLinkActive="text-blue-600" class="transition hover:text-blue-600">Receipts</a>
      <span class="text-slate-400">|</span>
      <details class="relative">
        <summary class="cursor-pointer list-none text-slate-500 transition hover:text-blue-600">
          Reports <span class="ml-1 text-xs">&#9662;</span>
        </summary>
        <div class="absolute right-0 z-10 mt-2 flex min-w-48 flex-col rounded-lg border border-slate-200 bg-white p-2 shadow-lg">
          <a (click)="closeReportsMenu($event)" routerLink="/reports" routerLinkActive="bg-blue-50 text-blue-600" [routerLinkActiveOptions]="{ exact: true }" class="rounded px-3 py-2 transition hover:bg-slate-50 hover:text-blue-600">Dashboard</a>
          <a (click)="closeReportsMenu($event)" routerLink="/reports/bookkeeping" routerLinkActive="bg-blue-50 text-blue-600" class="rounded px-3 py-2 transition hover:bg-slate-50 hover:text-blue-600">Bookkeeping</a>
          <a (click)="closeReportsMenu($event)" routerLink="/reports/daily" routerLinkActive="bg-blue-50 text-blue-600" class="rounded px-3 py-2 transition hover:bg-slate-50 hover:text-blue-600">Daily</a>
          <a (click)="closeReportsMenu($event)" routerLink="/reports/reconciliation" routerLinkActive="bg-blue-50 text-blue-600" class="rounded px-3 py-2 transition hover:bg-slate-50 hover:text-blue-600">Reconciliation</a>
          <a (click)="closeReportsMenu($event)" routerLink="/reports/machines" routerLinkActive="bg-blue-50 text-blue-600" class="rounded px-3 py-2 transition hover:bg-slate-50 hover:text-blue-600">Machines</a>
          <a (click)="closeReportsMenu($event)" routerLink="/reports/products" routerLinkActive="bg-blue-50 text-blue-600" class="rounded px-3 py-2 transition hover:bg-slate-50 hover:text-blue-600">Products</a>
          <a (click)="closeReportsMenu($event)" routerLink="/reports/gst" routerLinkActive="bg-blue-50 text-blue-600" class="rounded px-3 py-2 transition hover:bg-slate-50 hover:text-blue-600">GST</a>
        </div>
      </details>
    </nav>
  </div>
</header>

<main class="mx-auto max-w-7xl px-6 py-6">
  <router-outlet />
</main>

<app-toast-container></app-toast-container>
