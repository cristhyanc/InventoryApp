<div class="flex min-h-screen flex-col bg-md-gray-100">
  <header class="sticky top-0 z-30">
    <div class="flex items-center gap-3 px-4 py-3 sm:px-6">
      <!--
        The top bar keeps an opener only on a narrow layout, where the sidebar is a drawer that is
        not on the page and so has no header row of its own to put a control in. On a wide layout
        the single collapse control lives in the sidebar's own header, beside the app title
        (issue #456), so no detached toggle floats above the menu.
      -->
      @if (isSidebarDrawer) {
        <button
          #sidebarToggle
          type="button"
          class="btn btn-secondary flex h-11 w-11 shrink-0 items-center justify-center p-0"
          [attr.aria-expanded]="isSidebarOpen"
          [attr.aria-controls]="sidebarId"
          [attr.aria-label]="sidebarToggleLabel"
          (click)="toggleSidebar()"
        >
          <app-icon name="menu" variant="outlined" [size]="20" />
        </button>
      }
      <div class="ml-auto">
        <app-user-menu
          [isSignedIn]="isLoggedIn"
          [userName]="userName"
          (signInRequested)="login()"
          (signOutRequested)="logout()"
        />
      </div>
    </div>
  </header>

  <div class="flex flex-1 items-stretch">
    @if (isSidebarDrawer && isSidebarOpen) {
      <button
        type="button"
        aria-label="Close navigation menu"
        class="fixed inset-0 z-30 bg-md-dark/40"
        (click)="closeSidebar()"
      ></button>
    }

    @if (isSidebarVisible) {
      <app-sidebar-nav
        [navId]="sidebarId"
        [expanded]="isSidebarExpanded"
        [drawer]="isSidebarDrawer"
        (navigated)="onSidebarNavigated()"
        (dismissed)="closeSidebar()"
        (expandRequested)="expandSidebar()"
        (collapseToggled)="toggleSidebar()"
      />
    }

    <main class="min-w-0 flex-1">
      <div class="w-full p-4 sm:p-6">
        <router-outlet />
      </div>
    </main>
  </div>
</div>

<app-toast-container></app-toast-container>
<app-loading-indicator></app-loading-indicator>
