<div class="flex min-h-screen flex-col">
  <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/90 shadow-sm backdrop-blur">
    <div class="flex items-center gap-3 px-4 py-3 sm:px-6">
      <button
        #sidebarToggle
        type="button"
        class="rounded-md border border-slate-300 px-3 py-2 text-slate-600 transition hover:bg-slate-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
        [attr.aria-expanded]="isSidebarOpen"
        [attr.aria-controls]="sidebarId"
        [attr.aria-label]="sidebarToggleLabel"
        (click)="toggleSidebar()"
      >
        <span aria-hidden="true">&#9776;</span>
      </button>
      <a routerLink="/" class="truncate text-lg font-semibold text-slate-800">🧃 Inventory Manager</a>
      <div class="ml-auto">
        <app-user-menu
          [isSignedIn]="isLoggedIn"
          [userName]="userName"
          (signInRequested)="login()"
          (signOutRequested)="logout()"
        />
      </div>
    </div>
  </header>

  <div class="flex flex-1 items-stretch">
    @if (isSidebarDrawer && isSidebarOpen) {
      <button
        type="button"
        aria-label="Close navigation menu"
        class="fixed inset-0 z-30 bg-slate-900/40"
        (click)="closeSidebar()"
      ></button>
    }

    @if (isSidebarVisible) {
      <app-sidebar-nav
        [id]="sidebarId"
        [expanded]="isSidebarExpanded"
        [drawer]="isSidebarDrawer"
        (navigated)="onSidebarNavigated()"
        (dismissed)="closeSidebar()"
        (expandRequested)="expandSidebar()"
      />
    }

    <main class="min-w-0 flex-1">
      <div class="mx-auto w-full max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
        <router-outlet />
      </div>
    </main>
  </div>
</div>

<app-toast-container></app-toast-container>
<app-loading-indicator></app-loading-indicator>
