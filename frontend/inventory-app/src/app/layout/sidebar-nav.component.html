<nav
  aria-label="Primary"
  class="flex shrink-0 flex-col overflow-y-auto bg-white p-3 text-md-body shadow-md"
  [class.fixed]="drawer"
  [class.inset-y-0]="drawer"
  [class.left-0]="drawer"
  [class.z-40]="drawer"
  [class.rounded-md-card]="!drawer"
  [class.m-4]="!drawer"
  [class.w-72]="drawer"
  [class.w-64]="!drawer && expanded"
  [class.w-16]="!drawer && !expanded"
>
  <div class="mb-2 flex items-center gap-2 border-b border-md-gray-200 px-1 pb-3">
    <div class="flex min-w-0 flex-1 items-center gap-2 truncate font-semibold text-md-gray-800">
      <span aria-hidden="true" class="text-base">🧃</span>
      <span class="truncate" [class.hidden]="!expanded">Inventory Manager</span>
    </div>
    @if (drawer) {
      <button
        type="button"
        aria-label="Close navigation menu"
        class="rounded-md-control px-2 py-1 text-md-gray-600 transition hover:bg-md-gray-100"
        (click)="dismissed.emit()"
      >
        <app-icon name="close" [size]="20" />
      </button>
    }
  </div>

  <ul class="flex flex-col gap-1">
    @for (item of navigation; track item.label) {
      <li>
        @if (item.kind === 'group') {
          <button
            type="button"
            class="flex w-full items-center gap-3 rounded-md-control px-3 py-2 font-medium text-md-gray-800 transition hover:bg-md-gray-100"
            [class.bg-md-gray-100]="isGroupActive(item)"
            [class.font-semibold]="isGroupActive(item)"
            [attr.aria-expanded]="expanded && isGroupOpen(item)"
            [attr.aria-controls]="expanded && isGroupOpen(item) ? groupPanelId(item) : null"
            [attr.title]="expanded ? null : item.label"
            (click)="toggleGroup(item)"
          >
            <app-icon [name]="item.icon" [size]="20" />
            <span class="truncate" [class.sr-only]="!expanded">{{ item.label }}</span>
            @if (expanded) {
              <span aria-hidden="true" class="ml-auto text-xs text-md-gray-500">{{ isGroupOpen(item) ? '▴' : '▾' }}</span>
            }
          </button>

          @if (expanded && isGroupOpen(item)) {
            <ul [id]="groupPanelId(item)" class="ml-5 mt-1 flex flex-col gap-1 border-l border-md-gray-200 pl-3">
              @for (child of item.children; track child.route) {
                <li>
                  <a
                    [routerLink]="child.route"
                    class="block truncate rounded-md-control px-3 py-1.5 transition hover:bg-md-gray-100"
                    [class.bg-md-dark-gradient]="isLinkActive(child)"
                    [class.text-white]="isLinkActive(child)"
                    [class.font-semibold]="isLinkActive(child)"
                    [class.text-md-gray-800]="!isLinkActive(child)"
                    [attr.aria-current]="isLinkActive(child) ? 'page' : null"
                    (click)="navigated.emit()"
                    >{{ child.label }}</a
                  >
                </li>
              }
            </ul>
          }
        } @else {
          <a
            [routerLink]="item.route"
            class="flex items-center gap-3 rounded-md-control px-3 py-2 font-medium transition hover:bg-md-gray-100"
            [class.bg-md-dark-gradient]="isLinkActive(item)"
            [class.text-white]="isLinkActive(item)"
            [class.text-md-gray-800]="!isLinkActive(item)"
            [attr.aria-current]="isLinkActive(item) ? 'page' : null"
            [attr.title]="expanded ? null : item.label"
            (click)="navigated.emit()"
          >
            <app-icon [name]="item.icon ?? ''" [size]="20" />
            <span class="truncate" [class.sr-only]="!expanded">{{ item.label }}</span>
          </a>
        }
      </li>
    }
  </ul>
</nav>
